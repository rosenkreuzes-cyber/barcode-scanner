<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (カメラ撮影・プレビュー完全版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    input { color-scheme: dark; text-transform: uppercase; }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100% !important; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #000 !important; padding: 4px 6px; font-size: 11px !important; color: black !important; }
      th { background-color: #f2f2f2 !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body class="p-3 max-w-xl mx-auto w-full">

  <!-- 隠しファイル入力（CSV読込用） -->
  <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="loadCSVFile(event)" />

  <!-- TOP画面（基本情報） -->
  <div id="view-home" class="space-y-4">
    <h1 class="text-3xl font-extrabold text-center text-[#F5D887] mt-2">QuickScan DB</h1>
    <p class="text-sm text-center text-[#E6DAA6]/80">基本情報設定</p>

    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <div>
        <button onclick="document.getElementById('csvFileInput').click()" class="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base shadow-md">
          📂 保存済みCSVを読み込んで編集・追記
        </button>
      </div>
    </div>

    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <div>
        <label class="block text-sm font-bold mb-1">製造指図書No</label>
        <input type="text" id="docNo" placeholder="例: ORD-2026-X" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">機種名</label>
        <input type="text" id="modelName" placeholder="例: MODEL-A100" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">記入日</label>
          <input type="text" id="entryDate" readonly class="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70" />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">客先名</label>
          <input type="text" id="customer" placeholder="客先名" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">号機No</label>
          <input type="number" id="unitNo" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">発注台数</label>
          <input type="number" id="orderQty" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">エレキ担当</label>
        <input type="text" id="elecStaff" placeholder="担当者名" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
    </div>

    <button onclick="goToInput()" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl mt-4">入力を開始 (電源ユニットへ)</button>
  </div>

  <!-- ユニット入力画面 -->
  <div id="view-input" class="hidden space-y-3">
    <div class="flex justify-between items-center text-base text-[#E6DAA6] font-bold">
      <button onclick="prevStep()" class="hover:underline">← 前へ</button>
      <span id="step-indicator">1 / 5</span>
      <button onclick="goToTop()" class="hover:underline text-[#F5D887]">🏠 TOP</button>
    </div>

    <h2 id="unit-title" class="text-2xl font-bold text-center text-[#F5D887]">電源ユニット 画面</h2>

    <div class="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 rounded-2xl text-center shadow-lg">
      <div class="relative w-full h-52 bg-black rounded-xl overflow-hidden flex items-center justify-center mb-2 border border-[#E6DAA6]/20">
        <!-- ライブカメラ映像 -->
        <video id="video" playsInline muted autoplay class="w-full h-full object-cover"></video>
        <!-- 撮影した静止画のプレビュー表示用画像タグ -->
        <img id="photo-preview" class="w-full h-full object-cover hidden" alt="撮影プレビュー" />
        <span id="cam-status" class="absolute bottom-2 text-xs bg-black/60 px-2 py-1 rounded text-[#00ffcc] font-mono font-bold">カメラ停止中</span>
        <canvas id="canvas" class="hidden"></canvas>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleCamera()" id="cam-btn" class="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base">📷 カメラ起動</button>
        <button onclick="captureImage()" id="capture-btn" class="hidden flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base shadow-md">📸 撮影する</button>
      </div>
    </div>

    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <div id="title-field-wrap" class="hidden">
        <label class="block text-sm mb-1 font-bold">機器名称</label>
        <input type="text" id="f-title" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="例: サーボパック" />
      </div>
      <div>
        <label class="block text-sm mb-1 font-bold">製品型式</label>
        <input type="text" id="f-model" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="型式" />
      </div>
      <div>
        <label class="block text-sm mb-1 font-bold">シリアルNo</label>
        <input type="text" id="f-serial" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="シリアル" />
      </div>
      <div>
        <label class="block text-sm mb-1 font-bold">備考 (バージョン情報等)</label>
        <input type="text" id="f-remarks" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="例: A03" />
      </div>
    </div>

    <div id="add-btn-wrap" class="hidden">
      <button onclick="addDevice()" class="w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10 shadow-md">＋ 機器追加 (各種機器画面へ)</button>
    </div>

    <button onclick="nextStep()" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
  </div>

  <!-- 印刷プレビュー画面 -->
  <div id="view-result" class="hidden space-y-3">
    <div class="no-print flex flex-wrap justify-between items-center gap-2 mb-2">
      <button onclick="goToInput()" class="text-[#E6DAA6] font-bold">← 修正に戻る</button>
      <div class="flex gap-2">
        <button onclick="document.getElementById('csvFileInput').click()" class="bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] font-bold px-3 py-2 rounded-full text-sm">📂 読込</button>
        <button onclick="saveCSV()" class="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2 rounded-full text-sm">💾 CSV保存</button>
        <button onclick="window.print()" class="bg-[#F5D887] text-[#042219] font-bold px-4 py-2 rounded-full text-sm shadow-md">🖨 印刷</button>
      </div>
    </div>

    <div class="print-area bg-white text-black p-4 rounded-lg shadow-xl overflow-x-auto min-w-[680px]">
      <h1 class="text-center font-bold text-xl mb-3 border-b-2 border-black pb-1">シリアル記入シート</h1>
      <table class="w-full text-xs border-collapse border border-black mb-3">
        <tbody>
          <tr>
            <th class="border border-black p-1 bg-gray-100 w-20">製造指図書No</th>
            <td id="p-docNo" class="border border-black p-1 font-bold"></td>
            <th class="border border-black p-1 bg-gray-100 w-16">客先名</th>
            <td id="p-customer" class="border border-black p-1"></td>
          </tr>
          <tr>
            <th class="border border-black p-1 bg-gray-100">機種名</th>
            <td id="p-modelName" class="border border-black p-1 font-bold"></td>
            <th class="border border-black p-1 bg-gray-100">号機No</th>
            <td id="p-unitNo" class="border border-black p-1"></td>
          </tr>
          <tr>
            <th class="border border-black p-1 bg-gray-100">記入日</th>
            <td id="p-entryDate" class="border border-black p-1"></td>
            <th class="border border-black p-1 bg-gray-100">発注台数</th>
            <td id="p-orderQty" class="border border-black p-1"></td>
          </tr>
          <tr>
            <th class="border border-black p-1 bg-gray-100" colspan="2"></th>
            <th class="border border-black p-1 bg-gray-100">エレキ担当</th>
            <td id="p-elecStaff" class="border border-black p-1"></td>
          </tr>
        </tbody>
      </table>

      <table class="w-full text-xs border-collapse border border-black">
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-black p-1 text-center w-8">No</th>
            <th class="border border-black p-1 w-32">製品型式</th>
            <th class="border border-black p-1 w-32">シリアルNo</th>
            <th class="border border-black p-1 w-20">機器名称</th>
            <th class="border border-black p-1">備考</th>
          </tr>
        </thead>
        <tbody id="p-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 日付初期設定
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    document.getElementById('entryDate').value = `${now.getFullYear()}/${mm}/${dd}`;

    let items = [
      { title: '電源ユニット', model: '', serial: '', remarks: '' },
      { title: 'CPU', model: '', serial: '', remarks: '' },
      { title: 'ベースユニット', model: '', serial: '', remarks: '' },
      { title: 'LIO-04', model: '', serial: '', remarks: '' }
    ];
    let currentStep = 0;
    let mediaStream = null;

    function goToTop() {
      saveCurrentForm();
      currentStep = 0;
      stopCamera();
      render();
    }

    function goToInput() {
      currentStep = 0;
      render();
    }

    function nextStep() {
      saveCurrentForm();
      if (currentStep < items.length - 1) {
        currentStep++;
      } else {
        currentStep = 999;
      }
      stopCamera();
      render();
    }

    function prevStep() {
      saveCurrentForm();
      if (currentStep > 0) {
        currentStep--;
        stopCamera();
        render();
      } else {
        goToTop();
      }
    }

    function addDevice() {
      saveCurrentForm();
      items.push({ title: '各種機器', model: '', serial: '', remarks: '' });
      currentStep = items.length - 1;
      stopCamera();
      render();
    }

    function saveCurrentForm() {
      if (currentStep >= 0 && currentStep < items.length) {
        items[currentStep].model = document.getElementById('f-model').value.toUpperCase();
        items[currentStep].serial = document.getElementById('f-serial').value.toUpperCase();
        items[currentStep].remarks = document.getElementById('f-remarks').value.toUpperCase();
        if (currentStep >= 4) {
          items[currentStep].title = document.getElementById('f-title').value.toUpperCase();
        }
      }
    }

    function render() {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-input').classList.add('hidden');
      document.getElementById('view-result').classList.add('hidden');

      if (currentStep === 0 && !window.inInputFlow) {
        document.getElementById('view-home').classList.remove('hidden');
      } else if (currentStep !== 999) {
        window.inInputFlow = true;
        document.getElementById('view-input').classList.remove('hidden');
        const item = items[currentStep];
        document.getElementById('unit-title').innerText = currentStep >= 4 ? `各種機器 ${currentStep - 3} 画面` : `${item.title} 画面`;
        document.getElementById('step-indicator').innerText = `${currentStep + 1} / ${items.length}`;
        
        document.getElementById('f-model').value = item.model || '';
        document.getElementById('f-serial').value = item.serial || '';
        document.getElementById('f-remarks').value = item.remarks || '';

        const titleWrap = document.getElementById('title-field-wrap');
        const addBtnWrap = document.getElementById('add-btn-wrap');

        if (currentStep >= 4) {
          titleWrap.classList.remove('hidden');
          document.getElementById('f-title').value = item.title || '';
        } else {
          titleWrap.classList.add('hidden');
        }

        if (currentStep === 3) {
          addBtnWrap.classList.remove('hidden');
        } else {
          addBtnWrap.classList.add('hidden');
        }

        // カメラプレビューをリセットしてビデオ表示に戻す
        document.getElementById('video').classList.remove('hidden');
        document.getElementById('photo-preview').classList.add('hidden');
        document.getElementById('capture-btn').classList.add('hidden');
        document.getElementById
