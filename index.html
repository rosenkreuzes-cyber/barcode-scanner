<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    input, select, textarea {
      color-scheme: dark;
      text-transform: uppercase;
    }
    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }
    @media print {
      body, #root { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #000 !important; padding: 4px 6px; font-size: 11px !important; text-align: left; color: black !important; }
      th { background-color: #f2f2f2 !important; font-weight: bold; }
      .print-large-text { font-size: 13px !important; font-weight: bold !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body class="h-full">
  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">システム起動中...</div>
  </div>

  <script>
    try {
      const { useState, useEffect, useRef, createElement: h } = React;

      function LabelOcrScannerCard({ onOcrSuccess, enableSplit = true }) {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState(enableSplit ? 'Status: 待機中 (枠調整対応OCR)' : 'Status: 待機中 (通常OCR)');
        
        const [boxes, setBoxes] = useState({
          modelBox: { x: 5, y: 8, w: 90, h: 25, color: '#00ffcc', label: '①型式 (水色)' },
          serialBox: { x: 5, y: 38, w: 60, h: 28, color: '#F5D887', label: '②シリアル (黄色)' },
          verBox: { x: 67, y: 38, w: 28, h: 28, color: '#ff6b6b', label: '③Ver (赤)' }
        });

        const containerRef = useRef(null);
        const activeDragRef = useRef(null);
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            setStatus('Status: カメラ起動中...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setIsCamActive(true);
            setStatus('Status: 撮影準備完了 (枠をドラッグで移動・調整)');
          } catch (e) {
            setStatus('Status: カメラ起動エラー');
            alert('カメラの起動に失敗しました。');
          }
        };

        const stopCamera = () => {
          try {
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
          } catch (e) {}
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => stopCamera();
        }, []);

        useEffect(() => {
          const onMove = (e) => {
            if (!activeDragRef.current || !containerRef.current) return;
            const rect = containerRef.current.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = ((clientX - activeDragRef.current.startX) / rect.width) * 100;
            const dy = ((clientY - activeDragRef.current.startY) / rect.height) * 100;
            const { boxKey, type, orig } = activeDragRef.current;

            setBoxes(prev => {
              const target = Object.assign({}, orig);
              if (type === 'move') {
                target.x = Math.max(0, Math.min(100 - target.w, orig.x + dx));
                target.y = Math.max(0, Math.min(100 - target.h, orig.y + dy));
              } else if (type === 'resize') {
                target.w = Math.max(10, Math.min(100 - orig.x, orig.w + dx));
                target.h = Math.max(10, Math.min(100 - orig.y, orig.h + dy));
              }
              const nextBoxes = Object.assign({}, prev);
              nextBoxes[boxKey] = target;
              return nextBoxes;
            });
          };

          const onEnd = () => {
            activeDragRef.current = null;
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onEnd);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onEnd);
          };

          if (activeDragRef.current) {
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
          }

          return () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onEnd);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onEnd);
          };
        }, []);

        const startInteraction = (boxKey, type, e) => {
          e.preventDefault();
          e.stopPropagation();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          activeDragRef.current = {
            boxKey,
            type,
            startX: clientX,
            startY: clientY,
            orig: Object.assign({}, boxes[boxKey])
          };
        };

        const captureAndAnalyze = async () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          ctx.drawImage(video, 0, 0, vWidth, vHeight);

          if (typeof Tesseract === 'undefined') {
            setStatus('Status: OCRライブラリ未読込');
            return;
          }

          if (!enableSplit) {
            setStatus('Status: OCR解析中...');
            try {
              const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
              const result = await Tesseract.recognize(dataUrl, 'eng+jpn');
              const rawText = result.data.text || '';
              setStatus('Status: 解析完了！');
              
              let model = '', sn = '';
              const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              if (lines.length > 0) model = lines[0];
              if (lines.length > 1) sn = lines[1];

              onOcrSuccess({
                model: model.toUpperCase(),
                sn: sn.toUpperCase(),
                remarks: ''
              });
            } catch (err) {
              setStatus('Status: OCRスキップ');
            }
            return;
          }

          setStatus('Status: 枠内を高精度解析中...');

          try {
            const cropImage = (box) => {
              const subCanvas = document.createElement('canvas');
              const subCtx = subCanvas.getContext('2d');
              const sx = Math.floor(vWidth * (box.x / 100));
              const sy = Math.floor(vHeight * (box.y / 100));
              const sw = Math.floor(vWidth * (box.w / 100));
              const sh = Math.floor(vHeight * (box.h / 100));

              subCanvas.width = sw;
              subCanvas.height = sh;
              subCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
              return subCanvas.toDataURL('image/jpeg', 0.95);
            };

            const modelImg = cropImage(boxes.modelBox);
            const serialImg = cropImage(boxes.serialBox);
            const verImg = cropImage(boxes.verBox);

            const [resModel, resSerial, resVer] = await Promise.all([
              Tesseract.recognize(modelImg, 'eng+jpn').catch(() => ({ data: { text: '' } })),
              Tesseract.recognize(serialImg, 'eng+jpn').catch(() => ({ data: { text: '' } })),
              Tesseract.recognize(verImg, 'eng+jpn').catch(() => ({ data: { text: '' } }))
            ]);

            const cleanText = (t) => (t || '').replace(/[\r\n]+/g, ' ').trim().toUpperCase();

            let rawSerial = cleanText(resSerial.data.text);
            if (rawSerial.includes('S/N:')) {
              rawSerial = rawSerial.split('S/N:')[1].trim();
            } else if (rawSerial.includes('S/N')) {
              rawSerial = rawSerial.split('S/N')[1].replace(/^[:\s]+/, '').trim();
            }

            setStatus('Status: 解析完了！');
            onOcrSuccess({
              model: cleanText(resModel.data.text),
              sn: rawSerial,
              remarks: cleanText(resVer.data.text)
            });

          } catch (err) {
            setStatus('Status: OCRスキップ');
          }
        };

        return h('div', { className: 'bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg' },
          h('div', { 
            ref: containerRef,
            className: 'relative w-full h-72 sm:h-80 bg-black rounded-xl overflow-hidden mb-3 border border-[#E6DAA6]/30 select-none touch-none flex items-center justify-center'
          },
            h('video', { ref: videoRef, playsInline: true, muted: true, autoPlay: true, className: 'absolute inset-0 w-full h-full object-contain ' + (!isCamActive ? 'hidden' : '') }),
            isCamActive && enableSplit && Object.entries(boxes).map(([key, box]) => {
              return h('div', {
                key: key,
                style: {
                  left: box.x + '%',
                  top: box.y + '%',
                  width: box.w + '%',
                  height: box.h + '%',
                  borderColor: box.color
                },
                className: 'absolute border-2 border-dashed rounded-lg bg-black/40 flex flex-col justify-between p-1 z-10 cursor-move shadow-md',
                onMouseDown: (e) => startInteraction(key, 'move', e),
                onTouchStart: (e) => startInteraction(key, 'move', e)
              },
                h('div', { className: 'flex justify-between items-center text-[10px] font-bold px-1 py-0.5 rounded', style: { color: box.color, backgroundColor: 'rgba(0,0,0,0.8)' } },
                  h('span', null, box.label),
                  h('span', { className: 'text-[9px] opacity-90' }, '移動')
                ),
                h('div', {
                  className: 'absolute bottom-0 right-0 w-6 h-6 bg-white/90 rounded-tl-lg cursor-se-resize flex items-center justify-center text-black font-bold text-[10px]',
                  onMouseDown: (e) => startInteraction(key, 'resize', e),
                  onTouchStart: (e) => startInteraction(key, 'resize', e),
                  title: 'サイズ変更'
                }, '◢')
              );
            }),
            !isCamActive && h('div', { className: 'absolute inset-0 flex items-center justify-center text-base text-[#E6DAA6]/70 z-10' }, '📷 カメラ停止中'),
            h('canvas', { ref: canvasRef, className: 'hidden' })
          ),
          h('div', { className: 'flex gap-2 mb-2' },
            !isCamActive ? 
              h('button', { onClick: startCamera, className: 'flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base sm:text-lg' }, '📷 カメラ起動') :
              h('button', { onClick: captureAndAnalyze, className: 'flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base sm:text-lg shadow-md' }, enableSplit ? '🔍 銘板エリアを撮影 & OCR' : '🔍 撮影 & OCR解析')
          ),
          h('div', { className: 'text-xs text-[#00ffcc] font-mono font-bold' }, status)
        );
      }

      function MainApp() {
        const fileInputRef = useRef(null);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayFormatted = now.getFullYear() + '/' + mm + '/' + dd;
        const yymmdd = yy + mm + dd;

        const [baseInfo, setBaseInfo] = useState({
          docNo: '', modelName: '', entryDate: todayFormatted, customer: '', unitNo: '', orderQty: '', elecStaff: ''
        });

        const [fixedUnits, setFixedUnits] = useState([
          { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
          { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
          { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
          { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
        ]);

        const [devicePacks, setDevicePacks] = useState([
          { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
        ]);

        const [step, setStep] = useState(0);

        const handleNextFromHome = () => setStep(1);

        const handleAddDevice = () => {
          const nextIndex = devicePacks.length + 1;
          setDevicePacks(devicePacks.concat([{ id: 'device_' + Date.now(), title: '', model: '', serial: '', remarks: '' }]));
          setStep(4 + nextIndex);
        };

        const handleGoTop = () => {
          if (window.confirm('TOP画面に戻りますか？')) setStep(0);
        };

        const handlePrint = () => window.print();

        const handleLoadCSV = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
              const clean = (val) => val ? val.replace(/^"|"$/g, '').trim().toUpperCase() : '';

              let newBaseInfo = Object.assign({}, baseInfo);
              lines.forEach(line => {
                const cols = line.split(',').map(clean);
                if (cols[0] === '製造指図書NO' || cols[0] === '製造指図書No') {
                  newBaseInfo.docNo = cols[1] || '';
                  newBaseInfo.customer = cols[3] || '';
                } else if (cols[0] === '機種名') {
                  newBaseInfo.modelName = cols[1] || '';
                  newBaseInfo.unitNo = cols[3] || '';
                } else if (cols[0] === '記入日') {
                  newBaseInfo.entryDate = cols[1] || todayFormatted;
                  newBaseInfo.orderQty = cols[3] || '';
                } else if (cols[2] === 'エレキ担当') {
                  newBaseInfo.elecStaff = cols[3] || '';
                }
              });
              setBaseInfo(Object.assign({}, newBaseInfo, {
                docNo: newBaseInfo.docNo.toUpperCase(),
                modelName: newBaseInfo.modelName.toUpperCase(),
                customer: newBaseInfo.customer.toUpperCase(),
                elecStaff: newBaseInfo.elecStaff.toUpperCase()
              }));

              const tableHeaderIdx = lines.findIndex(l => l.includes('No,製品型式') || l.includes('NO,製品型式'));
              if (tableHeaderIdx !== -1) {
                const itemLines = lines.slice(tableHeaderIdx + 1);

                let newFixed = [
                  { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
                  { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
                  { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
                  { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
                ];
                let newDevices = [];

                itemLines.forEach((line, idx) => {
                  if (idx >= 25) return;
                  const match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                  const cols = match ? match.map(clean) : [];
                  
                  const no = parseInt(cols[0], 10);
                  if (isNaN(no)) return;

                  const model = cols[1] || '';
                  const serial = cols[2] || '';
                  const title = cols[3] || '';
                  const remarks = cols[4] || '';

                  if (no >= 1 && no <= 4) {
                    newFixed[no - 1].model = model.toUpperCase();
                    newFixed[no - 1].serial = serial.toUpperCase();
                    newFixed[no - 1].remarks = remarks.toUpperCase();
                  } else if (no >= 5) {
                    if (model || serial || title || remarks || newDevices.length > 0) {
                      newDevices.push({
                        id: 'device_' + Date.now() + '_' + no,
                        title: title.toUpperCase(),
                        model: model.toUpperCase(),
                        serial: serial.toUpperCase(),
                        remarks: remarks.toUpperCase()
                      });
                    }
                  }
                });

                setFixedUnits(newFixed);
                if (newDevices.length > 0) {
                  setDevicePacks(newDevices);
                } else {
                  setDevicePacks([{ id: 'device_1', title: '', model: '', serial: '', remarks: '' }]);
                }
              }

              alert('CSVファイルからデータを復元しました。');
              if (fileInputRef.current) fileInputRef.current.value = '';
            } catch (err) {
              alert('CSVファイルの読み込みに失敗しました。');
            }
          };
          reader.readAsText(file, 'UTF-8');
        };

        const handleSaveCSV = () => {
          const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_').toUpperCase();
          const filename = yymmdd + '_' + (sanitize(baseInfo.modelName) || '機種名') + '_' + (sanitize(baseInfo.docNo) || '指図書No') + '_' + (sanitize(baseInfo.unitNo) || '号機') + '.csv';

          let csvContent = "\uFEFF";
          csvContent += '製造指図書No,' + (baseInfo.docNo || '').toUpperCase() + ',客先名,' + (baseInfo.customer || '').toUpperCase() + '\n';
          csvContent += '機種名,' + (baseInfo.modelName || '').toUpperCase() + ',号機No,' + baseInfo.unitNo + '\n';
          csvContent += '記入日,' + baseInfo.entryDate + ',発注台数,' + baseInfo.orderQty + '\n';
          csvContent += ',,エレキ担当,' + (baseInfo.elecStaff || '').toUpperCase() + '\n\n';
          csvContent += 'No,製品型式,シリアルNo,機器名称,備考\n';

          const allItems = fixedUnits.map(u => ({
            model: (u.model || '').toUpperCase(), serial: (u.serial || '').toUpperCase(), title: (u.title || '').toUpperCase(), remarks: (u.remarks || '').toUpperCase()
          })).concat(devicePacks.map(s => ({
            model: (s.model || '').toUpperCase(), serial: (s.serial || '').toUpperCase(), title: (s.title || '').toUpperCase(), remarks: (s.remarks || '').toUpperCase()
          })));

          for (let i = 1; i <= 25; i++) {
            const item = allItems[i - 1] || {};
            csvContent += i + ',"' + (item.model || '') + '","' + (item.serial || '') + '","' + (item.title || '') + '","' + (item.remarks || '') + '"\n';
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        if (step === 0) {
          return h('div', { className: 'app-container max-w-xl mx-auto w-full px-4 justify-between' },
            h('input', { type: 'file', accept: '.csv', ref: fileInputRef, onChange: handleLoadCSV, className: 'hidden' }),
            h('div', { className: 'w-full flex-1 flex flex-col justify-evenly py-2' },
              h('div', null,
                h('h1', { className: 'text-3xl font-extrabold text-center text-[#F5D887] mb-1' }, 'QuickScan DB'),
                h('p', { className: 'text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium' }, '✨ 銘板最適化 (水色:型式 / 黄色:シリアル / 赤:Ver) 大文字版')
              ),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2 space-y-3' },
                h('div', null,
                  h('button', {
                    onClick: () => fileInputRef.current && fileInputRef.current.click(),
                    className: 'w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base flex items-center justify-center gap-2 active:scale-95 shadow-md'
                  }, '📂 保存済みCSVを読み込んで編集・追記')
                )
              ),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3' },
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, '製造指図書No'),
                  h('input', { type: 'text', value: baseInfo.docNo, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { docNo: e.target.value.toUpperCase() })), placeholder: '例: ORD-2026-X', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, '機種名'),
                  h('input', { type: 'text', value: baseInfo.modelName, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { modelName: e.target.value.toUpperCase() })), placeholder: '例: MODEL-A100', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', { className: 'flex gap-2' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '記入日 (自動)'),
                    h('input', { type: 'text', value: baseInfo.entryDate, readOnly: true, className: 'w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono' })
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '客先名'),
                    h('input', { type: 'text', value: baseInfo.customer, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { customer: e.target.value.toUpperCase() })), placeholder: '例: TANAKA', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                  )
                ),
                h('div', { className: 'flex gap-2' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '号機No (数値)'),
                    h('input', { type: 'number', value: baseInfo.unitNo, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { unitNo: e.target.value })), placeholder: '1', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono' })
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '発注台数 (数値)'),
                    h('input', { type: 'number', value: baseInfo.orderQty, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { orderQty: e.target.value })), placeholder: '1', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono' })
                  )
                ),
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, 'エレキ担当'),
                  h('input', { type: 'text', value: baseInfo.elecStaff, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { elecStaff: e.target.value.toUpperCase() })), placeholder: '例: YAMADA', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                )
              )
            ),
            h('div', { className: 'py-3' },
              h('button', { onClick: handleNextFromHome, className: 'w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl' }, '入力を開始 (電源ユニットへ)')
            )
          );
        }

        if (step >= 1 && step <= 4) {
          const uIndex = step - 1;
          const current = fixedUnits[uIndex];
          const isLio04 = (uIndex === 3);

          return h('div', { className: 'app-container max-w-xl mx-auto w-full px-4 justify-between' },
            h('div', { className: 'w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto' },
              h('div', null,
                h('div', { className: 'flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold' },
                  h('button', { onClick: () => setStep(step - 1), className: 'hover:underline' }, '← 前へ'),
                  h('span', null, step + ' / ' + (4 + devicePacks.length))
                ),
                h('h2', { className: 'text-2xl font-bold text-center text-[#F5D887] mb-2' }, current.title + ' 画面')
              ),
              h(LabelOcrScannerCard, {
                enableSplit: true,
                onOcrSuccess: (res) => {
                  const updated = fixedUnits.slice();
                  if (res.model) updated[uIndex].model = res.model.toUpperCase();
                  if (res.sn) updated[uIndex].serial = res.sn.toUpperCase();
                  if (res.remarks) updated[uIndex].remarks = res.remarks.toUpperCase();
                  setFixedUnits(updated);
                }
              }),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3' },
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#00ffcc]' }, '製品型式 (①水色枠)'),
                  h('input', { type: 'text', value: current.model, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].model = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: '型式を入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#F5D887]' }, 'シリアルNo (②黄色枠)'),
                  h('input', { type: 'text', value: current.serial, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].serial = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: 'シリアルを入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#ff6b6b]' }, '備考・Ver (③赤枠)'),
                  h('input', { type: 'text', value: current.remarks, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].remarks = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: '例: A02 / VER.1.0', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                )
              ),
              isLio04 && h('div', { className: 'mt-3' },
                h('button', { onClick: handleAddDevice, className: 'w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10 shadow-md' }, '＋ 機器追加 (各種機器画面へ進む)')
              )
            ),
            h('div', { className: 'py-3' },
              h('button', { onClick: () => setStep(step + 1), className: 'w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg' }, '次へ')
            )
          );
        }

        if (step >= 5 && step < 999) {
          const sIndex = step - 5;
          const current = devicePacks[sIndex];

          return h('div', { className: 'app-container max-w-xl mx-auto w-full px-4 justify-between' },
            h('div', { className: 'w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto' },
              h('div', null,
                h('div', { className: 'flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold' },
                  h('button', { onClick: () => setStep(step - 1), className: 'hover:underline' }, '← 前へ'),
                  h('span', null, step + ' / ' + (4 + devicePacks.length))
                ),
                h('h2', { className: 'text-2xl font-bold text-center text-[#F5D887] mb-2' }, '各種機器 ' + (sIndex + 1) + ' 画面')
              ),
              h(LabelOcrScannerCard, {
                enableSplit: false,
                onOcrSuccess: (res) => {
                  const updated = devicePacks.slice();
                  if (res.model) updated[sIndex].model = res.model.toUpperCase();
                  if (res.sn) updated[sIndex].serial = res.sn.toUpperCase();
                  setDevicePacks(updated);
                }
              }),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3' },
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold' }, '機器名称'),
                  h('input', { type: 'text', value: current.title, onChange: (e) => { const s = devicePacks.slice(); s[sIndex].title = e.target.value.toUpperCase(); setDevicePacks(s); }, placeholder: '例: サーボパック / インバータ', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold' }, '製品型式'),
                  h('input', { type: 'text', value: current.model, onChange: (e) => { const s = devicePacks.slice(); s[sIndex].model = e.target.value.toUpperCase(); setDevicePacks(s); }, placeholder: '型式を入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm font-bold' }, 'シリアルNo'),
                  h('input', { type: 'text', value: current.serial, onChange: (e) => { const s = devicePacks.slice(); s[sIndex].serial = e.target.value.toUpperCase(); setDevicePacks(s); }, placeholder: 'シリアルを入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                )
              ),
              h('div', { className: 'mt-2' },
                h('button', { onClick: handleAddDevice, className: 'w-full border border-dashed border-[#F5D887] text-[#F5D887] py-3 rounded-xl text-base font-bold bg-[#F5D887]/10' }, '＋ さらに機器追加')
              )
            ),
            h('div', { className: 'py-3 space-y-2' },
              sIndex < devicePacks.length - 1 && h('button', { onClick: () => setStep(step + 1), className: 'w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-base font-bold' }, '次の各種機器 (' + (sIndex + 2) + ') へ'),
              h('button', { onClick: () => setStep(999), className: 'w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg' }, '入力結果へ (印刷プレビュー表示)')
            )
          );
        }

        if (step === 999) {
          const allItems = fixedUnits.map(u => ({
            model: (u.model || '').toUpperCase(), serial: (u.serial || '').toUpperCase(), title: (u.title || '').toUpperCase(), remarks: (u.remarks || '').toUpperCase()
          })).concat(devicePacks.map(s => ({
            model: (s.model || '').toUpperCase(), serial: (s.serial || '').toUpperCase(), title: (s.title || '').toUpperCase(), remarks: (s.remarks || '').toUpperCase()
          })));

          const rows = Array.from({ length: 25 }, (_, index) => allItems[index] || { model: '', serial: '', title: '', remarks: '' });

          return h('div', { className: 'min-h-[100dvh] p-2 sm:p-4 max-w-5xl mx-auto w-full' },
            h('input', { type: 'file', accept: '.csv', ref: fileInputRef, onChange: handleLoadCSV, className: 'hidden' }),
            h('div', { className: 'no-print flex flex-wrap justify-between items-center gap-2 mb-4' },
              h('div', { className: 'flex gap-3 items-center' },
                h('button', { onClick: () => setStep(4 + devicePacks.length), className: 'text-[#E6DAA6] text-base font-bold hover:underline' }, '← 修正に戻る'),
                h('button', { onClick: handleGoTop, className: 'text-[#F5D887] text-base font-bold hover:underline' }, '🏠 TOP画面へ')
              ),
              h('div', { className: 'flex gap-2' },
                h('button', { onClick: () => fileInputRef.current && fileInputRef.current.click(), className: 'bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] font-bold px-3 py-2.5 rounded-full text-sm sm:text-base active:scale-95' }, '📂 CSV読込'),
                h('button', { onClick: handleSaveCSV, className: 'bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base' }, '💾 CSV保存'),
                h('button', { onClick: handlePrint, className: 'bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base text-center shadow-md active:scale-95' }, '🖨 印刷')
              )
            ),
            h('div', { className: 'overflow-x-auto w-full border border-gray-700/50 rounded-lg' },
              h('div', { className: 'print-area bg-white text-black p-4 sm:p-6 rounded-lg shadow-xl min-w-[680px]' },
                h('h1', { className: 'text-center font-bold text-xl sm:text-2xl mb-3 tracking-widest border-b-2 border-black pb-1' }, 'シリアル記入シート'),
                h('table', { className: 'w-full text-xs sm:text-sm border-collapse border border-black mb-3' },
                  h('tbody', null,
                    h('tr', null,
                      h('th', { className: 'border border-black p-1 bg-gray-100 w-[15%] text-left' }, '製造指図書No'),
                      h('td', { className: 'border border-black p-1 w-[35%] font-bold' }, (baseInfo.docNo || '').toUpperCase()),
                      h('th', { className: 'border border-black p-1 bg-gray-100 w-[15%] text-left' }, '客先名'),
                      h('td', { className: 'border border-black p-1 w-[35%] font-bold' }, (baseInfo.customer || '').toUpperCase())
                    ),
                    h('tr', null,
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left' }, '機種名'),
                      h('td', { className: 'border border-black p-1 font-bold' }, (baseInfo.modelName || '').toUpperCase()),
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left' }, '号機No'),
                      h('td', { className: 'border border-black p-1' }, baseInfo.unitNo)
                    ),
                    h('tr', null,
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left' }, '記入日'),
                      h('td', { className: 'border border-black p-1' }, baseInfo.entryDate),
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left' }, '発注台数'),
                      h('td', { className: 'border border-black p-1' }, baseInfo.orderQty)
                    ),
                    h('tr', null,
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left', colSpan: 2 }, ''),
                      h('th', { className: 'border border-black p-1 bg-gray-100 text-left' }, 'エレキ担当'),
                      h('td', { className: 'border border-black p-1' }, (baseInfo.elecStaff || '').toUpperCase())
                    )
                  )
                ),
                h('table', { className: 'w-full text-xs sm:text-sm border-collapse border border-black' },
                  h('thead', null,
                    h('tr', { className: 'bg-gray-200 border-b border-black' },
                      h('th', { className: 'border-r border-black p-1 text-center w-8' }, 'No'),
                      h('th', { className: 'border-r border-black p-1 w-[28%]' }, '製品型式'),
                      h('th', { className: 'border-r border-black p-1 w-[28%]' }, 'シリアルNo'),
                      h('th', { className: 'border-r border-black p-1 w-[16%]' }, '機器名称'),
                      h('th', { className: 'p-1 w-[28%]' }, '備考')
                    )
                  ),
                  h('tbody', null, rows.map((row, idx) =>
                    h('tr', { key: idx, className: 'border-b border-black h-5 sm:h-6' },
                      h('td', { className: 'border-r border-black text-center font-bold bg-gray-50' }, idx + 1),
                      h('td', { className: 'border-r border-black px-1 text-sm sm:text-base font-bold print-large-text' }, (row.model || '').toUpperCase()),
                      h('td', { className: 'border-r border-black px-1 text-sm sm:text-base font-bold print-large-text' }, (row.serial || '').toUpperCase()),
                      h('td', { className: 'border-r border-black px-1 text-xs sm:text-sm' }, (row.title || '').toUpperCase()),
                      h('td', { className: 'px-1 text-xs sm:text-sm' }, (row.remarks || '').toUpperCase())
                    )
                  ))
                )
              )
            )
          );
        }

        return null;
      }

      function App() {
        return h(MainApp);
      }

      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(h(App));
      }
    } catch (err) {
      console.error(err);
      const rootEl = document.getElementById('root');
      if (rootEl) {
        rootEl.innerHTML = '<div style="padding:20px; color:#ff6b6b; font-weight:bold; background:#042219; height:100vh; text-align:center;">エラーが発生しました。<br><br>' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
