<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (3分割OCR版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tesseract.js (ブラウザ完結型OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">読み込み中...</div>
  </div>

  <script type="text/babel">
    try {
      const { useState, useEffect, useRef } = React;

      // --- 3分割指定対応 OCR カメラ・解析コンポーネント ---
      const SplitOcrScannerCard = ({ onOcrSuccess, enableSplit = true }) => {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState('Status: 待機中 (3分割指定対応)');
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play();
            }
            setIsCamActive(true);
            setStatus('Status: 撮影準備完了 (枠に合わせて撮影)');
          } catch (e) {
            alert('カメラの起動に失敗しました。');
          }
        };

        const stopCamera = () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(track => track.stop());
            streamRef.current = null;
          }
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => stopCamera();
        }, []);

        const captureAndAnalyze = async () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, vWidth, vHeight);

          if (!enableSplit) {
            // 通常全体OCR
            setStatus('Status: OCR解析中...');
            try {
              const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
              const result = await Tesseract.recognize(dataUrl, 'eng+jpn');
              const rawText = result.data.text || '';
              setStatus('Status: 解析完了！');
              
              let model = '', sn = '';
              const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              if (lines.length > 0) model = lines[0];
              if (lines.length > 1) sn = lines[1];

              onOcrSuccess({ model, sn, remarks: '' });
            } catch (err) {
              setStatus(`Status: エラー (${err.message})`);
            }
            return;
          }

          // --- 3分割エリアのクロップ＆個別OCR処理 ---
          setStatus('Status: 3分割エリアを解析中 (型式/SN/備考)...');

          try {
            const subCanvas = document.createElement('canvas');
            const subCtx = subCanvas.getContext('2d');

            // 1. 上段エリア（製品型式）: 高さは全体の約33%
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.35);
            subCtx.drawImage(canvas, 0, 0, vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const modelImg = subCanvas.toDataURL('image/jpeg', 0.9);

            // 2. 中段エリア（シリアルNo）: 中心の約33%
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.35);
            subCtx.clearRect(0, 0, subCanvas.width, subCanvas.height);
            subCtx.drawImage(canvas, 0, Math.floor(vHeight * 0.33), vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const snImg = subCanvas.toDataURL('image/jpeg', 0.9);

            // 3. 下段エリア（備考・バージョン）: 下部の約34%
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.34);
            subCtx.clearRect(0, 0, subCanvas.width, subCanvas.height);
            subCtx.drawImage(canvas, 0, Math.floor(vHeight * 0.66), vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const remImg = subCanvas.toDataURL('image/jpeg', 0.9);

            // 並行して3箇所のOCRを実行
            const [resModel, resSn, resRem] = await Promise.all([
              Tesseract.recognize(modelImg, 'eng+jpn'),
              Tesseract.recognize(snImg, 'eng+jpn'),
              Tesseract.recognize(remImg, 'eng+jpn')
            ]);

            const cleanText = (t) => (t || '').replace(/[\r\n]+/g, ' ').trim();

            const detectedModel = cleanText(resModel.data.text);
            const detectedSn = cleanText(resSn.data.text);
            const detectedRemarks = cleanText(resRem.data.text);

            setStatus('Status: 3分割解析完了！');
            onOcrSuccess({
              model: detectedModel,
              sn: detectedSn,
              remarks: detectedRemarks
            });

          } catch (err) {
            setStatus(`Status: 3分割OCR解析エラー (${err.message})`);
          }
        };

        return (
          <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg">
            <div className="relative w-full h-56 sm:h-64 bg-black rounded-xl overflow-hidden flex items-center justify-center mb-3 border border-[#E6DAA6]/20">
              <video ref={videoRef} playsInline muted className={`w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
              
              {/* 3分割ガイドフレームの表示 (カメラ起動中かつ分割有効時) */}
              {isCamActive && enableSplit && (
                <div className="absolute inset-0 pointer-events-none flex flex-col justify-between p-2">
                  <div className="border-2 border-dashed border-[#00ffcc] rounded-lg p-1 text-[10px] text-[#00ffcc] bg-black/30 font-bold">① 型式エリア</div>
                  <div className="border-2 border-dashed border-[#F5D887] rounded-lg p-1 text-[10px] text-[#F5D887] bg-black/30 font-bold">② シリアルエリア</div>
                  <div className="border-2 border-dashed border-[#ff9999] rounded-lg p-1 text-[10px] text-[#ff9999] bg-black/30 font-bold">③ 備考・バージョンエリア</div>
                </div>
              )}

              {!isCamActive && <span className="text-base text-[#E6DAA6]/70">📷 カメラ停止中 (3分割OCR)</span>}
              <canvas ref={canvasRef} className="hidden" />
            </div>

            <div className="flex gap-2 mb-2">
              {!isCamActive ? (
                <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base sm:text-lg">📷 カメラ起動</button>
              ) : (
                <button onClick={captureAndAnalyze} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base sm:text-lg shadow-md">🔍 3分割エリア撮影 & OCR解析</button>
              )}
            </div>
            <div className="text-xs text-[#00ffcc] font-mono font-bold">{status}</div>
          </div>
        );
      };

      // --- メインアプリケーション ---
      function MainApp() {
        const fileInputRef = useRef(null);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
        const yymmdd = `${yy}${mm}${dd}`;

        const [baseInfo, setBaseInfo] = useState({
          docNo: '',
          modelName: '',
          entryDate: todayFormatted,
          customer: '',
          unitNo: '',
          orderQty: '',
          elecStaff: ''
        });

        const [fixedUnits, setFixedUnits] = useState([
          { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
          { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
          { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
          { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
        ]);

        const [devicePacks, setDevicePacks] = useState([
          { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
        ]);

        const [step, setStep] = useState(0);

        const handleNextFromHome = () => {
          setStep(1);
        };

        // 機器追加（LIO-04画面または各種機器画面から追加可能）
        const handleAddDevice = () => {
          const nextIndex = devicePacks.length + 1;
          setDevicePacks([
            ...devicePacks,
            { id: `device_${Date.now()}`, title: '', model: '', serial: '', remarks: '' }
          ]);
          setStep(4 + nextIndex); // 各種機器の新規画面へジャンプ
        };

        const handleGoTop = () => {
          if (window.confirm('TOP画面に戻りますか？（入力した情報は保持されます）')) {
            setStep(0);
          }
        };

        const handlePrint = () => {
          window.print();
        };

        // --- CSVファイルの読み込み機能 ---
        const handleLoadCSV = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
              const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : '';

              let newBaseInfo = { ...baseInfo };
              lines.forEach(line => {
                const cols = line.split(',').map(clean);
                if (cols[0] === '製造指図書No') {
                  newBaseInfo.docNo = cols[1] || '';
                  newBaseInfo.customer = cols[3] || '';
                } else if (cols[0] === '機種名') {
                  newBaseInfo.modelName = cols[1] || '';
                  newBaseInfo.unitNo = cols[3] || '';
                } else if (cols[0] === '記入日') {
                  newBaseInfo.entryDate = cols[1] || todayFormatted;
                  newBaseInfo.orderQty = cols[3] || '';
                } else if (cols[2] === 'エレキ担当') {
                  newBaseInfo.elecStaff = cols[3] || '';
                }
              });
              setBaseInfo(newBaseInfo);

              const tableHeaderIdx = lines.findIndex(l => l.includes('No,製品型式,シリアルNo'));
              if (tableHeaderIdx !== -1) {
                const itemLines = lines.slice(tableHeaderIdx + 1);

                let newFixed = [
                  { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
                  { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
                  { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
                  { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
                ];
                let newDevices = [];

                itemLines.forEach((line, idx) => {
                  if (idx >= 25) return;
                  const match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                  const cols = match ? match.map(clean) : [];
                  
                  const no = parseInt(cols[0], 10);
                  if (isNaN(no)) return;

                  const model = cols[1] || '';
                  const serial = cols[2] || '';
                  const title = cols[3] || '';
                  const remarks = cols[4] || '';

                  if (no >= 1 && no <= 4) {
                    newFixed[no - 1].model = model;
                    newFixed[no - 1].serial = serial;
                    newFixed[no - 1].remarks = remarks;
                  } else if (no >= 5) {
                    if (model || serial || title || remarks || newDevices.length > 0) {
                      newDevices.push({
                        id: `device_${Date.now()}_${no}`,
                        title: title,
                        model: model,
                        serial: serial,
                        remarks: remarks
                      });
                    }
                  }
                });

                setFixedUnits(newFixed);
                if (newDevices.length > 0) {
                  setDevicePacks(newDevices);
                } else {
                  setDevicePacks([{ id: 'device_1', title: '', model: '', serial: '', remarks: '' }]);
                }
              }

              alert('CSVファイルからデータを復元しました。');
              if (fileInputRef.current) fileInputRef.current.value = '';
            } catch (err) {
              alert('CSVファイルの読み込みに失敗しました。');
            }
          };

          reader.readAsText(file, 'UTF-8');
        };

        const handleSaveCSV = () => {
          const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_');
          const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種名'}_${sanitize(baseInfo.docNo) || '指図書No'}_${sanitize(baseInfo.unitNo) || '号機'}.csv`;

          let csvContent = "\uFEFF";
          csvContent += `製造指図書No,${baseInfo.docNo},客先名,${baseInfo.customer}\n`;
          csvContent += `機種名,${baseInfo.modelName},号機No,${baseInfo.unitNo}\n`;
          csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
          csvContent += `,,エレキ担当,${baseInfo.elecStaff}\n\n`;
          csvContent += `No,製品型式,シリアルNo,機器名称,備考\n`;

          const allItems = [
            ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
            ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
          ];

          for (let i = 1; i <= 25; i++) {
            const item = allItems[i - 1] || {};
            csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        // --- STEP 0: 初期画面 ---
        if (step === 0) {
          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <input
                type="file"
                accept=".csv"
                ref={fileInputRef}
                onChange={handleLoadCSV}
                className="hidden"
              />

              <div className="w-full flex-1 flex flex-col justify-evenly py-2">
                <div>
                  <h1 className="text-3xl font-extrabold text-center text-[#F5D887] mb-1">QuickScan DB</h1>
                  <p className="text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium">3分割指定OCR版</p>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2 space-y-3">
                  <div>
                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base flex items-center justify-center gap-2 active:scale-95 shadow-md"
                    >
                      📂 保存済みCSVを読み込んで編集・追記
                    </button>
                  </div>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm font-bold mb-1">製造指図書No</label>
                    <input
                      type="text"
                      value={baseInfo.docNo}
                      onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value})}
                      placeholder="例: ORD-2026-X"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">機種名</label>
                    <input
                      type="text"
                      value={baseInfo.modelName}
                      onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value})}
                      placeholder="例: MODEL-A100"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base"
                    />
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">記入日 (自動)</label>
                      <input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono" />
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">客先名</label>
                      <input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value})} placeholder="例: TANAKA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">号機No (数値)</label>
                      <input
                        type="number"
                        value={baseInfo.unitNo}
                        onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})}
                        placeholder="1"
                        className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                      />
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">発注台数 (数値)</label>
                      <input
                        type="number"
                        value={baseInfo.orderQty}
                        onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})}
                        placeholder="1"
                        className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">エレキ担当</label>
                    <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value})} placeholder="例: YAMADA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                </div>
              </div>

              <div className="py-3">
                <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl">入力を開始 (電源ユニットへ)</button>
              </div>
            </div>
          );
        }

        // --- STEP 1~4: 固定ユニット画面 (電源, CPU, ベース, LIO-04) → 3分割OCR有効 ---
        if (step >= 1 && step <= 4) {
          const uIndex = step - 1;
          const current = fixedUnits[uIndex];
          const isLio04 = (uIndex === 3); // LIO-04画面判定

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">{current.title} 画面</h2>
                </div>

                {/* 3分割OCRスキャナー */}
                <SplitOcrScannerCard
                  enableSplit={true}
                  onOcrSuccess={(res) => {
                    const updated = [...fixedUnits];
                    if (res.model) updated[uIndex].model = res.model;
                    if (res.sn) updated[uIndex].serial = res.sn;
                    if (res.remarks) updated[uIndex].remarks = res.remarks;
                    setFixedUnits(updated);
                  }}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式 (①エリア)</label>
                    <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value; setFixedUnits(u); }} placeholder="型式を入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">シリアルNo (②エリア)</label>
                    <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value; setFixedUnits(u); }} placeholder="シリアルを入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">備考 (③エリア)</label>
                    <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value; setFixedUnits(u); }} placeholder="例: REV.A / VER.1.0" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                </div>

                {/* LIO-04画面 (uIndex === 3) のみ機器追加ボタンを設置 */}
                {isLio04 && (
                  <div className="mt-3">
                    <button onClick={handleAddDevice} className="w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10">＋ 機器追加 (各種機器画面へ進む)</button>
                  </div>
                )}
              </div>

              <div className="py-3">
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
              </div>
            </div>
          );
        }

        // --- STEP 5+: 各種機器画面 ---
        if (step >= 5 && step < 999) {
          const sIndex = step - 5;
          const current = devicePacks[sIndex];

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">各種機器 {sIndex + 1} 画面</h2>
                </div>

                {/* 各種機器画面は通常OCR */}
                <SplitOcrScannerCard
                  enableSplit={false}
                  onOcrSuccess={(res) => {
                    const updated = [...devicePacks];
                    if (res.model) updated[sIndex].model = res.model;
                    if (res.sn) updated[sIndex].serial = res.sn;
                    setDevicePacks(updated);
                  }}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">機器名称</label>
                    <input
                      type="text"
                      value={current.title}
                      onChange={(e) => {
                        const s = [...devicePacks];
                        s[sIndex].title = e.target.value;
                        setDevicePacks(s);
                      }}
                      placeholder="例: サーボパック / インバータ"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base"
                    />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式</label>
                    <input type="text" value={current.model} onChange={(e) => { const s = [...devicePacks]; s[sIndex].model = e.target.value; setDevicePacks(s); }} placeholder="型式を入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold">シリアルNo</label>
                    <input type="text" value={current.serial} onChange={(e) => { const s = [...devicePacks]; s[sIndex].serial = e.target.value; setDevicePacks(s); }} placeholder="シリアルを入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                </div>

                <div className="mt-2">
                  <button onClick={handleAddDevice} className="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-3 rounded-xl text-base font-bold bg-[#F5D887]/10">＋ さらに機器追加</button>
                </div>
              </div>

              <div className="py-3 space-y-2">
                {sIndex < devicePacks.length - 1 && (
                  <button onClick={() => setStep(step + 1)} className="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-base font-bold">次の各種機器 ({sIndex + 2}) へ</button>
                )}
                <button onClick={() => setStep(999)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">入力結果へ (印刷プレビュー表示)</button>
              </div>
            </div>
          );
        }

        // --- STEP 999: 入力結果 & 印刷用シリアル記入シート ---
        if (step === 999) {
          const allItems = [
            ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
            ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
          ];

          const rows = Array.from({ length: 25 }, (_, index) => {
            return allItems[index] || { model: '', serial: '', title: '', remarks: '' };
          });

          return (
            <div className="min-h-[100dvh] p-2 sm:p-4 max-w-5xl mx-auto w-full">
              <input
                type="file"
                accept=".csv"
                ref={fileInputRef}
                onChange={handleLoadCSV}
                className="hidden"
              />

              {/* 操作ボタンエリア (非印刷) */}
              <div className="no-print flex flex-wrap justify-between items-center gap-2 mb-4">
                <div className="flex gap-3 items-center">
                  <button onClick={() => setStep(4 + devicePacks.length)} className="text-[#E6DAA6] text-base font-bold hover:underline">
                    ← 修正に戻る
                  </button>
                  <button onClick={handleGoTop} className="text-[#F5D887] text-base font-bold hover:underline">
                    🏠 TOP画面へ
                  </button>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] font-bold px-3 py-2.5 rounded-full text-sm sm:text-base active:scale-95"
                  >
                    📂 CSV読込
                  </button>
                  <button onClick={handleSaveCSV} className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base">
                    💾 CSV保存
                  </button>
                  <button
                    onClick={handlePrint}
                    className="bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base text-center shadow-md active:scale-95"
                  >
                    🖨 印刷 (印刷ダイアログ起動)
                  </button>
                </div>
              </div>

              {/* 横スクロール対応コンテナ */}
              <div className="overflow-x-auto w-full border border-gray-700/50 rounded-lg">
                {/* A4印刷エリア */}
                <div className="print-area bg-white text-black p-4 sm:p-6 rounded-lg shadow-xl min-w-[680px]">
                  <h1 className="text-center font-bold text-xl sm:text-2xl mb-3 tracking-widest border-b-2 border-black pb-1">シリアル記入シート</h1>

                  <table className="w-full text-xs sm:text-sm border-collapse border border-black mb-3">
                    <tbody>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">製造指図書No</th>
                        <td className="border border-black p-1 w-[35%] font-bold">{baseInfo.docNo}</td>
                        <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">客先名</th>
                        <td className="border border-black p-1 w-[35%]">{baseInfo.customer}</td>
                      </tr>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 text-left">機種名</th>
                        <td className="border border-black p-1 font-bold">{baseInfo.modelName}</td>
                        <th className="border border-black p-1 bg-gray-100 text-left">号機No</th>
                        <td className="border border-black p-1">{baseInfo.unitNo}</td>
                      </tr>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 text-left">記入日</th>
                        <td className="border border-black p-1">{baseInfo.entryDate}</td>
                        <th className="border border-black p-1 bg-gray-100 text-left">発注台数</th>
                        <td className="border border-black p-1">{baseInfo.orderQty}</td>
                      </tr>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 text-left" colSpan="2"></th>
                        <th className="border border-black p-1 bg-gray-100 text-left">エレキ担当</th>
                        <td className="border border-black p-1">{baseInfo.elecStaff}</td>
                      </tr>
                    </tbody>
                  </table>

                  <table className="w-full text-xs sm:text-sm border-collapse border border-black">
                    <thead>
                      <tr className="bg-gray-200 border-b border-black">
                        <th className="border-r border-black p-1 text-center w-8">No</th>
                        <th className="border-r border-black p-1 w-[28%]">製品型式</th>
                        <th className="border-r border-black p-1 w-[28%]">シリアルNo</th>
                        <th className="border-r border-black p-1 w-[16%]">機器名称</th>
                        <th className="p-1 w-[28%]">備考</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((row, idx) => (
                        <tr key={idx} className="border-b border-black h-5 sm:h-6">
                          <td className="border-r border-black text-center font-bold bg-gray-50">{idx + 1}</td>
                          <td className="border-r border-black px-1 text-sm sm:text-base font-bold print-large-text">{row.model}</td>
                          <td className="border-r border-black px-1 text-sm sm:text-base font-bold print-large-text">{row.serial}</td>
                          <td className="border-r border-black px-1 text-xs sm:text-sm">{row.title}</td>
                          <td className="px-1 text-xs sm:text-sm">{row.remarks}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        }

        return null;
      }

      function App() {
        return <MainApp />;
      }

      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="padding:20px; color:#ff6b6b; font-weight:bold;">アプリの初期化エラーが発生しました: ${err.message}</div>`;
    }
  </script>
</body>
</html>
