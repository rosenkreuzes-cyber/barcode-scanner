<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (2次元フリー枠調整版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tesseract.js (ブラウザ完結型OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
      text-transform: uppercase;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">システム起動中...</div>
  </div>

  <script type="text/babel">
    try {
      const { useState, useEffect, useRef } = React;

      // --- 2次元フリー枠（上下左右・サイズ変更可能）対応 OCRスキャナーコンポーネント ---
      const FreeBoxOcrScannerCard = ({ onOcrSuccess, enableSplit = true }) => {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState(enableSplit ? 'Status: 待機中 (2次元フリー枠OCR)' : 'Status: 待機中 (通常OCR)');
        
        // 各枠の領域（パーセンテージ: 0~100）
        // 型式枠 (topBox), シリアル枠 (midBox), 備考枠 (btmBox)
        const [boxes, setBoxes] = useState({
          topBox: { x: 5, y: 5, w: 90, h: 28, color: '#00ffcc', label: '① 型式枠' },
          midBox: { x: 5, y: 36, w: 90, h: 28, color: '#F5D887', label: '② シリアル枠' },
          btmBox: { x: 5, y: 67, w: 90, h: 28, color: '#ff9999', label: '③ 備考枠' }
        });

        const containerRef = useRef(null);
        const activeDragRef = useRef(null); // { boxKey, type: 'move'|'resize', startX, startY, origBox }

        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            setStatus('Status: カメラ起動中...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setIsCamActive(true);
            setStatus('Status: 撮影準備完了（枠の中央で移動、端でサイズ変更可能）');
          } catch (e) {
            setStatus('Status: カメラ起動エラー');
            alert('カメラの起動に失敗しました。権限をご確認ください。');
          }
        };

        const stopCamera = () => {
          try {
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
          } catch (e) {}
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => {
            stopCamera();
          };
        }, []);

        // ドラッグ・リサイズ操作のグローバルイベント処理
        useEffect(() => {
          const onMove = (e) => {
            if (!activeDragRef.current || !containerRef.current) return;
            const rect = containerRef.current.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = ((clientX - activeDragRef.current.startX) / rect.width) * 100;
            const dy = ((clientY - activeDragRef.current.startY) / rect.height) * 100;
            const { boxKey, type, orig } = activeDragRef.current;

            setBoxes(prev => {
              const target = { ...orig };
              if (type === 'move') {
                target.x = Math.max(0, Math.min(100 - target.w, orig.x + dx));
                target.y = Math.max(0, Math.min(100 - target.h, orig.y + dy));
              } else if (type === 'resize') {
                target.w = Math.max(15, Math.min(100 - orig.x, orig.w + dx));
                target.h = Math.max(10, Math.min(100 - orig.y, orig.h + dy));
              }
              return { ...prev, [boxKey]: target };
            });
          };

          const onEnd = () => {
            activeDragRef.current = null;
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onEnd);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onEnd);
          };

          if (activeDragRef.current) {
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
          }

          return () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onEnd);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onEnd);
          };
        }, []);

        const startInteraction = (boxKey, type, e) => {
          e.preventDefault();
          e.stopPropagation();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          activeDragRef.current = {
            boxKey,
            type,
            startX: clientX,
            startY: clientY,
            orig: { ...boxes[boxKey] }
          };
        };

        const captureAndAnalyze = async () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          ctx.drawImage(video, 0, 0, vWidth, vHeight);

          if (typeof Tesseract === 'undefined') {
            setStatus('Status: OCRライブラリ未読込');
            return;
          }

          if (!enableSplit) {
            setStatus('Status: OCR解析中...');
            try {
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              const result = await Tesseract.recognize(dataUrl, 'eng+jpn');
              const rawText = result.data.text || '';
              setStatus('Status: 解析完了！');
              
              let model = '', sn = '';
              const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              if (lines.length > 0) model = lines[0];
              if (lines.length > 1) sn = lines[1];

              onOcrSuccess({
                model: model.toUpperCase(),
                sn: sn.toUpperCase(),
                remarks: ''
              });
            } catch (err) {
              setStatus('Status: OCRスキップ（手動入力可能）');
            }
            return;
          }

          // --- ユーザー設定の自由枠（座標・サイズ）に基づき個別クロップ解析 ---
          setStatus('Status: フリー枠エリア解析中...');

          try {
            const cropImage = (box) => {
              const subCanvas = document.createElement('canvas');
              const subCtx = subCanvas.getContext('2d');
              const sx = Math.floor(vWidth * (box.x / 100));
              const sy = Math.floor(vHeight * (box.y / 100));
              const sw = Math.floor(vWidth * (box.w / 100));
              const sh = Math.floor(vHeight * (box.h / 100));

              subCanvas.width = sw;
              subCanvas.height = sh;
              subCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
              return subCanvas.toDataURL('image/jpeg', 0.85);
            };

            const modelImg = cropImage(boxes.topBox);
            const snImg = cropImage(boxes.midBox);
            const remImg = cropImage(boxes.btmBox);

            const [resModel, resSn, resRem] = await Promise.all([
              Tesseract.recognize(modelImg, 'eng+jpn').catch(() => ({ data: { text: '' } })),
              Tesseract.recognize(snImg, 'eng+jpn').catch(() => ({ data: { text: '' } })),
              Tesseract.recognize(remImg, 'eng+jpn').catch(() => ({ data: { text: '' } }))
            ]);

            const cleanText = (t) => (t || '').replace(/[\r\n]+/g, ' ').trim().toUpperCase();

            setStatus('Status: フリー枠解析完了！');
            onOcrSuccess({
              model: cleanText(resModel.data.text),
              sn: cleanText(resSn.data.text),
              remarks: cleanText(resRem.data.text)
            });

          } catch (err) {
            setStatus('Status: OCRスキップ（手動入力可能）');
          }
        };

        return (
          <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg">
            {/* プレビューコンテナ */}
            <div 
              ref={containerRef}
              className="relative w-full h-72 sm:h-80 bg-black rounded-xl overflow-hidden mb-3 border border-[#E6DAA6]/30 select-none touch-none"
            >
              <video ref={videoRef} playsInline muted autoPlay className={`absolute inset-0 w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
              
              {/* 自由移動・リサイズ可能な3つの枠 */}
              {isCamActive && enableSplit && Object.entries(boxes).map(([key, box]) => (
                <div
                  key={key}
                  style={{
                    left: `${box.x}%`,
                    top: `${box.y}%`,
                    width: `${box.w}%`,
                    height: `${box.h}%`,
                    borderColor: box.color
                  }}
                  className="absolute border-2 border-dashed rounded-lg bg-black/40 flex flex-col justify-between p-1 z-10 cursor-move"
                  onMouseDown={(e) => startInteraction(key, 'move', e)}
                  onTouchStart={(e) => startInteraction(key, 'move', e)}
                >
                  <div className="flex justify-between items-center text-[10px] font-bold px-1 py-0.5 rounded" style={{ color: box.color, backgroundColor: 'rgba(0,0,0,0.6)' }}>
                    <span>{box.label}</span>
                    <span className="text-[9px] opacity-80">十字ドラッグで移動</span>
                  </div>
                  
                  {/* 右下リサイズハンドル */}
                  <div
                    className="absolute bottom-0 right-0 w-6 h-6 bg-white/80 rounded-tl-lg cursor-se-resize flex items-center justify-center text-black font-bold text-[10px]"
                    onMouseDown={(e) => startInteraction(key, 'resize', e)}
                    onTouchStart={(e) => startInteraction(key, 'resize', e)}
                    title="サイズ変更"
                  >
                    ◢
                  </div>
                </div>
              ))}

              {!isCamActive && <div className="absolute inset-0 flex items-center justify-center text-base text-[#E6DAA6]/70 z-10">📷 カメラ停止中</div>}
              <canvas ref={canvasRef} className="hidden" />
            </div>

            <div className="flex gap-2 mb-2">
              {!isCamActive ? (
                <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base sm:text-lg">📷 カメラ起動</button>
              ) : (
                <button onClick={captureAndAnalyze} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base sm:text-lg shadow-md">
                  {enableSplit ? '🔍 自由枠内エリアを撮影 & OCR' : '🔍 撮影 & OCR解析'}
                </button>
              )}
            </div>
            <div className="text-xs text-[#00ffcc] font-mono font-bold">{status}</div>
          </div>
        );
      };

      // --- メインアプリケーションコンポーネント ---
      function MainApp() {
        const fileInputRef = useRef(null);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
        const yymmdd = `${yy}${mm}${dd}`;

        const [baseInfo, setBaseInfo] = useState({
          docNo: '',
          modelName: '',
          entryDate: todayFormatted,
          customer: '',
          unitNo: '',
          orderQty: '',
          elecStaff: ''
        });

        const [fixedUnits, setFixedUnits] = useState([
          { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
          { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
          { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
          { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
        ]);

        const [devicePacks, setDevicePacks] = useState([
          { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
        ]);

        const [step, setStep] = useState(0);

        const handleNextFromHome = () => {
          setStep(1);
        };

        const handleAddDevice = () => {
          const nextIndex = devicePacks.length + 1;
          setDevicePacks([
            ...devicePacks,
            { id: `device_${Date.now()}`, title: '', model: '', serial: '', remarks: '' }
          ]);
          setStep(4 + nextIndex);
        };

        const handleGoTop = () => {
          if (window.confirm('TOP画面に戻りますか？（入力した情報は保持されます）')) {
            setStep(0);
          }
        };

        const handlePrint = () => {
          window.print();
        };

        // --- CSVファイル読込処理 ---
        const handleLoadCSV = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
              const clean = (val) => val ? val.replace(/^"|"$/g, '').trim().toUpperCase() : '';

              let newBaseInfo = { ...baseInfo };
              lines.forEach(line => {
                const cols = line.split(',').map(clean);
                if (cols[0] === '製造指図書NO' || cols[0] === '製造指図書No') {
                  newBaseInfo.docNo = cols[1] || '';
                  newBaseInfo.customer = cols[3] || '';
                } else if (cols[0] === '機種名') {
                  newBaseInfo.modelName = cols[1] || '';
                  newBaseInfo.unitNo = cols[3] || '';
                } else if (cols[0] === '記入日') {
                  newBaseInfo.entryDate = cols[1] || todayFormatted;
                  newBaseInfo.orderQty = cols[3] || '';
                } else if (cols[2] === 'エレキ担当') {
                  newBaseInfo.elecStaff = cols[3] || '';
                }
              });
              setBaseInfo({
                ...newBaseInfo,
                docNo: newBaseInfo.docNo.toUpperCase(),
                modelName: newBaseInfo.modelName.toUpperCase(),
                customer: newBaseInfo.customer.toUpperCase(),
                elecStaff: newBaseInfo.elecStaff.toUpperCase()
              });

              const tableHeaderIdx = lines.findIndex(l => l.includes('No,製品型式') || l.includes('NO,製品型式'));
              if (tableHeaderIdx !== -1) {
                const itemLines = lines.slice(tableHeaderIdx + 1);

                let newFixed = [
                  { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
                  { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
                  { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
                  { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
                ];
                let newDevices = [];

                itemLines.forEach((line, idx) => {
                  if (idx >= 25) return;
                  const match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                  const cols = match ? match.map(clean) : [];
                  
                  const no = parseInt(cols[0], 10);
                  if (isNaN(no)) return;

                  const model = cols[1] || '';
                  const serial = cols[2] || '';
                  const title = cols[3] || '';
                  const remarks = cols[4] || '';

                  if (no >= 1 && no <= 4) {
                    newFixed[no - 1].model = model.toUpperCase();
                    newFixed[no - 1].serial = serial.toUpperCase();
                    newFixed[no - 1].remarks = remarks.toUpperCase();
                  } else if (no >= 5) {
                    if (model || serial || title || remarks || newDevices.length > 0) {
                      newDevices.push({
                        id: `device_${Date.now()}_${no}`,
                        title: title.toUpperCase(),
                        model: model.toUpperCase(),
                        serial: serial.toUpperCase(),
                        remarks: remarks.toUpperCase()
                      });
                    }
                  }
                });

                setFixedUnits(newFixed);
                if (newDevices.length > 0) {
                  setDevicePacks(newDevices);
                } else {
                  setDevicePacks([{ id: 'device_1', title: '', model: '', serial: '', remarks: '' }]);
                }
              }

              alert('CSVファイルからデータを復元しました。');
              if (fileInputRef.current) fileInputRef.current.value = '';
            } catch (err) {
              alert('CSVファイルの読み込みに失敗しました。');
            }
          };

          reader.readAsText(file, 'UTF-8');
        };

        // --- CSVファイル保存処理 ---
        const handleSaveCSV = () => {
          const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_').toUpperCase();
          const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種名'}_${sanitize(baseInfo.docNo) || '指図書No'}_${sanitize(baseInfo.unitNo) || '号機'}.csv`;

          let csvContent = "\uFEFF";
          csvContent += `製造指図書No,${(baseInfo.docNo || '').toUpperCase()},客先名,${(baseInfo.customer || '').toUpperCase()}\n`;
          csvContent += `機種名,${(baseInfo.modelName || '').toUpperCase()},号機No,${baseInfo.unitNo}\n`;
          csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
          csvContent += `,,エレキ担当,${(baseInfo.elecStaff || '').toUpperCase()}\n\n`;
          csvContent += `No,製品型式,シリアルNo,機器名称,備考\n`;

          const allItems = [
            ...fixedUnits.map(u => ({ model: (u.model || '').toUpperCase(), serial: (u.serial || '').toUpperCase(), title: (u.title || '').toUpperCase(), remarks: (u.remarks || '').toUpperCase() })),
            ...devicePacks.map(s => ({ model: (s.model || '').toUpperCase(), serial: (s.serial || '').toUpperCase(), title: (s.title || '').toUpperCase(), remarks: (s.remarks || '').toUpperCase() }))
          ];

          for (let i = 1; i <= 25; i++) {
            const item = allItems[i - 1] || {};
            csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        // --- STEP 0: 初期画面 ---
        if (step === 0) {
          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <input
                type="file"
                accept=".csv"
                ref={fileInputRef}
                onChange={handleLoadCSV}
                className="hidden"
              />

              <div className="w-full flex-1 flex flex-col justify-evenly py-2">
                <div>
                  <h1 className="text-3xl font-extrabold text-center text-[#F5D887] mb-1">QuickScan DB</h1>
                  <p className="text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium">✨ 2次元フリー枠調整・大文字版</p>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2 space-y-3">
                  <div>
                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base flex items-center justify-center gap-2 active:scale-95 shadow-md"
                    >
                      📂 保存済みCSVを読み込んで編集・追記
                    </button>
                  </div>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm font-bold mb-1">製造指図書No</label>
                    <input
                      type="text"
                      value={baseInfo.docNo}
                      onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value.toUpperCase()})}
                      placeholder="例: ORD-2026-X"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">機種名</label>
                    <input
                      type="text"
                      value={baseInfo.modelName}
                      onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value.toUpperCase()})}
                      placeholder="例: MODEL-A100"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase"
                    />
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">記入日 (自動)</label>
                      <input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono" />
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">客先名</label>
                      <input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value.toUpperCase()})} placeholder="例: TANAKA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">号機No (数値)</label>
                      <input
                        type="number"
                        value={baseInfo.unitNo}
                        onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})}
                        placeholder="1"
                        className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                      />
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">発注台数 (数値)</label>
                      <input
                        type="number"
                        value={baseInfo.orderQty}
                        onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})}
                        placeholder="1"
                        className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">エレキ担当</label>
                    <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value.toUpperCase()})} placeholder="例: YAMADA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                </div>
              </div>

              <div className="py-3">
                <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl">入力を開始 (電源ユニットへ)</button>
              </div>
            </div>
          );
        }

        // --- STEP 1~4: 固定ユニット画面 (電源, CPU, ベース, LIO-04) → 2次元フリー枠OCR有効 ---
        if (step >= 1 && step <= 4) {
          const uIndex = step - 1;
          const current = fixedUnits[uIndex];
          const isLio04 = (uIndex === 3);

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">{current.title} 画面</h2>
                </div>

                <FreeBoxOcrScannerCard
                  enableSplit={true}
                  onOcrSuccess={(res) => {
                    const updated = [...fixedUnits];
                    if (res.model) updated[uIndex].model = res.model.toUpperCase();
                    if (res.sn) updated[uIndex].serial = res.sn.toUpperCase();
                    if (res.remarks) updated[uIndex].remarks = res.remarks.toUpperCase();
                    setFixedUnits(updated);
                  }}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式 (①枠)</label>
                    <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="型式を入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">シリアルNo (②枠)</label>
                    <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="シリアルを入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">備考 (③枠)</label>
                    <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="例: REV.A / VER.1.0" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                </div>

                {isLio04 && (
                  <div className="mt-3">
                    <button onClick={handleAddDevice} className="w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10 shadow-md">＋ 機器追加 (各種機器画面へ進む)</button>
                  </div>
                )}
              </div>

              <div className="py-3">
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
              </div>
            </div>
          );
        }

        // --- STEP 5+: 各種機器画面 ---
        if (step >= 5 && step < 999) {
          const sIndex = step - 5;
          const current = devicePacks[sIndex];

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">各種機器 {sIndex + 1} 画面</h2>
                </div>

                <FreeBoxOcrScannerCard
                  enableSplit={false}
                  onOcrSuccess={(res) => {
                    const updated = [...devicePacks];
                    if (res.model) updated[sIndex].model = res.model.toUpperCase();
                    if (res.sn) updated[sIndex].serial = res.sn.toUpperCase();
                    setDevicePacks(updated);
                  }}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">機器名称</label>
                    <input
                      type="text"
                      value={current.title}
                      onChange={(e) => {
                        const s = [...devicePacks];
                        s[sIndex].title = e.target.value.toUpperCase();
                        setDevicePacks(s);
                      }}
                      placeholder="例: サーボパック / インバータ"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase"
                    />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式</label>
                    <input type="text" value={current.model} onChange={(e) => { const s = [...devicePacks]; s[sIndex].model = e.target.value.toUpperCase(); setDevicePacks(s); }} placeholder="型式を入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold">シリアルNo</label>
                    <input type="text" value={current.serial} onChange={(e) => { const s = [...devicePacks]; s[sIndex].serial = e.target.value.toUpperCase(); setDevicePacks(s); }} placeholder="シリアルを入力" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                </div>

                <div className="mt-2">
                  <button onClick={handleAddDevice} className="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-3 rounded-xl text-base font-bold bg-[#F5D887]/10">＋ さらに機器追加</button>
                </div>
              </div>

              <div className="py-3 space-y-2">
                {sIndex < devicePacks.length - 1 && (
                  <button onClick={() => setStep(step + 1)} className="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-base font-bold">次の各種機器 ({sIndex + 2}) へ</button>
                )}
                <button onClick={() => setStep(999)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">入力結果へ (印刷プレビュー表示)</button>
              </div>
            </div>
          );
        }

        // --- STEP 999: 入力結果 & 印刷用シリアル記入シート ---
        if (step === 999) {
          const allItems = [
            ...fixedUnits.map(u => ({ model: (u.model || '').toUpperCase(), serial: (u.serial || '').toUpperCase(), title: (u.title || '').toUpperCase(), remarks: (u.remarks || '').toUpperCase() })),
            ...devicePacks.map(s => ({ model: (s.model || '').toUpperCase(), serial: (s.serial || '').toUpperCase(), title: (s.title || '').toUpperCase(), remarks: (s.remarks || '').toUpperCase() }))
          ];

          const rows = Array.from({ length: 25 }, (_, index) => {
            return allItems[index] || { model: '', serial: '', title: '', remarks: '' };
          });

          return (
            <div className="min-h-[100dvh] p-2 sm:p-4 max-w-5xl mx-auto w-full">
              <input
                type="file"
                accept=".csv"
                ref={fileInputRef}
                onChange={handleLoadCSV}
                className="hidden"
              />

              <div className="no-print flex flex-wrap justify-between items-center gap-2 mb-4">
                <div className="flex gap-3 items-center">
                  <button onClick={() => setStep(4 + devicePacks.length)} className="text-[#E6DAA6] text-base font-bold hover:underline">
                    ← 修正に戻る
                  </button>
                  <button onClick={handleGoTop} className="text-[#F5D887] text-base font-bold hover:underline">
                    🏠 TOP画面へ
                  </button>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] font-bold px-3 py-2.5 rounded-full text-sm sm:text-base active:scale-95"
                  >
                    📂 CSV読込
                  </button>
                  <button onClick={handleSaveCSV} className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base">
                    💾 CSV保存
                  </button>
                  <button
                    onClick={handlePrint}
                    className="bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base text-center shadow-md active:scale-95"
                  >
                    🖨 印刷 (印刷ダイアログ起動)
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto w-full border border-gray-700/50 rounded-lg">
                <div className="print-area bg-white text-black p-4 sm:p-6 rounded-lg shadow-xl min-w-[680px]">
                  <h1 className="text-center font-bold text-xl sm:text-2xl mb-3 tracking-widest border-b-2 border-black pb-1">シリアル記入シート</h1>

                  <table className="w-full text-xs sm:text-sm border-collapse border border-black mb-3">
                    <tbody>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">製造指図書No</th>
                        <td className="border border-black p-1 w-[35%] font-bold">{(baseInfo.docNo || '').toUpperCase()}</td>
                        <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">客先名</th>
                        <td className="border border-black p-1 w-[35%]">{(baseInfo.customer || '').toUpperCase()}</td>
                      </tr>
                      <tr>
                        <th className="border border-black p-1 bg-gray-100 text-left">機種名</th>
                        <td className="border border-black p-1 font-bold">{(baseInfo.modelName || '').toUpperCase()}</td>
                        <th className="border border-black p-1 bg-gray-100 text-left">号
