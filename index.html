<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#042219" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>QuickScan DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    @media print {
      html, body {
        height: 100%;
        overflow: hidden !important;
        background-color: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print { display: none !important; }
      .print-area {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 6mm 8mm !important;
        box-shadow: none !important;
        border: none !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      .table-container { overflow-x: visible !important; }
      .preview-table { min-width: 100% !important; width: 100% !important; }
      @page { size: A4 portrait; margin: 0; }
    }
    .col-e-cell {
      width: 180px !important;
      max-width: 180px !important;
      min-width: 180px !important;
      word-break: break-all;
      font-size: clamp(8px, 1.1vw, 11px);
      line-height: 1.1;
      overflow: hidden;
    }
    .row-h-24 {
      height: 24px !important;
      max-height: 24px !important;
    }
  </style>
</head>
<body class="bg-[#042219] text-[#E6DAA6] select-none text-base">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [headerInfo, setHeaderInfo] = useState({
        docNo: '', modelName: '', entryDate: '', customer: '', unitNo: '', orderQty: '', elecStaff: ''
      });

      const [isScanning, setIsScanning] = useState(false);
      const [scanTarget, setScanTarget] = useState(null);
      const [scanBoxSize, setScanBoxSize] = useState(250);
      const [customBoxInput, setCustomBoxInput] = useState(250);
      const [scannedResult, setScannedResult] = useState(null);
      const [detectedFormat, setDetectedFormat] = useState('スキャン待機中...');
      const html5QrcodeScannerRef = useRef(null);

      const [ocrCameraActive, setOcrCameraActive] = useState(false);
      const [ocrStatus, setOcrStatus] = useState('カメラ待機中');
      const [ocrLoading, setOcrLoading] = useState(false);
      const [ocrRawText, setOcrRawText] = useState('');
      const [ocrResult, setOcrResult] = useState({ model: '', sn: '', version: '' });

      // APIキー管理（ブラウザローカルストレージ）
      const [apiKeyInput, setApiKeyInput] = useState('');
      const [savedApiKey, setSavedApiKey] = useState('');

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);

      useEffect(() => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        setHeaderInfo(prev => ({ ...prev, entryDate: `${year}/${month}/${day}` }));

        // ブラウザに保存されたAPIキーを取得
        const localKey = localStorage.getItem('GEMINI_API_KEY') || '';
        setSavedApiKey(localKey);
        setApiKeyInput(localKey);
      }, []);

      const saveApiKeyToStorage = (key) => {
        const trimmedKey = key.trim();
        localStorage.setItem('GEMINI_API_KEY', trimmedKey);
        setSavedApiKey(trimmedKey);
        alert('APIキーをブラウザに保存しました。');
      };

      const handleUppercaseChange = (field, value) => setHeaderInfo(prev => ({ ...prev, [field]: value.toUpperCase() }));
      const handleNumberChange = (field, value) => setHeaderInfo(prev => ({ ...prev, [field]: value.replace(/[^0-9]/g, '') }));

      const [units, setUnits] = useState([
        { id: 'power', label: '電源ユニット', model: 'JPMC-PSD3012N', serial: '', remarks: '' },
        { id: 'cpu', label: 'CPU', model: 'JPMC-CP3202N-E', serial: '', remarks: '' },
        { id: 'base', label: 'ベースユニット', model: 'JPMC-BUB3008N-E', serial: '', remarks: '' },
        { id: 'lio', label: 'LIO-04', model: 'JPMC-IO2303-E', serial: '', remarks: '' }
      ]);

      const [servoPacks, setServoPacks] = useState([
        { id: 'servo_1', label: '', model: '', serial: '', axis: '', remarks: '' }
      ]);

      const [currentStep, setCurrentStep] = useState(0);

      const handleClearData = () => {
        setHeaderInfo(prev => ({ docNo: '', modelName: '', entryDate: prev.entryDate, customer: '', unitNo: '', orderQty: '', elecStaff: '' }));
        setUnits(units.map(u => ({ ...u, serial: '', remarks: '' })));
        setServoPacks([{ id: 'servo_1', label: '', model: '', serial: '', axis: '', remarks: '' }]);
        setCurrentStep(0);
        alert('入力データをクリアしました。');
      };

      const handleUnitChange = (index, field, value) => {
        const updated = [...units];
        updated[index][field] = value;
        setUnits(updated);
      };

      const handleServoChange = (index, field, value) => {
        const updated = [...servoPacks];
        updated[index][field] = value;
        setServoPacks(updated);
      };

      const handleAddServo = () => setServoPacks([...servoPacks, { id: `servo_${Date.now()}`, label: '', model: '', serial: '', axis: '', remarks: '' }]);
      const handleRemoveServo = (index) => { if (servoPacks.length > 1) setServoPacks(servoPacks.filter((_, i) => i !== index)); };

      const startOcrCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setOcrCameraActive(true);
          setOcrStatus('撮影準備完了');
        } catch (err) {
          alert("カメラの起動に失敗しました。アクセス権限を確認してください。");
        }
      };

      const stopOcrCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setOcrCameraActive(false);
      };

      const captureAndOcrCloud = async () => {
        if (!videoRef.current || !canvasRef.current) return;

        let activeKey = savedApiKey;
        if (!activeKey) {
          activeKey = prompt('Gemini APIキーを入力してください（ブラウザに保存されます）:');
          if (activeKey) {
            saveApiKeyToStorage(activeKey);
          } else {
            alert('APIキーが設定されていないため実行できません。');
            return;
          }
        }

        setOcrLoading(true);
        setOcrStatus('AI解析中...');

        const video = videoRef.current;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

        const promptText = `この画像は製品ラベル・銘板です。画像に映っている文字を解析し、以下のキーを持つJSON形式で出力してください。

- "model": 製品型式（例: JEPMC-BU3303N-E, SGDXS-2R8A40A など）
- "sn": シリアル番号（"S/N:" や "SER NO:" の後ろの英数字）
- "version": バージョン・製造年月（例: AO3, 2026.07 など。なければ空文字）

見つからない項目は "未検出" としてください。`;

        try {
          // モデル指定を最新に修正
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
              }],
              generationConfig: {
                response_mime_type: "application/json"
              }
            })
          });

          const data = await response.json();
          console.log("Gemini Raw API Response:", data);

          if (data.error) {
            console.error("API Error:", data.error);
            setOcrStatus(`APIエラー: ${data.error.message || '通信失敗'}`);
            if (data.error.code === 400 || data.error.status === 'UNAUTHENTICATED') {
              localStorage.removeItem('GEMINI_API_KEY');
              setSavedApiKey('');
            }
            return;
          }

          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          setOcrRawText(responseText);

          const cleanText = responseText.replace(/```json/g, '').replace(/
