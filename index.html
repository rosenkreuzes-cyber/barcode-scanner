<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (完全フル実装版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tesseract.js (ブラウザ完結型OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
      text-transform: uppercase;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">システム起動中...</div>
  </div>

  <script type="text/babel">
    try {
      const { useState, useEffect, useRef } = React;

      // --- OCRスキャナーコンポーネント (3分割指定対応 & グリーンバック防止 & 大文字化) ---
      const SplitOcrScannerCard = ({ onOcrSuccess, enableSplit = true }) => {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState(enableSplit ? 'Status: 待機中 (3分割OCR)' : 'Status: 待機中 (通常OCR)');
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            setStatus('Status: カメラ起動中...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setIsCamActive(true);
            setStatus('Status: 撮影準備完了');
          } catch (e) {
            setStatus('Status: カメラ起動エラー');
            alert('カメラの起動に失敗しました。権限をご確認ください。');
          }
        };

        const stopCamera = () => {
          try {
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
          } catch (e) {}
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => {
            stopCamera();
          };
        }, []);

        const captureAndAnalyze = async () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          ctx.drawImage(video, 0, 0, vWidth, vHeight);

          if (typeof Tesseract === 'undefined') {
            setStatus('Status: OCRライブラリ未読込（手動入力をご利用ください）');
            return;
          }

          if (!enableSplit) {
            // 各種機器画面用（全体OCR）
            setStatus('Status: OCR解析中...');
            try {
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              const result = await Tesseract.recognize(dataUrl, 'eng+jpn');
              const rawText = result.data.text || '';
              setStatus('Status: 解析完了！');
              
              let model = '', sn = '';
              const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              if (lines.length > 0) model = lines[0];
              if (lines.length > 1) sn = lines[1];

              onOcrSuccess({
                model: model.toUpperCase(),
                sn: sn.toUpperCase(),
                remarks: ''
              });
            } catch (err) {
              setStatus('Status: OCRスキップ（手動入力可能）');
            }
            return;
          }

          // --- 固定ユニット画面用：3分割クロップ解析 ---
          setStatus('Status: 3分割エリア解析中...');

          try {
            const subCanvas = document.createElement('canvas');
            const subCtx = subCanvas.getContext('2d');
            if (!subCtx) return;

            // 1. 上段エリア（製品型式）
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.35);
            subCtx.drawImage(canvas, 0, 0, vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const modelImg = subCanvas.toDataURL('image/jpeg', 0.85);

            // 2. 中段エリア（シリアルNo）
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.35);
            subCtx.clearRect(0, 0, subCanvas.width, subCanvas.height);
            subCtx.drawImage(canvas, 0, Math.floor(vHeight * 0.33), vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const snImg = subCanvas.toDataURL('image/jpeg', 0.85);

            // 3. 下段エリア（備考・バージョン）
            subCanvas.width = vWidth;
            subCanvas.height = Math.floor(vHeight * 0.34);
            subCtx.clearRect(0, 0, subCanvas.width, subCanvas.height);
            subCtx.drawImage(canvas, 0, Math.floor(vHeight * 0.66), vWidth, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
            const remImg = subCanvas.toDataURL('image/jpeg', 0.85);

            const [resModel, resSn, resRem] = await Promise.all([
              Tesseract.recognize(modelImg, 'eng+jpn').catch(() => ({ data: { text: '' } })),
              Tesseract.recognize(snImg,
