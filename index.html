<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#042219" />
  <title>QuickScan DB</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    h1 { color: #F5D887; text-align: center; font-size: 26px; margin-bottom: 5px; }
    p.sub { text-align: center; color: rgba(230, 218, 166, 0.7); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: rgba(9, 51, 37, 0.6);
      border: 1px solid rgba(230, 218, 166, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold; }
    .field input {
      width: 100%;
      background: #093325;
      border: 1px solid rgba(230, 218, 166, 0.4);
      border-radius: 10px;
      padding: 10px 12px;
      color: #E6DAA6;
      font-size: 15px;
      text-transform: uppercase;
    }
    .field input:focus { outline: none; border-color: #F5D887; }
    .btn-main {
      width: 100%;
      background: #F5D887;
      color: #042219;
      font-weight: bold;
      padding: 14px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-sub {
      width: 100%;
      background: transparent;
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,0.4);
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 10px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    #reader { width: 100%; max-width: 360px; background: #000; border-radius: 12px; overflow: hidden; }
    .hidden { display: none !important; }

    /* A4 印刷設定 */
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100% !important; padding: 0 !important; }
      table { width: 100%; border-collapse: collapse; border: 1px solid black; }
      th, td { border: 1px solid black; padding: 4px; font-size: 11px; text-align: center; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

  <!-- STEP 0: 基本情報入力 -->
  <div id="step-0" class="container">
    <div>
      <h1>QuickScan DB</h1>
      <p class="sub">基本情報の入力</p>
      
      <div class="card">
        <div class="field">
          <label>製造指図書No</label>
          <input type="text" id="docNo" placeholder="例: ORD-2026-X">
        </div>
        <div class="field">
          <label>機種名</label>
          <input type="text" id="modelName" placeholder="例: MODEL-A100">
        </div>
        <div class="field">
          <label>記入日</label>
          <input type="text" id="entryDate" readonly style="opacity:0.7;">
        </div>
        <div class="field">
          <label>客先名</label>
          <input type="text" id="customer" placeholder="例: TANAKA CORP">
        </div>
        <div style="display: flex; gap: 10px;">
          <div class="field" style="flex: 1;">
            <label>号機NO.</label>
            <input type="number" id="unitNo" placeholder="数字">
          </div>
          <div class="field" style="flex: 1;">
            <label>発注台数</label>
            <input type="number" id="orderQty" placeholder="数字">
          </div>
        </div>
        <div class="field">
          <label>エレキ担当者</label>
          <input type="text" id="elecStaff" placeholder="例: YAMADA">
        </div>
      </div>
    </div>

    <div>
      <button class="btn-main" onclick="goToStep(0.5)">次へ（AI OCR テストへ）</button>
      <button class="btn-sub" onclick="clearData()">入力情報をクリア</button>
    </div>
  </div>

  <!-- STEP 0.5: AI OCR -->
  <div id="step-05" class="container hidden">
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <button style="color:#E6DAA6; background:none; border:none; cursor:pointer;" onclick="goToStep(0)">← 戻る</button>
        <span style="font-size:12px; color:#00ffcc; border:1px solid #00ffcc; padding:2px 8px; border-radius:10px;">AI OCR MODE</span>
      </div>
      <h1>AI (Gemini) OCR</h1>
      <p class="sub">銘板画像からの自動読取テスト</p>

      <div class="card">
        <label style="font-size:12px; display:block; margin-bottom:5px;">🔑 API Key 設定</label>
        <div style="display:flex; gap:5px;">
          <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="flex:1; background:#000; color:#fff; border:1px solid #555; padding:6px; border-radius:6px; font-size:12px;">
          <button onclick="saveKey()" style="background:#F5D887; color:#042219; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">保存</button>
        </div>
      </div>

      <div class="card" style="text-align:center;">
        <video id="ocrVideo" playsinline muted style="width:100%; height:180px; background:#000; border-radius:8px; object-fit:cover;" class="hidden"></video>
        <canvas id="ocrCanvas" class="hidden"></canvas>
        <div id="videoPlaceholder" style="height:120px; display:flex; align-items:center; justify-content:center; color:#888; font-size:12px;">カメラ停止中</div>
        
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button id="btnStartCam" onclick="startOcrCam()" style="flex:1; background:#093325; color:#00ffcc; border:1px solid #00ffcc; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">📷 カメラ起動</button>
          <button id="btnCapture" onclick="captureOcr()" class="hidden" style="flex:1; background:#F5D887; color:#042219; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">☁️ 撮影&解析</button>
        </div>
        <div id="ocrStatus" style="font-size:12px; color:#00ffcc; margin-top:8px;">Status: 待機中</div>
      </div>

      <div class="card">
        <div style="font-size:13px; font-weight:bold; color:#F5D887; margin-bottom:8px;">🔍 解析結果</div>
        <div style="font-size:13px; line-height:1.8;">
          <div>型式: <span id="resModel" style="color:#00ffcc; font-weight:bold;">-</span></div>
          <div>S/N: <span id="resSN" style="color:#00ffcc; font-weight:bold;">-</span></div>
          <div>Rev: <span id="resVer" style="color:#00ffcc; font-weight:bold;">-</span></div>
        </div>
      </div>
    </div>

    <button class="btn-main" onclick="goToStep(1)">次へ（ユニットスキャンへ）</button>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    // 初期化日付設定
    const today = new Date();
    document.getElementById('entryDate').value = today.getFullYear() + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + String(today.getDate()).padStart(2, '0');

    // API Key ローカルストレージ復元
    const savedKey = localStorage.getItem('GEMINI_API_KEY') || '';
    document.getElementById('apiKeyInput').value = savedKey;

    function saveKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('GEMINI_API_KEY', val);
      alert('APIキーを保存しました');
    }

    // 画面遷移切り替え
    function goToStep(step) {
      document.getElementById('step-0').classList.add('hidden');
      document.getElementById('step-05').classList.add('hidden');

      if (step === 0) document.getElementById('step-0').classList.remove('hidden');
      if (step === 0.5) document.getElementById('step-05').classList.remove('hidden');
      if (step === 1) alert('これより先のスキャン機能へ移ります。');
    }

    function clearData() {
      document.querySelectorAll('#step-0 input').forEach(input => {
        if (input.id !== 'entryDate') input.value = '';
      });
    }

    // AI OCR カメラ機能
    let mediaStream = null;
    async function startOcrCam() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById('ocrVideo');
        video.srcObject = mediaStream;
        video.play();
        video.classList.remove('hidden');
        document.getElementById('videoPlaceholder').classList.add('hidden');
        document.getElementById('btnStartCam').classList.add('hidden');
        document.getElementById('btnCapture').classList.remove('hidden');
        document.getElementById('ocrStatus').innerText = 'Status: 撮影準備完了';
      } catch (e) {
        alert('カメラの起動に失敗しました。');
      }
    }

    async function captureOcr() {
      const key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) { alert('APIキーを設定してください'); return; }

      const video = document.getElementById('ocrVideo');
      const canvas = document.getElementById('ocrCanvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      document.getElementById('ocrStatus').innerText = 'Status: AI解析中...';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: '画像銘板の model, sn, version をJSON形式で返してください。' },
                { inline_data: { mime_type: 'image/jpeg', data: base64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });
        const data = await res.json();
        const text = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(text);

        document.getElementById('resModel').innerText = parsed.model || '未検出';
        document.getElementById('resSN').innerText = parsed.sn || '未検出';
        document.getElementById('resVer').innerText = parsed.version || '未検出';
        document.getElementById('ocrStatus').innerText = 'Status: 解析完了';
      } catch (err) {
        document.getElementById('ocrStatus').innerText = 'Status: 解析エラー';
      }
    }
  </script>
</body>
</html>
