<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    input { color-scheme: dark; text-transform: uppercase; }
    .camera-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.88); padding: 12px; overflow: auto; display: flex; align-items: stretch; justify-content: center; }
    .camera-modal.hidden { display: none; }
    .camera-panel { width: 100%; max-width: 720px; background: #093325; border: 1px solid rgba(230,218,166,.4); border-radius: 16px; padding: 14px; margin: auto 0; display: flex; flex-direction: column; }
    .camera-stage { position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 220px; max-height: 62vh; flex: 0 0 auto; background: #000; overflow: hidden; border-radius: 10px; touch-action: none; }
    #cameraVideo { display: block; width: 100%; height: 100%; max-height: none; object-fit: fill; }
    .scan-frame { position: absolute; left: 10%; top: 8%; width: 80%; height: 22%; border: 3px solid #00ffcc; background: rgba(0,255,204,.04); cursor: move; touch-action: none; }
    .scan-frame.active { border-color: #F5D887; z-index: 4; }
    .scan-frame span { position: absolute; left: 0; top: 0; background: #00ffcc; color: #042219; font-size: 11px; font-weight: 800; padding: 2px 5px; white-space: nowrap; }
    .scan-frame.active span { background: #F5D887; }

    @media (max-width: 640px) {
      .camera-modal { padding: 0; overflow: hidden; }
      .camera-panel { width: 100%; max-width: none; height: 100vh; height: 100dvh; min-height: 0; border-radius: 0; border: 0; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); gap: 6px; }
      .camera-panel > .flex { flex: 0 0 auto; }
      .camera-panel > p:first-of-type { flex: 0 0 auto; font-size: 12px; line-height: 1.35; margin-bottom: 2px; }
      .camera-panel > .rounded-lg.border { flex: 0 0 auto; margin-bottom: 2px; padding: 6px 8px; font-size: 12px; }
      .camera-stage { width: 100%; aspect-ratio: 4 / 3; height: auto; min-height: 0; max-height: 48vh; flex: 0 0 auto; }
      #cameraVideo { width: 100%; height: 100%; max-height: none; object-fit: fill; }
      #cameraStatus { flex: 0 0 auto; margin-top: 2px; margin-bottom: 2px; font-size: 12px; }
      .camera-panel > .grid.grid-cols-2.gap-3 { flex: 0 0 auto; gap: 5px 10px; font-size: 11px; }
      .camera-panel input[type=range] { height: 20px; }
      .camera-panel > .grid.grid-cols-2.gap-2 { flex: 0 0 auto; gap: 6px; margin-top: 4px; }
      .camera-panel > .grid.grid-cols-2.gap-2 button { padding-top: 8px; padding-bottom: 8px; font-size: 12px; }
    }

    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body {
        background: white !important;
        color: black !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }
      .no-print { display: none !important; }
      .print-area {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        background: white !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 2px 4px !important;
        font-size: 9.5px !important;
        line-height: 1.1 !important;
        color: black !important;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      th { background-color: #f2f2f2 !important; }
      @page {
        size: A4 portrait;
        margin: 4mm;
      }
    }
  </style>
</head>
<body class="p-3 max-w-xl mx-auto w-full">

  <!-- 隠しファイル入力（CSV読込用） -->
  <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="loadCSVFile(event)" />
  
  <!-- カメラ起動に失敗した場合の撮影ファイル選択用 -->
  <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleNativeCapture(event)" />

  <!-- カメラ読み取り画面 -->
  <div id="cameraModal" class="camera-modal hidden" role="dialog" aria-modal="true" aria-labelledby="cameraHeading">
    <div class="camera-panel">
      <div class="flex items-center justify-between gap-2 mb-2">
        <h2 id="cameraHeading" class="text-xl font-bold text-[#F5D887]">📷 銘板読み取り</h2>
        <button type="button" onclick="closeCamera()" class="px-3 py-2 rounded-lg border border-[#E6DAA6]/40">閉じる ✕</button>
      </div>
      <p class="text-sm mb-3">枠をそれぞれ文字に合わせてください。枠はドラッグで移動できます。枠をタップするとサイズ調整の対象になります。</p>
      <div class="rounded-lg border border-[#00ffcc]/50 bg-[#042219] px-3 py-2 mb-3 text-sm">
        <strong class="text-[#00ffcc]">枠1：製品型式　／　枠2：シリアルNo</strong><span id="versionFrameHint">　／　枠3：Ver・備考</span>
      </div>
      <div id="cameraStage" class="camera-stage">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div id="scanFrames"></div>
      </div>
      <p id="cameraStatus" class="text-sm mt-2 mb-2">カメラを準備しています…</p>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <label>選択中の枠 左右位置 <input id="frameX" type="range" min="0" max="80" value="10" class="w-full" oninput="updateFrameFromSliders()"></label>
        <label>選択中の枠 上下位置 <input id="frameY" type="range" min="0" max="80" value="8" class="w-full" oninput="updateFrameFromSliders()"></label>
        <label>選択中の枠 横幅 <input id="frameW" type="range" min="15" max="100" value="80" class="w-full" oninput="updateFrameFromSliders()"></label>
        <label>選択中の枠 縦幅 <input id="frameH" type="range" min="8" max="80" value="22" class="w-full" oninput="updateFrameFromSliders()"></label>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button type="button" onclick="captureAndAnalyze()" class="bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl">📸 撮影して読み取り</button>
        <button type="button" onclick="resetScanFrame()" class="border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl">枠を初期位置へ</button>
        <button type="button" onclick="useNativeCameraFallback()" class="col-span-2 border border-[#E6DAA6]/50 text-[#E6DAA6] font-bold py-2 rounded-xl">端末標準カメラで撮影（カメラが起動しない場合）</button>
      </div>
      <canvas id="scanCanvas" class="hidden"></canvas>
    </div>
  </div>

  <!-- TOP画面（基本情報） -->
  <div id="view-home" class="space-y-4">
    <h1 class="text-3xl font-extrabold text-center text-[#F5D887] mt-2">QuickScan DB</h1>
    <p class="text-sm text-center text-[#E6DAA6]/80">基本情報設定</p>

    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <button type="button" onclick="document.getElementById('csvFileInput').click()" class="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base shadow-md cursor-pointer">
        📂 保存済みCSVを読み込んで編集・追記
      </button>
    </div>

    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <div>
        <label class="block text-sm font-bold mb-1">製造指図書No</label>
        <input type="text" id="docNo" placeholder="例: ORD-2026-X" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">機種名</label>
        <input type="text" id="modelName" placeholder="例: MODEL-A100" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">記入日</label>
          <input type="text" id="entryDate" readonly class="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70" />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">客先名</label>
          <input type="text" id="customer" placeholder="客先名" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">号機No</label>
          <input type="number" id="unitNo" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-bold mb-1">発注台数</label>
          <input type="number" id="orderQty" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">エレキ担当</label>
        <input type="text" id="elecStaff" placeholder="担当者名" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
      </div>
    </div>

    <button type="button" onclick="goToInput()" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl mt-4 cursor-pointer">入力を開始 (電源ユニットへ)</button>
  </div>

  <!-- ユニット入力画面 -->
  <div id="view-input" class="hidden space-y-3">
    <div class="flex justify-between items-center text-base text-[#E6DAA6] font-bold">
      <button type="button" onclick="prevStep()" class="hover:underline cursor-pointer">← 前へ</button>
      <span id="step-indicator">1 / 5</span>
      <button type="button" onclick="goToTop()" class="hover:underline text-[#F5D887] cursor-pointer">🏠 TOP</button>
    </div>

    <h2 id="unit-title" class="text-2xl font-bold text-center text-[#F5D887]">電源ユニット 画面</h2>

    <!-- 各入力フィールドの脇にカメラ・読取補助ボタンを配置 -->
    <div class="bg-[#093325] border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3 shadow-lg">
      <div class="rounded-xl border border-[#00ffcc]/50 bg-[#042219]/70 p-3">
        <div class="flex justify-between items-center gap-2 mb-2">
          <div>
            <div class="text-sm font-bold text-[#00ffcc]">銘板カメラ読み取り</div>
            <div class="text-xs opacity-80">枠を動かして型式・シリアル・Verを指定</div>
          </div>
          <button type="button" onclick="openCameraScanner()" class="shrink-0 bg-[#00ffcc] text-[#042219] text-sm px-4 py-2 rounded-lg font-extrabold">📷 撮影・読取</button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">製品型式</label>
        <input type="text" id="f-model" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="型式" />
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">シリアルNo</label>
        <input type="text" id="f-serial" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="シリアル" />
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">備考 (バージョン情報等)</label>
        <input type="text" id="f-remarks" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" placeholder="例: A03" />
      </div>
    </div>

    <!-- 機器追加ボタン（LIO-04含む3番目以降の画面で常時表示） -->
    <div id="add-btn-wrap" class="hidden">
      <button type="button" onclick="addDevice()" class="w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10 shadow-md cursor-pointer">＋ 機器追加 (各種機器画面へ)</button>
    </div>

    <button type="button" onclick="nextStep()" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg cursor-pointer">次へ</button>
  </div>

  <!-- 印刷プレビュー画面 -->
  <div id="view-result" class="hidden space-y-2">
    <div class="no-print flex flex-wrap justify-between items-center gap-2 mb-2">
      <button type="button" onclick="goToInput()" class="text-[#E6DAA6] font-bold cursor-pointer">← 修正に戻る</button>
      <div class="flex gap-2">
        <button type="button" onclick="document.getElementById('csvFileInput').click()" class="bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] font-bold px-3 py-2 rounded-full text-sm cursor-pointer">📂 読込</button>
        <button type="button" onclick="saveCSV()" class="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2 rounded-full text-sm cursor-pointer">💾 CSV保存</button>
        <button type="button" onclick="triggerPrint()" class="bg-[#F5D887] text-[#042219] font-bold px-4 py-2 rounded-full text-sm shadow-md cursor-pointer">🖨 印刷</button>
      </div>
    </div>

    <!-- 1ページに確実収容する印刷・プレビューエリア -->
    <div class="print-area bg-white text-black p-1.5 rounded-lg shadow-xl w-full">
      <h1 class="text-center font-bold text-sm mb-1 border-b border-black pb-0.5">シリアル記入シート</h1>
      <table class="w-full text-[10px] border-collapse border border-black mb-1 table-fixed">
        <tbody>
          <tr>
            <th class="border border-black p-0.5 bg-gray-100 w-20">製造指図書No</th>
            <td id="p-docNo" class="border border-black p-0.5 font-bold truncate"></td>
            <th class="border border-black p-0.5 bg-gray-100 w-14">客先名</th>
            <td id="p-customer" class="border border-black p-0.5 truncate"></td>
          </tr>
          <tr>
            <th class="border border-black p-0.5 bg-gray-100">機種名</th>
            <td id="p-modelName" class="border border-black p-0.5 font-bold truncate"></td>
            <th class="border border-black p-0.5 bg-gray-100">号機No</th>
            <td id="p-unitNo" class="border border-black p-0.5 truncate"></td>
          </tr>
          <tr>
            <th class="border border-black p-0.5 bg-gray-100">記入日</th>
            <td id="p-entryDate" class="border border-black p-0.5 truncate"></td>
            <th class="border border-black p-0.5 bg-gray-100">発注台数</th>
            <td id="p-orderQty" class="border border-black p-0.5 truncate"></td>
          </tr>
          <tr>
            <th class="border border-black p-0.5 bg-gray-100" colspan="2"></th>
            <th class="border border-black p-0.5 bg-gray-100">エレキ担当</th>
            <td id="p-elecStaff" class="border border-black p-0.5 truncate"></td>
          </tr>
        </tbody>
      </table>

      <table class="w-full text-[10px] border-collapse border border-black table-fixed">
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-black p-0.5 text-center w-6">No</th>
            <th class="border border-black p-0.5 w-[28%]">製品型式</th>
            <th class="border border-black p-0.5 w-[28%]">シリアルNo</th>
            <th class="border border-black p-0.5 w-[18%]">機器名称</th>
            <th class="border border-black p-0.5">備考</th>
          </tr>
        </thead>
        <tbody id="p-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');

    let items = [
      { title: '電源ユニット', model: '', serial: '', remarks: '' },
      { title: 'CPU', model: '', serial: '', remarks: '' },
      { title: 'ベースユニット', model: '', serial: '', remarks: '' },
      { title: 'LIO-04', model: '', serial: '', remarks: '' },
      { title: 'ユニット登録1', model: '', serial: '', remarks: '' }
    ];
    let currentStep = 0;
    let isStarted = false;
    let targetFieldId = null;

    function saveCurrentForm() {
      if (isStarted && currentStep >= 0 && currentStep < items.length && currentStep !== 999) {
        const m = document.getElementById('f-model');
        const s = document.getElementById('f-serial');
        const r = document.getElementById('f-remarks');
        if (m) items[currentStep].model = m.value.toUpperCase();
        if (s) items[currentStep].serial = s.value.toUpperCase();
        if (r) items[currentStep].remarks = r.value.toUpperCase();
        if (currentStep >= 4) {
          const t = document.getElementById('f-title');
          if (t) items[currentStep].title = t.value.toUpperCase();
        }
      }
    }

    function render() {
      const viewHome = document.getElementById('view-home');
      const viewInput = document.getElementById('view-input');
      const viewResult = document.getElementById('view-result');

      if (!viewHome || !viewInput || !viewResult) return;

      viewHome.classList.add('hidden');
      viewInput.classList.add('hidden');
      viewResult.classList.add('hidden');

      if (!isStarted) {
        viewHome.classList.remove('hidden');
      } else if (currentStep !== 999) {
        viewInput.classList.remove('hidden');
        const item = items[currentStep];
        document.getElementById('unit-title').innerText = `${item.title} 画面`;
        document.getElementById('step-indicator').innerText = `${currentStep + 1} / ${items.length}`;
        
        document.getElementById('f-model').value = item.model || '';
        document.getElementById('f-serial').value = item.serial || '';
        document.getElementById('f-remarks').value = item.remarks || '';

        const addBtnWrap = document.getElementById('add-btn-wrap');

        // LIO-04（index 3）画面にも機器追加ボタンを表示
        if (currentStep >= 3) {
          addBtnWrap.classList.remove('hidden');
        } else {
          addBtnWrap.classList.add('hidden');
        }
      } else {
        viewResult.classList.remove('hidden');
        document.getElementById('p-docNo').innerText = document.getElementById('docNo').value.toUpperCase();
        document.getElementById('p-customer').innerText = document.getElementById('customer').value.toUpperCase();
        document.getElementById('p-modelName').innerText = document.getElementById('modelName').value.toUpperCase();
        document.getElementById('p-unitNo').innerText = document.getElementById('unitNo').value;
        document.getElementById('p-entryDate').innerText = document.getElementById('entryDate').value;
        document.getElementById('p-orderQty').innerText = document.getElementById('orderQty').value;
        document.getElementById('p-elecStaff').innerText = document.getElementById('elecStaff').value.toUpperCase();

        let tbody = document.getElementById('p-tbody');
        if (tbody) {
          tbody.innerHTML = '';
          for (let i = 0; i < 25; i++) {
            const rowData = items[i] || { model: '', serial: '', title: '', remarks: '' };
            const displayTitle = rowData.title || (i < 4 ? items[i].title : '');
            tbody.innerHTML += `
              <tr class="h-[15px]">
                <td class="border border-black text-center font-bold bg-gray-50">${i + 1}</td>
                <td class="border border-black px-1 font-bold truncate">${rowData.model}</td>
                <td class="border border-black px-1 font-bold truncate">${rowData.serial}</td>
                <td class="border border-black px-1 truncate">${displayTitle}</td>
                <td class="border border-black px-1 truncate">${rowData.remarks}</td>
              </tr>
            `;
          }
        }
      }
    }

    function goToTop() {
      saveCurrentForm();
      currentStep = 0;
      isStarted = false;
      render();
    }

    function goToInput() {
      saveCurrentForm();
      currentStep = 0;
      isStarted = true;
      render();
    }

    function nextStep() {
      saveCurrentForm();
      if (currentStep < items.length - 1) {
        currentStep++;
      } else {
        currentStep = 999;
      }
      render();
    }

    function prevStep() {
      saveCurrentForm();
      if (currentStep > 0) {
        currentStep--;
        render();
      } else {
        goToTop();
      }
    }

    function addDevice() {
      saveCurrentForm();
      if (items.length >= 25) {
        alert('登録できる機器は最大25件です。');
        return;
      }
      const registrationCount = items.filter(item => /^ユニット登録\d+$/.test(item.title || '')).length + 1;
      items.push({ title: `ユニット登録${registrationCount}`, model: '', serial: '', remarks: '' });
      currentStep = items.length - 1;
      render();
    }

    function triggerPrint() {
      setTimeout(() => { window.print(); }, 100);
    }

    // カメラ読み取り：品目ごとの枠を個別に切り出してPaddleOCRへ送る
    let cameraStream = null;
    let frameDrag = null;
    let scanFrames = [];
    let activeFrameIndex = 0;

    function isUnitRegistration() {
      return currentStep >= 4 || /^ユニット登録\d+$/.test(items[currentStep]?.title || '');
    }

    function scanFrameStorageKey(unitMode = isUnitRegistration()) {
      return unitMode ? 'quickscan.scanFrames.unit.v1' : 'quickscan.scanFrames.standard.v1';
    }

    function saveScanFrames() {
      try {
        const layout = scanFrames.map((def, i) => {
          const el = document.querySelectorAll('.scan-frame')[i];
          return el ? {
            key: def.key,
            left: parseFloat(el.style.left) || 0,
            top: parseFloat(el.style.top) || 0,
            width: parseFloat(el.style.width) || 80,
            height: parseFloat(el.style.height) || 20
          } : null;
        }).filter(Boolean);
        localStorage.setItem(scanFrameStorageKey(), JSON.stringify(layout));
      } catch (err) {
        console.warn('フォーカス枠の設定を保存できませんでした。', err);
      }
    }

    function setupScanFrames() {
      const unitMode = isUnitRegistration();
      const defs = [
        { key: 'f-model', label: '1 製品型式', left: 8, top: unitMode ? 18 : 5, width: 84, height: unitMode ? 25 : 20 },
        { key: 'f-serial', label: '2 シリアルNo', left: 8, top: unitMode ? 55 : 37, width: 84, height: unitMode ? 25 : 20 }
      ];
      if (!unitMode) defs.push({ key: 'f-remarks', label: '3 Ver / 備考', left: 8, top: 69, width: 84, height: 20 });
      try {
        const saved = JSON.parse(localStorage.getItem(scanFrameStorageKey(unitMode)) || 'null');
        if (Array.isArray(saved)) {
          defs.forEach(def => {
            const old = saved.find(item => item && item.key === def.key);
            if (!old) return;
            def.width = Math.max(15, Math.min(100, Number(old.width) || def.width));
            def.height = Math.max(8, Math.min(80, Number(old.height) || def.height));
            def.left = Math.max(0, Math.min(100 - def.width, Number(old.left) || 0));
            def.top = Math.max(0, Math.min(100 - def.height, Number(old.top) || 0));
          });
        }
      } catch (err) {
        console.warn('保存済みフォーカス枠を読み込めませんでした。', err);
      }
      scanFrames = defs;
      activeFrameIndex = 0;
      document.getElementById('versionFrameHint').classList.toggle('hidden', unitMode);
      const container = document.getElementById('scanFrames');
      container.innerHTML = '';
      defs.forEach((def, i) => {
        const el = document.createElement('div');
        el.className = 'scan-frame' + (i === 0 ? ' active' : '');
        el.dataset.index = String(i);
        el.style.left = `${def.left}%`; el.style.top = `${def.top}%`;
        el.style.width = `${def.width}%`; el.style.height = `${def.height}%`;
        el.innerHTML = `<span>${def.label}</span>`;
        el.addEventListener('pointerdown', e => {
          activeFrameIndex = i;
          updateActiveFrame();
          frameDrag = { index: i, x: e.clientX, y: e.clientY, left: parseFloat(el.style.left), top: parseFloat(el.style.top) };
          el.setPointerCapture(e.pointerId);
          updateSlidersFromFrame();
          e.preventDefault();
        });
        el.addEventListener('pointermove', e => {
          if (!frameDrag || frameDrag.index !== i) return;
          const video = document.getElementById('cameraVideo');
          const dx = (e.clientX - frameDrag.x) / video.clientWidth * 100;
          const dy = (e.clientY - frameDrag.y) / video.clientHeight * 100;
          const w = parseFloat(el.style.width), h = parseFloat(el.style.height);
          el.style.left = `${Math.max(0, Math.min(100-w, frameDrag.left + dx))}%`;
          el.style.top = `${Math.max(0, Math.min(100-h, frameDrag.top + dy))}%`;
          updateSlidersFromFrame();
          saveScanFrames();
        });
        el.addEventListener('pointerup', () => { frameDrag = null; saveScanFrames(); });
        el.addEventListener('pointercancel', () => { frameDrag = null; saveScanFrames(); });
        container.appendChild(el);
      });
      updateSlidersFromFrame();
    }

    function updateActiveFrame() {
      document.querySelectorAll('.scan-frame').forEach((el, i) => el.classList.toggle('active', i === activeFrameIndex));
    }

    async function openCameraScanner() {
      saveCurrentForm();
      const modal = document.getElementById('cameraModal');
      modal.classList.remove('hidden');
      setupScanFrames();
      const video = document.getElementById('cameraVideo');
      const status = document.getElementById('cameraStatus');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('この接続ではブラウザカメラを利用できません。HTTPSまたはlocalhostで開いてください。');
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        video.srcObject = cameraStream;
        await video.play();
        status.textContent = '3つの枠（ユニット登録では2つ）を合わせて撮影してください。';
      } catch (err) {
        status.textContent = `カメラを起動できません: ${err.message || err}。スマートフォンではHTTPS接続が必要な場合があります。`;
      }
    }

    function closeCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      const video = document.getElementById('cameraVideo');
      if (video) video.srcObject = null;
      document.getElementById('cameraModal').classList.add('hidden');
    }

    function useNativeCameraFallback() {
      closeCamera();
      document.getElementById('nativeCameraInput').click();
    }

    function resetScanFrame() {
      try { localStorage.removeItem(scanFrameStorageKey()); } catch (err) {}
      setupScanFrames();
      saveScanFrames();
    }

    function updateFrameFromSliders() {
      const frame = document.querySelectorAll('.scan-frame')[activeFrameIndex];
      if (!frame) return;
      const x = Number(document.getElementById('frameX').value), y = Number(document.getElementById('frameY').value);
      const w = Number(document.getElementById('frameW').value), h = Number(document.getElementById('frameH').value);
      frame.style.left = `${Math.min(x, 100-w)}%`; frame.style.top = `${Math.min(y, 100-h)}%`;
      frame.style.width = `${w}%`; frame.style.height = `${h}%`;
      document.getElementById('frameX').value = Math.min(x, 100-w);
      document.getElementById('frameY').value = Math.min(y, 100-h);
      saveScanFrames();
    }

    function updateSlidersFromFrame() {
      const frame = document.querySelectorAll('.scan-frame')[activeFrameIndex];
      if (!frame) return;
      document.getElementById('frameX').value = Math.round(parseFloat(frame.style.left) || 0);
      document.getElementById('frameY').value = Math.round(parseFloat(frame.style.top) || 0);
      document.getElementById('frameW').value = Math.round(parseFloat(frame.style.width) || 80);
      document.getElementById('frameH').value = Math.round(parseFloat(frame.style.height) || 20);
    }

    async function captureAndAnalyze() {
      const video = document.getElementById('cameraVideo');
      const status = document.getElementById('cameraStatus');
      if (!video.videoWidth || !video.videoHeight) { status.textContent = 'カメラ映像がありません。カメラの許可と接続を確認してください。'; return; }
      const canvas = document.getElementById('scanCanvas');
      const ctx = canvas.getContext('2d');
      const results = [];
      try {
        for (let i = 0; i < scanFrames.length; i++) {
          const def = scanFrames[i];
          const el = document.querySelectorAll('.scan-frame')[i];
          const videoRect = video.getBoundingClientRect(), rect = el.getBoundingClientRect();
          const leftPct = (rect.left - videoRect.left) / videoRect.width;
          const topPct = (rect.top - videoRect.top) / videoRect.height;
          const widthPct = rect.width / videoRect.width, heightPct = rect.height / videoRect.height;
          canvas.width = Math.max(1, Math.round(video.videoWidth * widthPct));
          canvas.height = Math.max(1, Math.round(video.videoHeight * heightPct));
          ctx.drawImage(video, Math.round(video.videoWidth * leftPct), Math.round(video.videoHeight * topPct), canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
          status.textContent = `枠${i+1}（${def.label.replace(/^\d\s*/, '')}）を解析中…`;
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.96));
          if (!blob) throw new Error('撮影画像を作成できませんでした。');
          const formData = new FormData(); formData.append('image', blob, `scan-crop-${i+1}.jpg`);
          const response = await fetch('/api/ocr', { method: 'POST', body: formData });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || `OCRサーバーエラー (${response.status})`);
          results.push({ def, text: (data.lines || []).map(x => String(x.text || '').trim()).filter(Boolean).join(' ').toUpperCase() });
        }
        const summary = results.map(r => `${r.def.label}: ${r.text || '読み取りなし'}`).join('\n');
        if (confirm(`読み取り結果を確認してください。\n\n${summary}\n\n各項目に反映しますか？`)) {
          results.forEach(r => { if (r.text) document.getElementById(r.def.key).value = r.text; });
          saveCurrentForm();
        }
        status.textContent = '解析完了。必要なら枠を調整して再撮影できます。';
      } catch (err) { status.textContent = `解析失敗：${err.message || err}`; }
    }

    // カメラが使えない端末向けの従来撮影入力。選択画像をOCRへ送信する
    async function handleNativeCapture(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const unitMode = isUnitRegistration();
      try {
        const formData = new FormData();
        formData.append('image', file, file.name || 'capture.jpg');
        const response = await fetch('/api/ocr', { method: 'POST', body: formData });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `OCRサーバーエラー (${response.status})`);
        const text = (data.lines || []).map(x => String(x.text || '').trim()).filter(Boolean).join(' ').toUpperCase();
        if (!text) throw new Error('文字を読み取れませんでした。');
        const fields = unitMode ? ['f-model', 'f-serial'] : ['f-model', 'f-serial', 'f-remarks'];
        const labels = unitMode ? ['1 製品型式', '2 シリアルNo'] : ['1 製品型式', '2 シリアルNo', '3 Ver / 備考'];
        if (confirm(`撮影画像の認識結果：\n${text}\n\nこの文字列を${labels[0]}欄に反映しますか？\n※端末標準カメラでは枠ごとの切り出しは行いません。`)) {
          document.getElementById(fields[0]).value = text;
          saveCurrentForm();
        }
      } catch (err) { alert(`画像解析に失敗しました。\n${err.message || err}`); }
      finally { e.target.value = ''; }
    }

    function loadCSVFile(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const text = event.target.result;
          const lines = text.split(/\r\n|\n/).map(l => l.trim()).filter(l => l.length > 0);
          const clean = (val) => val ? val.replace(/^"|"$/g, '').trim().toUpperCase() : '';

          lines.forEach(line => {
            const cols = line.split(',').map(clean);
            if (cols[0].includes('製造指図書')) {
              document.getElementById('docNo').value = cols[1] || '';
              document.getElementById('customer').value = cols[3] || '';
            } else if (cols[0] === '機種名') {
              document.getElementById('modelName').value = cols[1] || '';
              document.getElementById('unitNo').value = cols[3] || '';
            } else if (cols[0] === '記入日') {
              document.getElementById('entryDate').value = cols[1] || document.getElementById('entryDate').value;
              document.getElementById('orderQty').value = cols[3] || '';
            } else if (cols[2] === 'エレキ担当') {
              document.getElementById('elecStaff').value = cols[3] || '';
            }
          });

          const headerIdx = lines.findIndex(l => l.includes('No,製品型式') || l.includes('NO,製品型式'));
          if (headerIdx !== -1) {
            const itemLines = lines.slice(headerIdx + 1);
            let newItems = [
              { title: '電源ユニット', model: '', serial: '', remarks: '' },
              { title: 'CPU', model: '', serial: '', remarks: '' },
              { title: 'ベースユニット', model: '', serial: '', remarks: '' },
              { title: 'LIO-04', model: '', serial: '', remarks: '' },
              { title: 'ユニット登録1', model: '', serial: '', remarks: '' }
            ];

            itemLines.forEach((line, idx) => {
              if (idx >= 25) return;
              const match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
              const cols = match ? match.map(clean) : [];
              const no = parseInt(cols[0], 10);
              if (isNaN(no)) return;

              const rowData = {
                model: cols[1] || '',
                serial: cols[2] || '',
                title: cols[3] || '',
                remarks: cols[4] || ''
              };

              if (no >= 1 && no <= 4) {
                newItems[no - 1].model = rowData.model;
                newItems[no - 1].serial = rowData.serial;
                newItems[no - 1].remarks = rowData.remarks;
              } else if (no >= 5) {
                if (rowData.model || rowData.serial || rowData.title || rowData.remarks) {
                  newItems.push({
                    title: rowData.title || '各種機器',
                    model: rowData.model,
                    serial: rowData.serial,
                    remarks: rowData.remarks
                  });
                }
              }
            });
            items = newItems;
          }
          alert('CSVファイルからデータを復元しました！');
          document.getElementById('csvFileInput').value = '';
        } catch (err) {
          alert('CSVファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function saveCSV() {
      saveCurrentForm();
      const docNo = document.getElementById('docNo').value.toUpperCase();
      const modelName = document.getElementById('modelName').value.toUpperCase();
      const unitNo = document.getElementById('unitNo').value || '1';
      const filename = `${yy}${mm}${dd}_${modelName || '機種'}_${docNo || '指図書'}_${unitNo}.csv`;

      let csv = "\uFEFF";
      csv += `製造指図書No,${docNo},客先名,${document.getElementById('customer').value.toUpperCase()}\n`;
      csv += `機種名,${modelName},号機No,${unitNo}\n`;
      csv += `記入日,${document.getElementById('entryDate').value},発注台数,${document.getElementById('orderQty').value}\n`;
      csv += `,,エレキ担当,${document.getElementById('elecStaff').value.toUpperCase()}\n\n`;
      csv += `No,製品型式,シリアルNo,機器名称,備考\n`;

      for (let i = 0; i < 25; i++) {
        const it = items[i] || { model: '', serial: '', title: '', remarks: '' };
        const titleVal = it.title || (i < 4 ? items[i].title : '');
        csv += `${i+1},"${it.model}","${it.serial}","${titleVal}","${it.remarks}"\n`;
      }

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const entryDateEl = document.getElementById('entryDate');
      if (entryDateEl) {
        entryDateEl.value = `${now.getFullYear()}/${mm}/${dd}`;
      }
      render();
    });
  </script>
</body>
