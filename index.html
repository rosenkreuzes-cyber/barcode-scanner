<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    input, select, textarea {
      color-scheme: dark;
    }

    /* 印刷用A4縦1ページスタイル */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 10px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- 1. APIキー管理 Context ---
    const ApiKeyContext = createContext();

    const ApiKeyProvider = ({ children }) => {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('GEMINI_API_KEY', key);
      };

      return (
        <ApiKeyContext.Provider value={{ apiKey, saveApiKey }}>
          {children}
        </ApiKeyContext.Provider>
      );
    };

    const useApiKey = () => useContext(ApiKeyContext);

    // --- 2. AI OCR カメラ・解析コンポーネント ---
    const OcrScannerCard = ({ onOcrSuccess }) => {
      const { apiKey } = useApiKey();
      const [isCamActive, setIsCamActive] = useState(false);
      const [status, setStatus] = useState('Status: 待機中');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setIsCamActive(true);
          setStatus('Status: 撮影準備完了');
        } catch (e) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setIsCamActive(false);
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const captureAndAnalyze = async () => {
        if (!apiKey) {
          alert('APIキーが設定されていません。');
          return;
        }

        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas) return;

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        setStatus('Status: AI (Gemini) 解析中...');

        const promptText = `添付された銘板画像から製品型式("model")、シリアル番号("sn")、およびバージョン・リビジョン情報("version")を抽出しJSON形式で出力してください。
JSON形式例: {"model": "...", "sn": "...", "version": "..."}`;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                ]
              }]
            })
          });

          const data = await res.json();
          if (data.error) {
            setStatus(`Status: エラー (${data.error.message})`);
            return;
          }

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            setStatus('Status: 解析成功！');
            onOcrSuccess({
              model: parsed.model !== '未検出' ? parsed.model : '',
              sn: parsed.sn !== '未検出' ? parsed.sn : '',
              version: parsed.version !== '未検出' ? parsed.version : ''
            });
          } else {
            setStatus('Status: 解析失敗');
          }
        } catch (err) {
          setStatus(`Status: 通信エラー (${err.message})`);
        }
      };

      return (
        <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-2.5 sm:p-3 rounded-xl text-center mb-3">
          <div className="relative w-full h-32 sm:h-40 bg-black rounded-lg overflow-hidden flex items-center justify-center mb-2">
            <video ref={videoRef} playsInline muted className={`w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
            {!isCamActive && <span className="text-xs text-gray-400">📷 カメラ停止中</span>}
            <canvas ref={canvasRef} className="hidden" />
          </div>

          <div className="flex gap-2 mb-1.5">
            {!isCamActive ? (
              <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-2 rounded-lg text-xs">📷 カメラ起動</button>
            ) : (
              <button onClick={captureAndAnalyze} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-2 rounded-lg text-xs">☁️ 撮影 & AI OCR解析</button>
            )}
          </div>
          <div className="text-[10px] sm:text-[11px] text-[#00ffcc] font-mono">{status}</div>
        </div>
      );
    };

    // --- 3. メインアプリケーション ---
    function MainApp() {
      const { apiKey, saveApiKey } = useApiKey();
      const [inputKey, setInputKey] = useState(apiKey);

      // 今日の日付 (YYMMDD)
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
      const yymmdd = `${yy}${mm}${dd}`;

      // 基本情報
      const [baseInfo, setBaseInfo] = useState({
        docNo: '',
        modelName: '',
        entryDate: todayFormatted,
        customer: '',
        unitNo: '',
        orderQty: '',
        elecStaff: ''
      });

      // 固定ユニット
      const [fixedUnits, setFixedUnits] = useState([
        { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
        { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
        { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
        { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
      ]);

      // 各種機器 (初期値空欄、機器名称あり)
      const [devicePacks, setDevicePacks] = useState([
        { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
      ]);

      const [step, setStep] = useState(0);

      const handleSaveKey = () => {
        if (!inputKey.trim()) return alert('APIキーを入力してください');
        saveApiKey(inputKey.trim());
        alert('APIキーを保存しました');
      };

      const handleNextFromHome = () => {
        if (!apiKey.trim()) return alert('APIキーを設定してください');
        setStep(1);
      };

      // 機器追加ボタンを押すとリストに新しい機器を追加
      const handleAddDevice = () => {
        const nextIndex = devicePacks.length + 1;
        setDevicePacks([
          ...devicePacks,
          { id: `device_${Date.now()}`, title: '', model: '', serial: '', remarks: '' }
        ]);
        setStep(4 + nextIndex);
      };

      // CSV保存機能
      const handleSaveCSV = () => {
        const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_');
        const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種名'}_${sanitize(baseInfo.docNo) || '指図書No'}_${sanitize(baseInfo.unitNo) || '号機'}.csv`;

        let csvContent = "\uFEFF";
        csvContent += `製造指図書No,${baseInfo.docNo},客先名,${baseInfo.customer}\n`;
        csvContent += `機種名,${baseInfo.modelName},号機No,${baseInfo.unitNo}\n`;
        csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
        csvContent += `,,エレキ担当,${baseInfo.elecStaff}\n\n`;
        csvContent += `No,製品型式,シリアルNo,機器名称,備考(Version)\n`;

        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        for (let i = 1; i <= 25; i++) {
          const item = allItems[i - 1] || {};
          csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // --- STEP 0: 初期画面 ---
      if (step === 0) {
        return (
          <div className="min-h-[100dvh] p-3 sm:p-4 flex flex-col justify-between max-w-lg mx-auto w-full">
            <div className="w-full">
              <h1 className="text-xl sm:text-2xl font-bold text-center text-[#F5D887] mt-2 mb-1">QuickScan DB</h1>
              <p className="text-xs text-center text-[#E6DAA6]/70 mb-4 sm:mb-6">基本情報設定</p>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl mb-3 sm:mb-4">
                <label className="block text-xs font-bold text-[#F5D887] mb-1">🔑 APIキー設定 (必須)</label>
                <div className="flex gap-2">
                  <input type="password" value={inputKey} onChange={(e) => setInputKey(e.target.value)} placeholder="AIzaSy..." className="flex-1 bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm" />
                  <button onClick={handleSaveKey} className="bg-[#F5D887] text-[#042219] font-bold px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm whitespace-nowrap">保存</button>
                </div>
              </div>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl space-y-2.5 sm:space-y-3">
                <div>
                  <label className="block text-xs font-bold mb-1">製造指図書No (大文字)</label>
                  <input
                    type="text"
                    value={baseInfo.docNo}
                    onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value.toUpperCase()})}
                    placeholder="例: ORD-2026-X"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm uppercase"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">機種名 (大文字)</label>
                  <input
                    type="text"
                    value={baseInfo.modelName}
                    onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value.toUpperCase()})}
                    placeholder="例: MODEL-A100"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm uppercase"
                  />
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">記入日 (自動)</label>
                    <input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-lg px-3 py-2 text-xs sm:text-sm opacity-70" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">客先名</label>
                    <input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value})} placeholder="例: TANAKA CORP" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm" />
                  </div>
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">号機No (数値)</label>
                    <input
                      type="number"
                      value={baseInfo.unitNo}
                      onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})}
                      placeholder="1"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm"
                    />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">発注台数 (数値)</label>
                    <input
                      type="number"
                      value={baseInfo.orderQty}
                      onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})}
                      placeholder="1"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">エレキ担当</label>
                  <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value})} placeholder="例: YAMADA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm" />
                </div>
              </div>
            </div>

            <div className="my-4 sm:my-6">
              <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3 sm:py-3.5 rounded-full text-sm sm:text-base shadow-lg">入力・スキャンを開始 (電源ユニットへ)</button>
            </div>
          </div>
        );
      }

      // --- STEP 1~4: 固定ユニット画面 ---
      if (step >= 1 && step <= 4) {
        const uIndex = step - 1;
        const current = fixedUnits[uIndex];

        return (
          <div className="min-h-[100dvh] p-3 sm:p-4 flex flex-col justify-between max-w-lg mx-auto w-full">
            <div className="w-full">
              <div className="flex justify-between text-xs sm:text-sm mb-2">
                <button onClick={() => setStep(step - 1)}>← 前へ</button>
                <span>{step} / {4 + devicePacks.length}</span>
              </div>
              <h2 className="text-lg sm:text-xl font-bold text-center text-[#F5D887] mb-2 sm:mb-3">{current.title} 画面</h2>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...fixedUnits];
                if (res.model) updated[uIndex].model = res.model;
                if (res.sn) updated[uIndex].serial = res.sn;
                if (res.version) updated[uIndex].remarks = res.version;
                setFixedUnits(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl space-y-2.5 sm:space-y-3">
                <div>
                  <label className="block text-xs mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value; setFixedUnits(u); }} placeholder="型式を入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value; setFixedUnits(u); }} placeholder="シリアルを入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">備考 (Version)</label>
                  <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value; setFixedUnits(u); }} placeholder="例: REV.A / VER.1.0" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm" />
                </div>
              </div>
            </div>

            <div className="my-4 sm:my-6">
              <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3 sm:py-3.5 rounded-full text-sm sm:text-base">次へ</button>
            </div>
          </div>
        );
      }

      // --- STEP 5+: 各種機器画面 ---
      if (step >= 5 && step < 999) {
        const sIndex = step - 5;
        const current = devicePacks[sIndex];

        return (
          <div className="min-h-[100dvh] p-3 sm:p-4 flex flex-col justify-between max-w-lg mx-auto w-full">
            <div className="w-full">
              <div className="flex justify-between text-xs sm:text-sm mb-2">
                <button onClick={() => setStep(step - 1)}>← 前へ</button>
                <span>{step} / {4 + devicePacks.length}</span>
              </div>
              <h2 className="text-lg sm:text-xl font-bold text-center text-[#F5D887] mb-2 sm:mb-3">各種機器 {sIndex + 1} 画面</h2>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...devicePacks];
                if (res.model) updated[sIndex].model = res.model;
                if (res.sn) updated[sIndex].serial = res.sn;
                if (res.version) updated[sIndex].remarks = res.version.toUpperCase();
                setDevicePacks(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl space-y-2.5 sm:space-y-3">
                {/* 機器名称（大文字入力・初期空欄） */}
                <div>
                  <label className="block text-xs mb-1 font-bold">機器名称 (大文字)</label>
                  <input
                    type="text"
                    value={current.title}
                    onChange={(e) => {
                      const s = [...devicePacks];
                      s[sIndex].title = e.target.value.toUpperCase();
                      setDevicePacks(s);
                    }}
                    placeholder="例: SERVO PACK / INVERTER"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm uppercase"
                  />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const s = [...devicePacks]; s[sIndex].model = e.target.value; setDevicePacks(s); }} placeholder="型式を入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const s = [...devicePacks]; s[sIndex].serial = e.target.value; setDevicePacks(s); }} placeholder="シリアルを入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">備考 (Version - 大文字)</label>
                  <input
                    type="text"
                    value={current.remarks}
                    onChange={(e) => {
                      const s = [...devicePacks];
                      s[sIndex].remarks = e.target.value.toUpperCase();
                      setDevicePacks(s);
                    }}
                    placeholder="例: REV.A / VER.1.0"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-xs sm:text-sm uppercase"
                  />
                </div>
              </div>

              <div className="mt-3 sm:mt-4">
                <button onClick={handleAddDevice} className="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-[#F5D887]/10">＋ 機器追加 (次の各種機器画面へ)</button>
              </div>
            </div>

            <div className="my-4 sm:my-6 space-y-2">
              {sIndex < devicePacks.length - 1 && (
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-2.5 sm:py-3 rounded-full text-xs sm:text-sm font-bold">次の各種機器 ({sIndex + 2}) へ</button>
              )}
              <button onClick={() => setStep(999)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3 sm:py-3.5 rounded-full text-sm sm:text-base">入力結果へ (印刷プレビュー表示)</button>
            </div>
          </div>
        );
      }

      // --- STEP 999: 入力結果 & 印刷用シリアル記入シート ---
      if (step === 999) {
        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        const rows = Array.from({ length: 25 }, (_, index) => {
          return allItems[index] || { model: '', serial: '', title: '', remarks: '' };
        });

        // Android用 Fallback Intent
        const androidIntent = "intent://#Intent;scheme=sharpdeskmobile;package=jp.co.sharp.print.sharpdeskmobile;end";

        return (
          <div className="min-h-[100dvh] p-2 sm:p-4 max-w-4xl mx-auto w-full">
            {/* 操作ボタンエリア (非印刷) */}
            <div className="no-print flex flex-wrap justify-between items-center gap-2 mb-4">
              <button onClick={() => setStep(4 + devicePacks.length)} className="text-[#E6DAA6] text-xs sm:text-sm">← 修正に戻る</button>
              <div className="flex gap-2">
                <button onClick={handleSaveCSV} className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm">
                  💾 CSV保存
                </button>
                {/* 直接タップ起動用の <a> タグボタン */}
                <a 
                  href="sharpdeskmobile://" 
                  className="bg-[#F5D887] text-[#042219] font-bold px-4 sm:px-5 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm inline-block text-center shadow-md active:scale-95 transition-transform"
                >
                  🖨️ 外部アプリ起動
                </a>
              </div>
            </div>

            {/* 横スクロール対応コンテナ */}
            <div className="overflow-x-auto w-full border border-gray-700/50 rounded-lg">
              {/* A4印刷エリア */}
              <div className="print-area bg-white text-black p-4 sm:p-6 rounded-lg shadow-xl min-w-[650px]">
                {/* タイトル */}
                <h1 className="text-center font-bold text-lg sm:text-xl mb-3 sm:mb-4 tracking-widest border-b-2 border-black pb-1">シリアル記入シート</h1>

                {/* ヘッダー情報エリア */}
                <table className="w-full text-xs border-collapse border border-black mb-3 sm:mb-4">
                  <tbody>
                    <tr>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 w-[15%] text-left">製造指図書No</th>
                      <td className="border border-black p-1 sm:p-1.5 w-[35%] font-bold font-mono uppercase">{baseInfo.docNo}</td>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 w-[15%] text-left">客先名</th>
                      <td className="border border-black p-1 sm:p-1.5 w-[35%]">{baseInfo.customer}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left">機種名</th>
                      <td className="border border-black p-1 sm:p-1.5 font-bold uppercase">{baseInfo.modelName}</td>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left">号機No</th>
                      <td className="border border-black p-1 sm:p-1.5 font-mono">{baseInfo.unitNo}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left">記入日</th>
                      <td className="border border-black p-1 sm:p-1.5 font-mono">{baseInfo.entryDate}</td>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left">発注台数</th>
                      <td className="border border-black p-1 sm:p-1.5 font-mono">{baseInfo.orderQty}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left" colSpan="2"></th>
                      <th className="border border-black p-1 sm:p-1.5 bg-gray-100 text-left">エレキ担当</th>
                      <td className="border border-black p-1 sm:p-1.5">{baseInfo.elecStaff}</td>
                    </tr>
                  </tbody>
                </table>

                {/* 明細テーブル (機器名称列あり) */}
                <table className="w-full text-xs border-collapse border border-black">
                  <thead>
                    <tr className="bg-gray-200 border-b border-black">
                      <th className="border-r border-black p-1 text-center w-8">No</th>
                      <th className="border-r border-black p-1 w-1/3">製品型式</th>
                      <th className="border-r border-black p-1 w-1/3">シリアルNo</th>
                      <th className="border-r border-black p-1 w-1/5">機器名称</th>
                      <th className="p-1">備考(Version)</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, idx) => (
                      <tr key={idx} className="border-b border-black h-5 sm:h-6">
                        <td className="border-r border-black text-center font-mono font-bold bg-gray-50">{idx + 1}</td>
                        <td className="border-r border-black px-1 font-mono">{row.model}</td>
                        <td className="border-r border-black px-1 font-mono">{row.serial}</td>
                        <td className="border-r border-black px-1 font-mono uppercase">{row.title}</td>
                        <td className="px-1 font-mono">{row.remarks}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    function App() {
      return (
        <ApiKeyProvider>
          <MainApp />
        </ApiKeyProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
