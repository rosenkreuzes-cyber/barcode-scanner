<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シリアル記入シート - Live Barcode/OCR Scanner</title>
    <!-- バーコード・QRコード高速読み取り用のライブラリ (ZXing) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1e14;
            color: #d4af37;
            font-family: sans-serif;
            box-sizing: border-box;
        }

        .screen-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 12px;
            box-sizing: border-box;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .top-nav span {
            cursor: pointer;
        }

        .screen-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin: 5px 0 15px 0;
        }

        .card {
            background-color: #112d20;
            border: 1px solid #1e4d35;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
            color: #a3c1ad;
        }

        .camera-btn {
            background-color: #1e4d35;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .camera-btn:active {
            background-color: #00ffcc;
            color: #0b1e14;
        }

        input[type="text"] {
            width: 100%;
            background-color: #0b1e14;
            border: 1px solid #1e4d35;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        input[type="text"]::placeholder {
            color: #4a6b5a;
        }

        .btn-next {
            display: block;
            width: 100%;
            background-color: #e5c158;
            color: #112d20;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-top: 20px;
            box-sizing: border-box;
        }

        .btn-next:active {
            background-color: #cca441;
        }

        /* --- ライブスキャナーモーダル（映像が潰れないアスペクト比対応） --- */
        #live-scanner-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }

        .viewfinder-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 16 / 9; /* カメラの16:9比率に完全同期して潰れを防ぐ */
            border: 2px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .viewfinder-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 映像の比率を保ったまま枠内に綺麗に収める */
        }

        /* スキャン中のレーザー演出線 */
        .scan-laser {
            position: absolute;
            top: 50%; left: 10%; width: 80%; height: 2px;
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            animation: scanMove 2s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes scanMove {
            0% { top: 15%; }
            100% { top: 85%; }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 上部ナビゲーション -->
        <div class="top-nav">
            <span onclick="prevStep()">← 前へ</span>
            <span id="step-indicator">1 / 4</span>
            <span onclick="goToTop()">🔥 TOP</span>
        </div>

        <div id="screen-title" class="screen-title">電源ユニット 画面</div>

        <div class="card">
            <!-- 機器名称（4番目以降で表示） -->
            <div id="title-group" class="input-group hidden">
                <div class="input-header">
                    <span>機器名称</span>
                    <button type="button" class="camera-btn" onclick="startLiveScan('field-title')">📷 ライブスキャン</button>
                </div>
                <input type="text" id="field-title" placeholder="例: サーボパック" autocomplete="off">
            </div>

            <!-- 製品型式 -->
            <div class="input-group">
                <div class="input-header">
                    <span>製品型式</span>
                    <button type="button" class="camera-btn" onclick="startLiveScan('field-model')">📷 ライブスキャン</button>
                </div>
                <input type="text" id="field-model" placeholder="例: LIO-04" autocomplete="off">
            </div>

            <!-- シリアルNo -->
            <div class="input-group">
                <div class="input-header">
                    <span>シリアルNo</span>
                    <button type="button" class="camera-btn" onclick="startLiveScan('field-serial')">📷 ライブスキャン</button>
                </div>
                <input type="text" id="field-serial" placeholder="シリアル" autocomplete="off">
            </div>

            <!-- 備考 -->
            <div class="input-group">
                <div class="input-header">
                    <span>備考 (バージョン情報等)</span>
                    <button type="button" class="camera-btn" onclick="startLiveScan('field-remark')">📷 ライブスキャン</button>
                </div>
                <input type="text" id="field-remark" placeholder="例: A03" autocomplete="off">
            </div>

            <button type="button" class="btn-next" onclick="nextStep()">次へ</button>
        </div>
    </div>

    <!-- ライブスキャナーモーダル -->
    <div id="live-scanner-modal" class="hidden">
        <div style="text-align: center;">
            <h3 style="color: #00ffcc; margin: 0 0 5px 0;">バーコード / QRスキャン</h3>
            <p style="font-size: 12px; color: #a3c1ad; margin: 0;">枠内にコードを合わせると自動で読み取ります</p>
        </div>
        
        <div class="viewfinder-container">
            <video id="interactive-video" autoplay playsinline muted></video>
            <div class="scan-laser"></div>
        </div>

        <button type="button" onclick="stopLiveScan()" style="width: 100%; max-width: 400px; background-color: #ff4d4d; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;">スキャンを終了（閉じる）</button>
    </div>

    <script>
        let steps = [
            { title: "電源ユニット 画面", model: "", serial: "", remark: "", customTitle: "" },
            { title: "CPU 画面", model: "", serial: "", remark: "", customTitle: "" },
            { title: "ベースユニット 画面", model: "", serial: "", remark: "", customTitle: "" },
            { title: "LIO-04 画面", model: "", serial: "", remark: "", customTitle: "" }
        ];
        let currentStepIndex = 0;
        let activeTargetFieldId = null;
        let codeReader = null;

        function updateScreen() {
            const step = steps[currentStepIndex];
            document.getElementById('screen-title').innerText = step.title;
            document.getElementById('step-indicator').innerText = `${currentStepIndex + 1} / ${steps.length}`;

            document.getElementById('field-model').value = step.model;
            document.getElementById('field-serial').value = step.serial;
            document.getElementById('field-remark').value = step.remark;

            const titleGroup = document.getElementById('title-group');
            if (currentStepIndex >= 4) {
                titleGroup.classList.remove('hidden');
                document.getElementById('field-title').value = step.customTitle;
            } else {
                titleGroup.classList.add('hidden');
            }
        }

        function saveCurrentInput() {
            const step = steps[currentStepIndex];
            step.model = document.getElementById('field-model').value.toUpperCase();
            step.serial = document.getElementById('field-serial').value.toUpperCase();
            step.remark = document.getElementById('field-remark').value.toUpperCase();
            if (currentStepIndex >= 4) {
                step.customTitle = document.getElementById('field-title').value.toUpperCase();
            }
        }

        function nextStep() {
            saveCurrentInput();
            if (currentStepIndex < steps.length - 1) {
                currentStepIndex++;
                updateScreen();
            } else {
                steps.push({ title: `各種機器 ${steps.length - 3} 画面`, model: "", serial: "", remark: "", customTitle: "機器" });
                currentStepIndex++;
                updateScreen();
            }
        }

        function prevStep() {
            saveCurrentInput();
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateScreen();
            }
        }

        function goToTop() {
            saveCurrentInput();
            currentStepIndex = 0;
            updateScreen();
        }

        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('input', (e) => {
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.toUpperCase();
                e.target.setSelectionRange(start, end);
            });
        });

        async function startLiveScan(fieldId) {
            activeTargetFieldId = fieldId;
            const modal = document.getElementById('live-scanner-modal');
            modal.classList.remove('hidden');

            if (!codeReader) {
                codeReader = new ZXing.BrowserBarcodeReader();
            }

            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                let selectedDeviceId = videoInputDevices[0]?.deviceId;
                
                for (const device of videoInputDevices) {
                    if (/back|rear|environment/i.test(device.label)) {
                        selectedDeviceId = device.deviceId;
                        break;
                    }
                }

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'interactive-video', (result, err) => {
                    if (result) {
                        const scannedText = result.getText().trim().toUpperCase();
                        const targetInput = document.getElementById(activeTargetFieldId);
                        if (targetInput) {
                            targetInput.value = scannedText;
                        }
                        
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopLiveScan();
                    }
                });
            } catch (err) {
                console.error("カメラ起動エラー:", err);
                alert("カメラを起動できませんでした。");
                stopLiveScan();
            }
        }

        function stopLiveScan() {
            const modal = document.getElementById('live-scanner-modal');
            modal.classList.add('hidden');
            if (codeReader) {
                codeReader.reset();
            }
        }

        updateScreen();
    </script>
</body>
</html>
