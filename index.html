<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- 1. APIキー管理 Context ---
    const ApiKeyContext = createContext();

    const ApiKeyProvider = ({ children }) => {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('GEMINI_API_KEY', key);
      };

      return (
        <ApiKeyContext.Provider value={{ apiKey, saveApiKey }}>
          {children}
        </ApiKeyContext.Provider>
      );
    };

    const useApiKey = () => useContext(ApiKeyContext);

    // --- 2. APIキー読み取り用 QRコードスキャナー ---
    const ApiKeyQrScanner = ({ onScanSuccess, onClose }) => {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);

      useEffect(() => {
        let stream = null;

        const startScan = async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' }
            });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play();
              animFrameRef.current = requestAnimationFrame(scanFrame);
            }
          } catch (err) {
            alert('カメラの起動に失敗しました。');
            onClose();
          }
        };

        const scanFrame = () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (video && video.readyState === video.HAVE_ENOUGH_DATA && canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert',
            });

            if (code && code.data) {
              onScanSuccess(code.data.trim());
              return;
            }
          }
          animFrameRef.current = requestAnimationFrame(scanFrame);
        };

        startScan();

        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
          <div className="text-[#F5D887] text-lg font-bold mb-2">📷 APIキーのQRコードをかざしてください</div>
          <div className="relative w-full max-w-sm h-64 bg-black rounded-xl overflow-hidden border-2 border-[#00ffcc] mb-4">
            <video ref={videoRef} playsInline muted className="w-full h-full object-cover" />
            <canvas ref={canvasRef} className="hidden" />
          </div>
          <button
            onClick={onClose}
            className="bg-gray-700 text-white font-bold px-6 py-3 rounded-full text-base"
          >
            キャンセル
          </button>
        </div>
      );
    };

    // --- 3. AI OCR カメラ・解析コンポーネント ---
    const OcrScannerCard = ({ onOcrSuccess }) => {
      const { apiKey } = useApiKey();
      const [isCamActive, setIsCamActive] = useState(false);
      const [status, setStatus] = useState('Status: 待機中');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setIsCamActive(true);
          setStatus('Status: 撮影準備完了');
        } catch (e) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setIsCamActive(false);
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const captureAndAnalyze = async () => {
        if (!apiKey) {
          alert('APIキーが設定されていません。');
          return;
        }

        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas) return;

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        setStatus('Status: AI (Gemini) 解析中...');

        const promptText = `添付された銘板画像から製品型式("model")、シリアル番号("sn")、およびバージョン・リビジョン・HW/FW情報("version")を抽出しJSON形式で出力してください。

【抽出ルール】
1. "model": メインの製品型式・型番（例: LIO-04, FMC-71, GD-275 等）。
2. "sn": シリアル番号（S/N, SERIAL, 製造番号）。
3. "version": バージョン、リビジョン、HW/FW/SW表記、または型式とは別で銘板に記載されている補助記号・数字（例: REV.A, Ver.1.0, FW1.02, A, 1.0 など）。
   ※ただし、"model" や "sn" として抽出した文字列と全く同じものを重複して "version" に入れないでください。該当する情報が見当たらない場合のみ空文字 "" にしてください。

JSON形式例: {"model": "...", "sn": "...", "version": "..."}`;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                ]
              }]
            })
          });

          const data = await res.json();
          if (data.error) {
            setStatus(`Status: エラー (${data.error.message})`);
            return;
          }

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            setStatus('Status: 解析成功！');
            onOcrSuccess({
              model: parsed.model && parsed.model !== '未検出' ? parsed.model : '',
              sn: parsed.sn && parsed.sn !== '未検出' ? parsed.sn : '',
              version: parsed.version && parsed.version !== '未検出' ? parsed.version : ''
            });
          } else {
            setStatus('Status: 解析失敗');
          }
        } catch (err) {
          setStatus(`Status: 通信エラー (${err.message})`);
        }
      };

      return (
        <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg">
          <div className="relative w-full h-48 sm:h-56 bg-black rounded-xl overflow-hidden flex items-center justify-center mb-3 border border-[#E6DAA6]/20">
            <video ref={videoRef} playsInline muted className={`w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
            {!isCamActive && <span className="text-base text-gray-400">📷 カメラ停止中</span>}
            <canvas ref={canvasRef} className="hidden" />
          </div>

          <div className="flex gap-2 mb-2">
            {!isCamActive ? (
              <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base sm:text-lg">📷 カメラ起動</button>
            ) : (
              <button onClick={captureAndAnalyze} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base sm:text-lg shadow-md">☁️ 撮影 & AI OCR解析</button>
            )}
          </div>
          <div className="text-sm text-[#00ffcc] font-mono font-bold">{status}</div>
        </div>
      );
    };

    // --- 4. メインアプリケーション ---
    function MainApp() {
      const { apiKey, saveApiKey } = useApiKey();
      const [inputKey, setInputKey] = useState(apiKey);
      const [showQrScanner, setShowQrScanner] = useState(false);

      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
      const yymmdd = `${yy}${mm}${dd}`;

      const [baseInfo, setBaseInfo] = useState({
        docNo: '',
        modelName: '',
        entryDate: todayFormatted,
        customer: '',
        unitNo: '',
        orderQty: '',
        elecStaff: ''
      });

      const [fixedUnits, setFixedUnits] = useState([
        { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
        { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
        { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
        { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
      ]);

      const [devicePacks, setDevicePacks] = useState([
        { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
      ]);

      const [step, setStep] = useState(0);

      const handleSaveKey = () => {
        if (!inputKey.trim()) return alert('APIキーを入力してください');
        saveApiKey(inputKey.trim());
        alert('APIキーを保存しました');
      };

      const handleQrScanSuccess = (scannedKey) => {
        setShowQrScanner(false);
        setInputKey(scannedKey);
        saveApiKey(scannedKey);
        alert('QRコードからAPIキーを読み込み・保存しました！');
      };

      const handleNextFromHome = () => {
        if (!apiKey.trim()) return alert('APIキーを設定してください');
        setStep(1);
      };

      const handleAddDevice = () => {
        const nextIndex = devicePacks.length + 1;
        setDevicePacks([
          ...devicePacks,
          { id: `device_${Date.now()}`, title: '', model: '', serial: '', remarks: '' }
        ]);
        setStep(4 + nextIndex);
      };

      const handleGoTop = () => {
        if (window.confirm('TOP画面に戻りますか？（入力した情報は保持されます）')) {
          setStep(0);
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const handleSaveCSV = () => {
        const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_');
        const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種名'}_${sanitize(baseInfo.docNo) || '指図書No'}_${sanitize(baseInfo.unitNo) || '号機'}.csv`;

        let csvContent = "\uFEFF";
        csvContent += `製造指図書No,${baseInfo.docNo},客先名,${baseInfo.customer}\n`;
        csvContent += `機種名,${baseInfo.modelName},号機No,${baseInfo.unitNo}\n`;
        csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
        csvContent += `,,エレキ担当,${baseInfo.elecStaff}\n\n`;
        csvContent += `No,製品型式,シリアルNo,機器名称,備考\n`;

        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        for (let i = 1; i <= 25; i++) {
          const item = allItems[i - 1] || {};
          csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // --- STEP 0: 初期画面 ---
      if (step === 0) {
        return (
          <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
            {showQrScanner && (
              <ApiKeyQrScanner
                onScanSuccess={handleQrScanSuccess}
                onClose={() => setShowQrScanner(false)}
              />
            )}

            <div className="w-full flex-1 flex flex-col justify-evenly py-2">
              <div>
                <h1 className="text-3xl font-extrabold text-center text-[#F5D887] mb-1">QuickScan DB</h1>
                <p className="text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium">基本情報設定</p>
              </div>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2">
                <label className="block text-sm font-bold text-[#F5D887] mb-1.5">🔑 APIキー設定 (必須)</label>
                <div className="flex gap-1.5 mb-2">
                  <input
                    type="password"
                    value={inputKey}
                    onChange={(e) => setInputKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="flex-1 bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base"
                  />
                  <button
                    onClick={() => setShowQrScanner(true)}
                    className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-3 py-2.5 rounded-xl text-sm whitespace-nowrap active:scale-95"
                  >
                    📷 QR読取
                  </button>
                  <button
                    onClick={handleSaveKey}
                    className="bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-xl text-base whitespace-nowrap active:scale-95"
                  >
                    保存
                  </button>
                </div>
              </div>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-sm font-bold mb-1">製造指図書No (大文字)</label>
                  <input
                    type="text"
                    value={baseInfo.docNo}
                    onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value.toUpperCase()})}
                    placeholder="例: ORD-2026-X"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase font-mono"
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">機種名 (大文字)</label>
                  <input
                    type="text"
                    value={baseInfo.modelName}
                    onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value.toUpperCase()})}
                    placeholder="例: MODEL-A100"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase font-mono"
                  />
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-sm font-bold mb-1">記入日 (自動)</label>
                    <input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-sm font-bold mb-1">客先名</label>
                    <input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value})} placeholder="例: TANAKA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                  </div>
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-sm font-bold mb-1">号機No (数値)</label>
                    <input
                      type="number"
                      value={baseInfo.unitNo}
                      onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})}
                      placeholder="1"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                    />
                  </div>
                  <div className="flex-1">
                    <label className="block text-sm font-bold mb-1">発注台数 (数値)</label>
                    <input
                      type="number"
                      value={baseInfo.orderQty}
                      onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})}
                      placeholder="1"
                      className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">エレキ担当</label>
                  <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value})} placeholder="例: YAMADA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                </div>
              </div>
            </div>

            <div className="py-3">
              <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl">入力・スキャンを開始 (電源ユニットへ)</button>
            </div>
          </div>
        );
      }

      // --- STEP 1~4: 固定ユニット画面 ---
      if (step >= 1 && step <= 4) {
        const uIndex = step - 1;
        const current = fixedUnits[uIndex];

        return (
          <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
            <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
              <div>
                <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                  <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                  <span>{step} / {4 + devicePacks.length}</span>
                </div>
                <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">{current.title} 画面</h2>
              </div>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...fixedUnits];
                if (res.model) updated[uIndex].model = res.model;
                if (res.sn) updated[uIndex].serial = res.sn;
                if (res.version) updated[uIndex].remarks = res.version;
                setFixedUnits(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-sm mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value; setFixedUnits(u); }} placeholder="型式を入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
                </div>
                <div>
                  <label className="block text-sm mb-1 font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value; setFixedUnits(u); }} placeholder="シリアルを入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
                </div>
                <div>
                  <label className="block text-sm mb-1 font-bold">備考</label>
                  <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value; setFixedUnits(u); }} placeholder="例: REV.A / VER.1.0" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                </div>
              </div>
            </div>

            <div className="py-3">
              <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
            </div>
          </div>
        );
      }

      // --- STEP 5+: 各種機器画面 ---
      if (step >= 5 && step < 999) {
        const sIndex = step - 5;
        const current = devicePacks[sIndex];

        return (
          <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
            <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
              <div>
                <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                  <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                  <span>{step} / {4 + devicePacks.length}</span>
                </div>
                <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">各種機器 {sIndex + 1} 画面</h2>
              </div>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...devicePacks];
                if (res.model) updated[sIndex].model = res.model;
                if (res.sn) updated[sIndex].serial = res.sn;
                setDevicePacks(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-sm mb-1 font-bold">機器名称 (大文字)</label>
                  <input
                    type="text"
                    value={current.title}
                    onChange={(e) => {
                      const s = [...devicePacks];
                      s[sIndex].title = e.target.value.toUpperCase();
                      setDevicePacks(s);
                    }}
                    placeholder="例: SERVO PACK / INVERTER"
                    className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase"
                  />
                </div>
                <div>
                  <label className="block text-sm mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const s = [...devicePacks]; s[sIndex].model = e.target.value; setDevicePacks(s); }} placeholder="型式を入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
                </div>
                <div>
                  <label className="block text-sm font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const s = [...devicePacks]; s[sIndex].serial = e.target.value; setDevicePacks(s); }} placeholder="シリアルを入力またはスキャン" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
                </div>
              </div>

              <div className="mt-2">
                <button onClick={handleAddDevice} className="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-3 rounded-xl text-base font-bold bg-[#F5D887]/10">＋ 機器追加 (次の各種機器画面へ)</button>
              </div>
            </div>

            <div className="py-3 space-y-2">
              {sIndex < devicePacks.length - 1 && (
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-base font-bold">次の各種機器 ({sIndex + 2}) へ</button>
              )}
              <button onClick={() => setStep(999)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">入力結果へ (印刷プレビュー表示)</button>
            </div>
          </div>
        );
      }

      // --- STEP 999: 入力結果 & 印刷用シリアル記入シート ---
      if (step === 999) {
        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        const rows = Array.from({ length: 25 }, (_, index) => {
          return allItems[index] || { model: '', serial: '', title: '', remarks: '' };
        });

        return (
          <div className="min-h-[100dvh] p-2 sm:p-4 max-w-5xl mx-auto w-full">
            {/* 操作ボタンエリア (非印刷) */}
            <div className="no-print flex flex-wrap justify-between items-center gap-2 mb-4">
              <div className="flex gap-3 items-center">
                <button onClick={() => setStep(4 + devicePacks.length)} className="text-[#E6DAA6] text-base font-bold hover:underline">
                  ← 修正に戻る
                </button>
                <button onClick={handleGoTop} className="text-[#F5D887] text-base font-bold hover:underline">
                  🏠 TOP画面へ
                </button>
              </div>
              <div className="flex gap-2">
                <button onClick={handleSaveCSV} className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base">
                  💾 CSV保存
                </button>
                <button
                  onClick={handlePrint}
                  className="bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-full text-sm sm:text-base text-center shadow-md active:scale-95"
                >
                  🖨️ 印刷 (印刷ダイアログ起動)
                </button>
              </div>
            </div>

            {/* 横スクロール対応コンテナ */}
            <div className="overflow-x-auto w-full border border-gray-700/50 rounded-lg">
              {/* A4印刷エリア */}
              <div className="print-area bg-white text-black p-4 sm:p-6 rounded-lg shadow-xl min-w-[680px]">
                <h1 className="text-center font-bold text-xl sm:text-2xl mb-3 tracking-widest border-b-2 border-black pb-1">シリアル記入シート</h1>

                <table className="w-full text-xs sm:text-sm border-collapse border border-black mb-3">
                  <tbody>
                    <tr>
                      <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">製造指図書No</th>
                      <td className="border border-black p-1 w-[35%] font-bold font-mono uppercase">{baseInfo.docNo}</td>
                      <th className="border border-black p-1 bg-gray-100 w-[15%] text-left">客先名</th>
                      <td className="border border-black p-1 w-[35%]">{baseInfo.customer}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 bg-gray-100 text-left">機種名</th>
                      <td className="border border-black p-1 font-bold uppercase">{baseInfo.modelName}</td>
                      <th className="border border-black p-1 bg-gray-100 text-left">号機No</th>
                      <td className="border border-black p-1 font-mono">{baseInfo.unitNo}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 bg-gray-100 text-left">記入日</th>
                      <td className="border border-black p-1 font-mono">{baseInfo.entryDate}</td>
                      <th className="border border-black p-1 bg-gray-100 text-left">発注台数</th>
                      <td className="border border-black p-1 font-mono">{baseInfo.orderQty}</td>
                    </tr>
                    <tr>
                      <th className="border border-black p-1 bg-gray-100 text-left" colSpan="2"></th>
                      <th className="border border-black p-1 bg-gray-100 text-left">エレキ担当</th>
                      <td className="border border-black p-1">{baseInfo.elecStaff}</td>
                    </tr>
                  </tbody>
                </table>

                <table className="w-full text-xs sm:text-sm border-collapse border border-black">
                  <thead>
                    <tr className="bg-gray-200 border-b border-black">
                      <th className="border-r border-black p-1 text-center w-8">No</th>
                      <th className="border-r border-black p-1 w-[28%]">製品型式</th>
                      <th className="border-r border-black p-1 w-[28%]">シリアルNo</th>
                      <th className="border-r border-black p-1 w-[16%]">機器名称</th>
                      <th className="p-1 w-[28%]">備考</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, idx) => (
                      <tr key={idx} className="border-b border-black h-5 sm:h-6">
                        <td className="border-r border-black text-center font-mono font-bold bg-gray-50">{idx + 1}</td>
                        <td className="border-r border-black px-1 font-mono text-sm sm:text-base font-bold print-large-text">{row.model}</td>
                        <td className="border-r border-black px-1 font-mono text-sm sm:text-base font-bold print-large-text">{row.serial}</td>
                        <td className="border-r border-black px-1 font-mono uppercase text-xs sm:text-sm">{row.title}</td>
                        <td className="px-1 font-mono text-xs sm:text-sm">{row.remarks}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    function App() {
      return (
        <ApiKeyProvider>
          <MainApp />
        </ApiKeyProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
