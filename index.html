<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- 1. APIキー管理 Context ---
    const ApiKeyContext = createContext();

    const ApiKeyProvider = ({ children }) => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('GEMINI_API_KEY') || ''; } catch(e) { return ''; }
      });

      const saveApiKey = (key) => {
        setApiKey(key);
        try { localStorage.setItem('GEMINI_API_KEY', key); } catch(e) {}
      };

      return (
        <ApiKeyContext.Provider value={{ apiKey, saveApiKey }}>
          {children}
        </ApiKeyContext.Provider>
      );
    };

    const useApiKey = () => useContext(ApiKeyContext);

    // --- 2. APIキー読み取り用 QRコードスキャナー ---
    const ApiKeyQrScanner = ({ onScanSuccess, onClose }) => {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);

      useEffect(() => {
        let stream = null;

        const startScan = async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' }
            });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play();
              animFrameRef.current = requestAnimationFrame(scanFrame);
            }
          } catch (err) {
            alert('カメラの起動に失敗しました。');
            onClose();
          }
        };

        const scanFrame = () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (video && video.readyState === video.HAVE_ENOUGH_DATA && canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert',
            });

            if (code && code.data) {
              onScanSuccess(code.data.trim());
              return;
            }
          }
          animFrameRef.current = requestAnimationFrame(scanFrame);
        };

        startScan();

        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
          <div className="text-[#F5D887] text-lg font-bold mb-2">📷 APIキーのQRコードをかざしてください</div>
          <div className="relative w-full max-w-sm h-64 bg-black rounded-xl overflow-hidden border-2 border-[#00ffcc] mb-4">
            <video ref={videoRef} playsInline muted className="w-full h-full object-cover" />
            <canvas ref={canvasRef} className="hidden" />
          </div>
          <button
            onClick={onClose}
            className="bg-gray-700 text-white font-bold px-6 py-3 rounded-full text-base"
          >
            キャンセル
          </button>
        </div>
      );
    };

    // --- 3. AI OCR カメラ・解析コンポーネント (gemini-1.5-flashを使用) ---
    const OcrScannerCard = ({ onOcrSuccess }) => {
      const { apiKey } = useApiKey();
      const [isCamActive, setIsCamActive] = useState(false);
      const [status, setStatus] = useState('Status: 待機中');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setIsCamActive(true);
          setStatus('Status: 撮影準備完了');
        } catch (e) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setIsCamActive(false);
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const captureAndAnalyze = async () => {
        if (!apiKey) {
          alert('APIキーが設定されていません。');
          return;
        }

        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas) return;

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        setStatus('Status: AI (Gemini 1.5) 解析中...');

        const promptText = `添付された銘板画像から製品型式("model")、シリアル番号("sn")、およびバージョン・リビジョン・HW/FW情報("version")を抽出しJSON形式で出力してください。

【抽出ルール】
1. "model": メインの製品型式・型番（例: LIO-04, FMC-71, GD-275 等）。
2. "sn": シリアル番号（S/N, SERIAL, 製造番号）。
3. "version": バージョン、リビジョン、HW/FW/SW表記、または型式とは別で銘板に記載されている補助記号・数字（例: REV.A, Ver.1.0, FW1.02, A, 1.0 など）。
   ※ただし、"model" や "sn" として抽出した文字列と全く同じものを重複して "version" に入れないでください。該当する情報が見当たらない場合のみ空文字 "" にしてください。

JSON形式例: {"model": "...", "sn": "...", "version": "..."}`;

        try {
          // 安定性の高い gemini-1.5-flash エンドポイントに変更
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                ]
              }]
            })
          });

          const data = await res.json();
          if (data.error) {
            setStatus(`Status: エラー (${data.error.message})`);
            return;
          }

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            setStatus('Status: 解析成功！');
            onOcrSuccess({
              model: parsed.model && parsed.model !== '未検出' ? parsed.model : '',
              sn: parsed.sn && parsed.sn !== '未検出' ? parsed.sn : '',
              version: parsed.version && parsed.version !== '未検出' ? parsed.version : ''
            });
          } else {
            setStatus('Status: 解析失敗');
          }
        } catch (err) {
          setStatus(`Status: 通信エラー (${err.message})`);
        }
      };

      return (
        <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg">
          <div className="relative w-full h-48 sm:h-56 bg-black rounded-xl overflow-hidden flex items-center justify-center mb-3 border border-[#E6DAA6]/20">
            <video ref={videoRef} playsInline muted className={`w-full h-full object-cover ${
