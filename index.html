<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (QRデータ自動振り分け版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- jsQR (バーコード・QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    input, select, textarea {
      color-scheme: dark;
      text-transform: uppercase;
    }
    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }
    @media print {
      body, #root { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #000 !important; padding: 4px 6px; font-size: 11px !important; text-align: left; color: black !important; }
      th { background-color: #f2f2f2 !important; font-weight: bold; }
      .print-large-text { font-size: 13px !important; font-weight: bold !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body class="h-full">
  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">システム起動中...</div>
  </div>

  <script>
    try {
      const { useState, useEffect, useRef, createElement: h } = React;

      // --- QR/バーコードスマート抽出コンポーネント ---
      function SmartScannerCard({ onDataParsed }) {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState('Status: 待機中 (バーコード/QR読取)');
        
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            setStatus('Status: カメラ起動中...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setIsCamActive(true);
            setStatus('Status: 読み取りたいコードを中央に合わせてボタンを押してください');
          } catch (e) {
            setStatus('Status: カメラ起動エラー');
            alert('カメラの起動に失敗しました。');
          }
        };

        const stopCamera = () => {
          try {
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
          } catch (e) {}
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => stopCamera();
        }, []);

        // 読み取ったデータから型式やシリアルを賢く抽出し、振り分ける関数
        const parseScannedData = (rawText) => {
          const text = rawText.trim().toUpperCase();
          let model = '';
          let serial = '';
          let remarks = '';

          // 1. シリアルNoのパターン（例: D025... や S/N:D025...）を検出
          const snMatch = text.match(/(?:S\/N[:\s]*)?([A-Z0-9]{10,})/);
          
          // 2. 型式のパターン（例: JEPMC-..., SGDXW-... など）を検出
          const modelMatch = text.match(/(?:JEPMC|SGDX|SGM7|CIMR|FLV|JUSP)[A-Z0-9\-]*/);

          if (modelMatch) {
            model = modelMatch[0];
          }

          if (snMatch) {
            // シリアル候補が見つかった場合、型式と重複していなければシリアルに割り当て
            const candidate = snMatch[1];
            if (candidate !== model) {
              serial = candidate;
            }
          }

          // もし特定のフォーマットに合わず全体が長い文字列（QRコード等）の場合
          if (!model && !serial) {
            // カンマやスラッシュ、スペース等で分割して要素を割り振る
            const parts = text.split(/[\s,\/]+/);
            if (parts.length > 0) model = parts[0];
            if (parts.length > 1) serial = parts[1];
            if (parts.length > 2) remarks = parts.slice(2).join(' ');
          } else if (!serial && text !== model) {
            serial = text.replace(model, '').trim();
          }

          return { model, serial, remarks };
        };

        const captureAndScan = () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          ctx.drawImage(video, 0, 0, vWidth, vHeight);

          if (typeof jsQR === 'undefined') {
            setStatus('Status: jsQRライブラリ未読込');
            return;
          }

          setStatus('Status: コード解析中...');

          try {
            const imgData = ctx.getImageData(0, 0, vWidth, vHeight);
            const code = jsQR(imgData.data, imgData.width, imgData.height);

            if (code && code.data) {
              const rawData = code.data;
              const parsed = parseScannedData(rawData);
              setStatus('Status: 読取成功！データを自動振り分けました');
              onDataParsed(parsed);
            } else {
              setStatus('Status: コードが見つかりません（位置を調整してください）');
            }
          } catch (err) {
            setStatus('Status: 読取エラー');
          }
        };

        return h('div', { className: 'bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg' },
          h('div', { 
            className: 'relative w-full h-72 sm:h-80 bg-black rounded-xl overflow-hidden mb-3 border border-[#E6DAA6]/30 select-none flex items-center justify-center'
          },
            h('video', { ref: videoRef, playsInline: true, muted: true, autoPlay: true, className: 'absolute inset-0 w-full h-full object-contain ' + (!isCamActive ? 'hidden' : '') }),
            // 中央の照準ガイド
            isCamActive && h('div', { className: 'absolute inset-12 border border-white/40 pointer-events-none rounded flex items-center justify-center' },
              h('div', { className: 'w-12 h-0.5 bg-[#00ffcc]/80 absolute' }),
              h('div', { className: 'w-0.5 h-12 bg-[#00ffcc]/80 absolute' })
            ),
            !isCamActive && h('div', { className: 'absolute inset-0 flex items-center justify-center text-base text-[#E6DAA6]/70 z-10' }, '📷 カメラ停止中'),
            h('canvas', { ref: canvasRef, className: 'hidden' })
          ),
          h('div', { className: 'flex gap-2 mb-2' },
            !isCamActive ? 
              h('button', { onClick: startCamera, className: 'flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base sm:text-lg' }, '📷 カメラ起動') :
              h('button', { onClick: captureAndScan, className: 'flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base sm:text-lg shadow-md active:scale-95' }, '📸 コードを読み取る (自動分解)')
          ),
          h('div', { className: 'text-xs text-[#00ffcc] font-mono font-bold' }, status)
        );
      }

      function MainApp() {
        const fileInputRef = useRef(null);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayFormatted = now.getFullYear() + '/' + mm + '/' + dd;
        const yymmdd = yy + mm + dd;

        const [baseInfo, setBaseInfo] = useState({
          docNo: '', modelName: '', entryDate: todayFormatted, customer: '', unitNo: '', orderQty: '', elecStaff: ''
        });

        const [fixedUnits, setFixedUnits] = useState([
          { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
          { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
          { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
          { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
        ]);

        const [devicePacks, setDevicePacks] = useState([
          { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
        ]);

        const [step, setStep] = useState(0);

        const handleNextFromHome = () => setStep(1);

        const handleAddDevice = () => {
          const nextIndex = devicePacks.length + 1;
          setDevicePacks(devicePacks.concat([{ id: 'device_' + Date.now(), title: '', model: '', serial: '', remarks: '' }]));
          setStep(4 + nextIndex);
        };

        const handleGoTop = () => {
          if (window.confirm('TOP画面に戻りますか？')) setStep(0);
        };

        const handlePrint = () => window.print();

        const handleLoadCSV = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
              const clean = (val) => val ? val.replace(/^"|"$/g, '').trim().toUpperCase() : '';

              let newBaseInfo = Object.assign({}, baseInfo);
              lines.forEach(line => {
                const cols = line.split(',').map(clean);
                if (cols[0] === '製造指図書NO' || cols[0] === '製造指図書No') {
                  newBaseInfo.docNo = cols[1] || '';
                  newBaseInfo.customer = cols[3] || '';
                } else if (cols[0] === '機種名') {
                  newBaseInfo.modelName = cols[1] || '';
                  newBaseInfo.unitNo = cols[3] || '';
                } else if (cols[0] === '記入日') {
                  newBaseInfo.entryDate = cols[1] || todayFormatted;
                  newBaseInfo.orderQty = cols[3] || '';
                } else if (cols[2] === 'エレキ担当') {
                  newBaseInfo.elecStaff = cols[3] || '';
                }
              });
              setBaseInfo(Object.assign({}, newBaseInfo, {
                docNo: newBaseInfo.docNo.toUpperCase(),
                modelName: newBaseInfo.modelName.toUpperCase(),
                customer: newBaseInfo.customer.toUpperCase(),
                elecStaff: newBaseInfo.elecStaff.toUpperCase()
              }));

              const tableHeaderIdx = lines.findIndex(l => l.includes('No,製品型式') || l.includes('NO,製品型式'));
              if (tableHeaderIdx !== -1) {
                const itemLines = lines.slice(tableHeaderIdx + 1);

                let newFixed = [
                  { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
                  { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
                  { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
                  { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
                ];
                let newDevices = [];

                itemLines.forEach((line, idx) => {
                  if (idx >= 25) return;
                  const match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                  const cols = match ? match.map(clean) : [];
                  
                  const no = parseInt(cols[0], 10);
                  if (isNaN(no)) return;

                  const model = cols[1] || '';
                  const serial = cols[2] || '';
                  const title = cols[3] || '';
                  const remarks = cols[4] || '';

                  if (no >= 1 && no <= 4) {
                    newFixed[no - 1].model = model.toUpperCase();
                    newFixed[no - 1].serial = serial.toUpperCase();
                    newFixed[no - 1].remarks = remarks.toUpperCase();
                  } else if (no >= 5) {
                    if (model || serial || title || remarks || newDevices.length > 0) {
                      newDevices.push({
                        id: 'device_' + Date.now() + '_' + no,
                        title: title.toUpperCase(),
                        model: model.toUpperCase(),
                        serial: serial.toUpperCase(),
                        remarks: remarks.toUpperCase()
                      });
                    }
                  }
                });

                setFixedUnits(newFixed);
                if (newDevices.length > 0) {
                  setDevicePacks(newDevices);
                } else {
                  setDevicePacks([{ id: 'device_1', title: '', model: '', serial: '', remarks: '' }]);
                }
              }

              alert('CSVファイルからデータを復元しました。');
              if (fileInputRef.current) fileInputRef.current.value = '';
            } catch (err) {
              alert('CSVファイルの読み込みに失敗しました。');
            }
          };
          reader.readAsText(file, 'UTF-8');
        };

        const handleSaveCSV = () => {
          const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_').toUpperCase();
          const filename = yymmdd + '_' + (sanitize(baseInfo.modelName) || '機種名') + '_' + (sanitize(baseInfo.docNo) || '指図書No') + '_' + (sanitize(baseInfo.unitNo) || '号機') + '.csv';

          let csvContent = "\uFEFF";
          csvContent += '製造指図書No,' + (baseInfo.docNo || '').toUpperCase() + ',客先名,' + (baseInfo.customer || '').toUpperCase() + '\n';
          csvContent += '機種名,' + (baseInfo.modelName || '').toUpperCase() + ',号機No,' + baseInfo.unitNo + '\n';
          csvContent += '記入日,' + baseInfo.entryDate + ',発注台数,' + baseInfo.orderQty + '\n';
          csvContent += ',,エレキ担当,' + (baseInfo.elecStaff || '').toUpperCase() + '\n\n';
          csvContent += 'No,製品型式,シリアルNo,機器名称,備考\n';

          const allItems = fixedUnits.map(u => ({
            model: (u.model || '').toUpperCase(), serial: (u.serial || '').toUpperCase(), title: (u.title || '').toUpperCase(), remarks: (u.remarks || '').toUpperCase()
          })).concat(devicePacks.map(s => ({
            model: (s.model || '').toUpperCase(), serial: (s.serial || '').toUpperCase(), title: (s.title || '').toUpperCase(), remarks: (s.remarks || '').toUpperCase()
          })));

          for (let i = 1; i <= 25; i++) {
            const item = allItems[i - 1] || {};
            csvContent += i + ',"' + (item.model || '') + '","' + (item.serial || '') + '","' + (item.title || '') + '","' + (item.remarks || '') + '"\n';
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        if (step === 0) {
          return h('div', { className: 'app-container max-w-xl mx-auto w-full px-4 justify-between' },
            h('input', { type: 'file', accept: '.csv', ref: fileInputRef, onChange: handleLoadCSV, className: 'hidden' }),
            h('div', { className: 'w-full flex-1 flex flex-col justify-evenly py-2' },
              h('div', null,
                h('h1', { className: 'text-3xl font-extrabold text-center text-[#F5D887] mb-1' }, 'QuickScan DB'),
                h('p', { className: 'text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium' }, '✨ QR/バーコード自動分解読取版')
              ),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2 space-y-3' },
                h('div', null,
                  h('button', {
                    onClick: () => fileInputRef.current && fileInputRef.current.click(),
                    className: 'w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base flex items-center justify-center gap-2 active:scale-95 shadow-md'
                  }, '📂 保存済みCSVを読み込んで編集・追記')
                )
              ),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3' },
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, '製造指図書No'),
                  h('input', { type: 'text', value: baseInfo.docNo, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { docNo: e.target.value.toUpperCase() })), placeholder: '例: ORD-2026-X', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, '機種名'),
                  h('input', { type: 'text', value: baseInfo.modelName, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { modelName: e.target.value.toUpperCase() })), placeholder: '例: MODEL-A100', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', { className: 'flex gap-2' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '記入日 (自動)'),
                    h('input', { type: 'text', value: baseInfo.entryDate, readOnly: true, className: 'w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono' })
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '客先名'),
                    h('input', { type: 'text', value: baseInfo.customer, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { customer: e.target.value.toUpperCase() })), placeholder: '例: TANAKA', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                  )
                ),
                h('div', { className: 'flex gap-2' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '号機No (数値)'),
                    h('input', { type: 'number', value: baseInfo.unitNo, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { unitNo: e.target.value })), placeholder: '1', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono' })
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'block text-sm font-bold mb-1' }, '発注台数 (数値)'),
                    h('input', { type: 'number', value: baseInfo.orderQty, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { orderQty: e.target.value })), placeholder: '1', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono' })
                  )
                ),
                h('div', null,
                  h('label', { className: 'block text-sm font-bold mb-1' }, 'エレキ担当'),
                  h('input', { type: 'text', value: baseInfo.elecStaff, onChange: (e) => setBaseInfo(Object.assign({}, baseInfo, { elecStaff: e.target.value.toUpperCase() })), placeholder: '例: YAMADA', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                )
              )
            ),
            h('div', { className: 'py-3' },
              h('button', { onClick: handleNextFromHome, className: 'w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl' }, '入力を開始 (電源ユニットへ)')
            )
          );
        }

        if (step >= 1 && step <= 4) {
          const uIndex = step - 1;
          const current = fixedUnits[uIndex];
          const isLio04 = (uIndex === 3);

          return h('div', { className: 'app-container max-w-xl mx-auto w-full px-4 justify-between' },
            h('div', { className: 'w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto' },
              h('div', null,
                h('div', { className: 'flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold' },
                  h('button', { onClick: () => setStep(step - 1), className: 'hover:underline' }, '← 前へ'),
                  h('span', null, step + ' / ' + (4 + devicePacks.length))
                ),
                h('h2', { className: 'text-2xl font-bold text-center text-[#F5D887] mb-2' }, current.title + ' 画面')
              ),
              h(SmartScannerCard, {
                onDataParsed: (parsed) => {
                  const updated = fixedUnits.slice();
                  if (parsed.model) updated[uIndex].model = parsed.model;
                  if (parsed.serial) updated[uIndex].serial = parsed.serial;
                  if (parsed.remarks) updated[uIndex].remarks = parsed.remarks;
                  setFixedUnits(updated);
                }
              }),
              h('div', { className: 'bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3' },
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#00ffcc]' }, '製品型式'),
                  h('input', { type: 'text', value: current.model, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].model = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: '型式を入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#F5D887]' }, 'シリアルNo'),
                  h('input', { type: 'text', value: current.serial, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].serial = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: 'シリアルを入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                ),
                h('div', null,
                  h('label', { className: 'block text-sm mb-1 font-bold text-[#ff6b6b]' }, '備考・Ver'),
                  h('input', { type: 'text', value: current.remarks, onChange: (e) => { const u = fixedUnits.slice(); u[uIndex].remarks = e.target.value.toUpperCase(); setFixedUnits(u); }, placeholder: '備考を入力', className: 'w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase' })
                )
              ),
              isLio04 && h('div', { className: 'mt-3' },
