<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsQR (QRコード解析用ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    input, select, textarea {
      color-scheme: dark;
    }
    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">
  <div id="root" class="h-full"></div>

  <script>
    // --- アプリケーション状態管理 ---
    const state = {
      apiKey: localStorage.getItem('GEMINI_API_KEY') || '',
      step: 0, // 0: TOP, 1~4: 固定ユニット, 5~: 各種機器, 999: プレビュー
      baseInfo: {
        docNo: '',
        modelName: '',
        entryDate: new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '/'),
        customer: '',
        unitNo: '',
        orderQty: '',
        elecStaff: ''
      },
      fixedUnits: [
        { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
        { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
        { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
        { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
      ],
      devicePacks: [
        { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
      ],
      ocrStatus: 'Status: 待機中',
      isCamActive: false,
      mediaStream: null
    };

    function saveState() {
      try {
        localStorage.setItem('GEMINI_API_KEY', state.apiKey);
      } catch(e) {}
    }

    // --- メインレンダリング関数 ---
    function render() {
      const root = document.getElementById('root');
      root.innerHTML = '';

      if (state.step === 0) {
        root.appendChild(renderHomeStep());
      } else if (state.step >= 1 && state.step <= 4) {
        root.appendChild(renderUnitStep(state.step - 1));
      } else if (state.step >= 5 && state.step < 999) {
        root.appendChild(renderDeviceStep(state.step - 5));
      } else if (state.step === 999) {
        root.appendChild(renderPreviewStep());
      }
    }

    // --- STEP 0: ホーム画面 ---
    function renderHomeStep() {
      const div = document.createElement('div');
      div.className = 'app-container max-w-xl mx-auto w-full px-4 justify-between';
      div.innerHTML = `
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        <div class="w-full flex-1 flex flex-col justify-evenly py-2">
          <div>
            <h1 class="text-3xl font-extrabold text-center text-[#F5D887] mb-1">QuickScan DB</h1>
            <p class="text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium">基本情報設定</p>
          </div>

          <div class="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2 space-y-3">
            <button id="loadCsvBtn" class="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base flex items-center justify-center gap-2 active:scale-95 shadow-md">
              📂 保存済みCSVを読み込んで編集・追記
            </button>
            <div>
              <label class="block text-sm font-bold text-[#F5D887] mb-1.5">🔑 APIキー設定 (任意)</label>
              <div class="flex gap-1.5">
                <input type="password" id="apiKeyInput" value="${state.apiKey}" placeholder="AIzaSy... (OCR利用時)" class="flex-1 bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
                <button id="saveKeyBtn" class="bg-[#F5D887] text-[#042219] font-bold px-4 py-2.5 rounded-xl text-base whitespace-nowrap active:scale-95">保存</button>
              </div>
            </div>
          </div>

          <div class="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
            <div>
              <label class="block text-sm font-bold mb-1">製造指図書No</label>
              <input type="text" id="docNoInput" value="${state.baseInfo.docNo}" placeholder="例: ORD-2026-X" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">機種名</label>
              <input type="text" id="modelNameInput" value="${state.baseInfo.modelName}" placeholder="例: MODEL-A100" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div class="flex gap-2">
              <div class="flex-1">
                <label class="block text-sm font-bold mb-1">記入日</label>
                <input type="text" value="${state.baseInfo.entryDate}" readonly class="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70 font-mono" />
              </div>
              <div class="flex-1">
                <label class="block text-sm font-bold mb-1">客先名</label>
                <input type="text" id="customerInput" value="${state.baseInfo.customer}" placeholder="例: TANAKA" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
              </div>
            </div>
            <div class="flex gap-2">
              <div class="flex-1">
                <label class="block text-sm font-bold mb-1">号機No</label>
                <input type="number" id="unitNoInput" value="${state.baseInfo.unitNo}" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
              </div>
              <div class="flex-1">
                <label class="block text-sm font-bold mb-1">発注台数</label>
                <input type="number" id="orderQtyInput" value="${state.baseInfo.orderQty}" placeholder="1" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base font-mono" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">エレキ担当</label>
              <input type="text" id="elecStaffInput" value="${state.baseInfo.elecStaff}" placeholder="例: YAMADA" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
          </div>
        </div>

        <div class="py-3">
          <button id="startBtn" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl">入力を開始 (電源ユニットへ)</button>
        </div>
      `;

      // イベント設定
      setTimeout(() => {
        document.getElementById('saveKeyBtn').onclick = () => {
          state.apiKey = document.getElementById('apiKeyInput').value.trim();
          saveState();
          alert('APIキーを保存しました');
        };
        document.getElementById('loadCsvBtn').onclick = () => document.getElementById('csvFileInput').click();
        document.getElementById('csvFileInput').onchange = handleCSVLoad;

        // 入力値バインド
        ['docNo', 'modelName', 'customer', 'unitNo', 'orderQty', 'elecStaff'].forEach(field => {
          const el = document.getElementById(field + 'Input');
          if (el) {
            el.oninput = (e) => { state.baseInfo[field] = e.target.value; };
          }
        });

        document.getElementById('startBtn').onclick = () => { state.step = 1; render(); };
      }, 0);

      return div;
    }

    // --- STEP 1~4: 固定ユニット入力画面 ---
    function renderUnitStep(uIndex) {
      const current = state.fixedUnits[uIndex];
      const totalSteps = 4 + state.devicePacks.length;
      const div = document.createElement('div');
      div.className = 'app-container max-w-xl mx-auto w-full px-4 justify-between';
      div.innerHTML = `
        <div class="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
          <div>
            <div class="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
              <button id="prevBtn" class="hover:underline">← 前へ</button>
              <span>${uIndex + 1} / ${totalSteps}</span>
            </div>
            <h2 class="text-2xl font-bold text-center text-[#F5D887] mb-2">${current.title} 画面</h2>
          </div>

          ${renderOcrCard(uIndex, 'fixed')}

          <div class="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
            <div>
              <label class="block text-sm mb-1 font-bold">製品型式</label>
              <input type="text" id="modelInput" value="${current.model}" placeholder="型式を入力" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div>
              <label class="block text-sm mb-1 font-bold">シリアルNo</label>
              <input type="text" id="serialInput" value="${current.serial}" placeholder="シリアルを入力" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div>
              <label class="block text-sm mb-1 font-bold">備考</label>
              <input type="text" id="remarksInput" value="${current.remarks}" placeholder="例: REV.A" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
          </div>
        </div>

        <div class="py-3">
          <button id="nextBtn" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
        </div>
      `;

      setTimeout(() => {
        setupOcrEvents(uIndex, 'fixed');
        document.getElementById('prevBtn').onclick = () => { stopCamera(); state.step = Math.max(0, state.step - 1); render(); };
        document.getElementById('nextBtn').onclick = () => { stopCamera(); state.step++; render(); };
        document.getElementById('modelInput').oninput = (e) => { current.model = e.target.value; };
        document.getElementById('serialInput').oninput = (e) => { current.serial = e.target.value; };
        document.getElementById('remarksInput').oninput = (e) => { current.remarks = e.target.value; };
      }, 0);

      return div;
    }

    // --- STEP 5+: 各種機器入力画面 ---
    function renderDeviceStep(sIndex) {
      const current = state.devicePacks[sIndex];
      const totalSteps = 4 + state.devicePacks.length;
      const currentStepNo = 5 + sIndex;
      const div = document.createElement('div');
      div.className = 'app-container max-w-xl mx-auto w-full px-4 justify-between';
      div.innerHTML = `
        <div class="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
          <div>
            <div class="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
              <button id="prevBtn" class="hover:underline">← 前へ</button>
              <span>${currentStepNo} / ${totalSteps}</span>
            </div>
            <h2 class="text-2xl font-bold text-center text-[#F5D887] mb-2">各種機器 ${sIndex + 1} 画面</h2>
          </div>

          ${renderOcrCard(sIndex, 'device')}

          <div class="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
            <div>
              <label class="block text-sm mb-1 font-bold">機器名称</label>
              <input type="text" id="titleInput" value="${current.title}" placeholder="例: サーボパック" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div>
              <label class="block text-sm mb-1 font-bold">製品型式</label>
              <input type="text" id="modelInput" value="${current.model}" placeholder="型式を入力" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
            <div>
              <label class="block text-sm font-bold">シリアルNo</label>
              <input type="text" id="serialInput" value="${current.serial}" placeholder="シリアルを入力" class="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" />
            </div>
          </div>

          <div class="mt-2">
            <button id="addDeviceBtn" class="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-3 rounded-xl text-base font-bold bg-[#F5D887]/10">＋ 機器追加</button>
          </div>
        </div>

        <div class="py-3 space-y-2">
          ${sIndex < state.devicePacks.length - 1 ? `<button id="nextDeviceBtn" class="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-base font-bold">次の各種機器へ</button>` : ''}
          <button id="finishBtn" class="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">入力結果へ (印刷プレビュー表示)</button>
        </div>
      `;

      setTimeout(() => {
        setupOcrEvents(sIndex, 'device');
        document.getElementById('prevBtn').onclick = () => { stopCamera(); state.step = Math.max(0, state.step - 1); render(); };
        document.getElementById('titleInput').oninput = (e) => { current.title = e.target.value; };
        document.getElementById('modelInput').oninput = (e) => { current.model = e.target.value; };
        document.getElementById('serialInput').oninput = (e) => { current.serial = e.target.value; };

        document.getElementById('addDeviceBtn').onclick = () => {
          stopCamera();
          state.devicePacks.push({ id: 'device_' + Date.now(), title: '', model: '', serial: '', remarks: '' });
          state.step = 4 + state.devicePacks.length;
          render();
        };

        const nextDev = document.getElementById('nextDeviceBtn');
        if (nextDev) {
          nextDev.onclick = () => { stopCamera(); state.step++; render(); };
        }

        document.getElementById('finishBtn').onclick = () => { stopCamera(); state.step = 999; render(); };
      }, 0);

      return div;
    }

    // --- OCRカードHTML
