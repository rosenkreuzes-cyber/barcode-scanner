<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB (超高速・起動保証版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    input, select, textarea {
      color-scheme: dark;
      text-transform: uppercase;
    }

    .app-container {
      min-height: 100dvh;
      height: 100dvh;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: max(0.5rem, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
    }

    /* 印刷用CSS */
    @media print {
      body, #root {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 11px !important;
        text-align: left;
        color: black !important;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      .print-large-text {
        font-size: 13px !important;
        font-weight: bold !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="h-full">

  <div id="root" class="h-full flex items-center justify-center">
    <div style="color: #E6DAA6; font-size: 18px; font-weight: bold;">起動中...</div>
  </div>

  <script type="text/babel">
    try {
      const { useState, useEffect, useRef } = React;

      // --- 超軽量・安定カメラ入力コンポーネント ---
      const SimpleScannerCard = ({ onScanSuccess }) => {
        const [isCamActive, setIsCamActive] = useState(false);
        const [status, setStatus] = useState('Status: 待機中');
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        const startCamera = async () => {
          try {
            setStatus('Status: カメラ起動中...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setIsCamActive(true);
            setStatus('Status: 撮影準備完了');
          } catch (e) {
            setStatus('Status: カメラ起動エラー');
            alert('カメラの起動に失敗しました。権限をご確認ください。');
          }
        };

        const stopCamera = () => {
          try {
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
          } catch (e) {}
          setIsCamActive(false);
        };

        useEffect(() => {
          return () => { stopCamera(); };
        }, []);

        const captureImage = () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!video || !canvas) return;

          const vWidth = video.videoWidth || 1280;
          const vHeight = video.videoHeight || 720;
          canvas.width = vWidth;
          canvas.height = vHeight;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          ctx.drawImage(video, 0, 0, vWidth, vHeight);
          setStatus('Status: キャプチャ完了！手動またはサンプル入力を反映します');
          
          // カメラ撮影時にサンプル値（またはプレースホルダー）を通知
          onScanSuccess({
            model: '',
            sn: '',
            remarks: ''
          });
        };

        return (
          <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 sm:p-4 rounded-2xl text-center mb-3 w-full shadow-lg">
            <div className="relative w-full h-48 sm:h-56 bg-black rounded-xl overflow-hidden flex items-center justify-center mb-2 border border-[#E6DAA6]/20">
              <video ref={videoRef} playsInline muted autoPlay className={`w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
              {!isCamActive && <span className="text-base text-[#E6DAA6]/70">📷 カメラ停止中</span>}
              <canvas ref={canvasRef} className="hidden" />
            </div>

            <div className="flex gap-2 mb-1">
              {!isCamActive ? (
                <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base">📷 カメラ起動</button>
              ) : (
                <button onClick={captureImage} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-3 rounded-xl text-base shadow-md">📸 撮影する</button>
              )}
            </div>
            <div className="text-xs text-[#00ffcc] font-mono font-bold">{status}</div>
          </div>
        );
      };

      // --- メインアプリケーション ---
      function MainApp() {
        const fileInputRef = useRef(null);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
        const yymmdd = `${yy}${mm}${dd}`;

        const [baseInfo, setBaseInfo] = useState({
          docNo: '', modelName: '', entryDate: todayFormatted, customer: '', unitNo: '', orderQty: '', elecStaff: ''
        });

        const [fixedUnits, setFixedUnits] = useState([
          { id: 'power', title: '電源ユニット', model: '', serial: '', remarks: '' },
          { id: 'cpu', title: 'CPU', model: '', serial: '', remarks: '' },
          { id: 'base', title: 'ベースユニット', model: '', serial: '', remarks: '' },
          { id: 'lio', title: 'LIO-04', model: '', serial: '', remarks: '' }
        ]);

        const [devicePacks, setDevicePacks] = useState([
          { id: 'device_1', title: '', model: '', serial: '', remarks: '' }
        ]);

        const [step, setStep] = useState(0);

        const handleNextFromHome = () => setStep(1);

        const handleAddDevice = () => {
          const nextIndex = devicePacks.length + 1;
          setDevicePacks([...devicePacks, { id: `device_${Date.now()}`, title: '', model: '', serial: '', remarks: '' }]);
          setStep(4 + nextIndex);
        };

        const handleGoTop = () => {
          if (window.confirm('TOP画面に戻りますか？')) setStep(0);
        };

        const handlePrint = () => window.print();

        const handleLoadCSV = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
              const clean = (val) => val ? val.replace(/^"|"$/g, '').trim().toUpperCase() : '';

              let newBaseInfo = { ...baseInfo };
              lines.forEach(line => {
                const cols = line.split(',').map(clean);
                if (cols[0].includes('製造指図書')) { newBaseInfo.docNo = cols[1] || ''; newBaseInfo.customer = cols[3] || ''; }
                else if (cols[0] === '機種名') { newBaseInfo.modelName = cols[1] || ''; newBaseInfo.unitNo = cols[3] || ''; }
                else if (cols[0] === '記入日') { newBaseInfo.entryDate = cols[1] || todayFormatted; newBaseInfo.orderQty = cols[3] || ''; }
                else if (cols[2] === 'エレキ担当') { newBaseInfo.elecStaff = cols[3] || ''; }
              });
              setBaseInfo(newBaseInfo);
              alert('CSVを読み込みました。');
            } catch (err) { alert('読み込み失敗'); }
          };
          reader.readAsText(file, 'UTF-8');
        };

        const handleSaveCSV = () => {
          const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_').toUpperCase();
          const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種'}_${sanitize(baseInfo.docNo) || '指図書'}.csv`;

          let csvContent = "\uFEFF";
          csvContent += `製造指図書No,${(baseInfo.docNo || '').toUpperCase()},客先名,${(baseInfo.customer || '').toUpperCase()}\n`;
          csvContent += `機種名,${(baseInfo.modelName || '').toUpperCase()},号機No,${baseInfo.unitNo}\n`;
          csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
          csvContent += `,,エレキ担当,${(baseInfo.elecStaff || '').toUpperCase()}\n\n`;
          csvContent += `No,製品型式,シリアルNo,機器名称,備考\n`;

          const allItems = [
            ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
            ...devicePacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
          ];

          for (let i = 1; i <= 25; i++) {
            const item = allItems[i - 1] || {};
            csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        // --- STEP 0: 初期画面 ---
        if (step === 0) {
          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <input type="file" accept=".csv" ref={fileInputRef} onChange={handleLoadCSV} className="hidden" />

              <div className="w-full flex-1 flex flex-col justify-evenly py-2">
                <div>
                  <h1 className="text-3xl font-extrabold text-center text-[#F5D887] mb-1">QuickScan DB</h1>
                  <p className="text-sm text-center text-[#E6DAA6]/80 mb-2 font-medium">基本情報設定</p>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-2">
                  <button onClick={() => fileInputRef.current?.click()} className="w-full bg-[#093325] border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded-xl text-base shadow-md">
                    📂 保存済みCSVを読み込む
                  </button>
                </div>

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm font-bold mb-1">製造指図書No</label>
                    <input type="text" value={baseInfo.docNo} onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value.toUpperCase()})} placeholder="例: ORD-2026-X" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">機種名</label>
                    <input type="text" value={baseInfo.modelName} onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value.toUpperCase()})} placeholder="例: MODEL-A100" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1"><label className="block text-sm font-bold mb-1">記入日</label><input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-xl px-3 py-2.5 text-base opacity-70" /></div>
                    <div className="flex-1"><label className="block text-sm font-bold mb-1">客先名</label><input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value.toUpperCase()})} placeholder="客先名" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" /></div>
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1"><label className="block text-sm font-bold mb-1">号機No</label><input type="number" value={baseInfo.unitNo} onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})} placeholder="1" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" /></div>
                    <div className="flex-1"><label className="block text-sm font-bold mb-1">発注台数</label><input type="number" value={baseInfo.orderQty} onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})} placeholder="1" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base" /></div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-1">エレキ担当</label>
                    <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value.toUpperCase()})} placeholder="担当者名" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                </div>
              </div>

              <div className="py-3">
                <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-xl">入力を開始</button>
              </div>
            </div>
          );
        }

        // --- STEP 1~4: 固定ユニット画面 ---
        if (step >= 1 && step <= 4) {
          const uIndex = step - 1;
          const current = fixedUnits[uIndex];
          const isLio04 = (uIndex === 3);

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">{current.title} 画面</h2>
                </div>

                <SimpleScannerCard
                  onScanSuccess={(res) => {
                    // 必要に応じてカメラプレビュー撮影時の処理を拡張可能
                  }}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式</label>
                    <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="型式" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">シリアルNo</label>
                    <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="シリアル" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">備考 (バージョン情報等)</label>
                    <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value.toUpperCase(); setFixedUnits(u); }} placeholder="例: A03" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                </div>

                {isLio04 && (
                  <div className="mt-3">
                    <button onClick={handleAddDevice} className="w-full border border-dashed border-[#00ffcc] text-[#00ffcc] py-3 rounded-xl text-base font-bold bg-[#00ffcc]/10 shadow-md">＋ 機器追加へ進む</button>
                  </div>
                )}
              </div>

              <div className="py-3">
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-4 rounded-full text-lg shadow-lg">次へ</button>
              </div>
            </div>
          );
        }

        // --- STEP 5+: 各種機器画面 ---
        if (step >= 5 && step < 999) {
          const sIndex = step - 5;
          const current = devicePacks[sIndex];

          return (
            <div className="app-container max-w-xl mx-auto w-full px-4 justify-between">
              <div className="w-full flex-1 flex flex-col justify-between py-1 overflow-y-auto">
                <div>
                  <div className="flex justify-between text-base mb-1 text-[#E6DAA6]/90 font-bold">
                    <button onClick={() => setStep(step - 1)} className="hover:underline">← 前へ</button>
                    <span>{step} / {4 + devicePacks.length}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-center text-[#F5D887] mb-2">各種機器 {sIndex + 1} 画面</h2>
                </div>

                <SimpleScannerCard
                  onScanSuccess={(res) => {}}
                />

                <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                  <div>
                    <label className="block text-sm mb-1 font-bold">機器名称</label>
                    <input type="text" value={current.title} onChange={(e) => { const s = [...devicePacks]; s[sIndex].title = e.target.value.toUpperCase(); setDevicePacks(s); }} placeholder="機器名称" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-xl px-3 py-2.5 text-base uppercase" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1 font-bold">製品型式</label>
                    <input type="text"
