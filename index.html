<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#042219" />
  <title>シリアル記入シート - QuickScan DB</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #042219;
      color: #E6DAA6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    input, select, textarea {
      color-scheme: dark;
    }

    /* 印刷用A4縦1ページスタイル */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 4px 6px;
        font-size: 10px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2 !important;
        font-weight: bold;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- 1. APIキー管理 Context ---
    const ApiKeyContext = createContext();

    const ApiKeyProvider = ({ children }) => {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('GEMINI_API_KEY', key);
      };

      return (
        <ApiKeyContext.Provider value={{ apiKey, saveApiKey }}>
          {children}
        </ApiKeyContext.Provider>
      );
    };

    const useApiKey = () => useContext(ApiKeyContext);

    // --- 2. AI OCR カメラ・解析コンポーネント ---
    const OcrScannerCard = ({ onOcrSuccess }) => {
      const { apiKey } = useApiKey();
      const [isCamActive, setIsCamActive] = useState(false);
      const [status, setStatus] = useState('Status: 待機中');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setIsCamActive(true);
          setStatus('Status: 撮影準備完了');
        } catch (e) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setIsCamActive(false);
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const captureAndAnalyze = async () => {
        if (!apiKey) {
          alert('APIキーが設定されていません。');
          return;
        }

        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas) return;

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        setStatus('Status: AI (Gemini) 解析中...');

        const promptText = `添付された銘板画像から製品型式("model")、シリアル番号("sn")を抽出しJSON形式で出力してください。
JSON形式例: {"model": "...", "sn": "..."}`;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                ]
              }]
            })
          });

          const data = await res.json();
          if (data.error) {
            setStatus(`Status: エラー (${data.error.message})`);
            return;
          }

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            setStatus('Status: 解析成功！');
            onOcrSuccess({
              model: parsed.model !== '未検出' ? parsed.model : '',
              sn: parsed.sn !== '未検出' ? parsed.sn : ''
            });
          } else {
            setStatus('Status: 解析失敗');
          }
        } catch (err) {
          setStatus(`Status: 通信エラー (${err.message})`);
        }
      };

      return (
        <div className="bg-[#093325]/90 border border-[#E6DAA6]/30 p-3 rounded-xl text-center mb-4">
          <div className="relative w-full h-40 bg-black rounded-lg overflow-hidden flex items-center justify-center mb-2">
            <video ref={videoRef} playsInline muted className={`w-full h-full object-cover ${!isCamActive ? 'hidden' : ''}`} />
            {!isCamActive && <span className="text-xs text-gray-400">📷 カメラ停止中</span>}
            <canvas ref={canvasRef} className="hidden" />
          </div>

          <div className="flex gap-2 mb-2">
            {!isCamActive ? (
              <button onClick={startCamera} className="flex-1 bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold py-2 rounded-lg text-xs">📷 カメラ起動</button>
            ) : (
              <button onClick={captureAndAnalyze} className="flex-1 bg-[#F5D887] text-[#042219] font-bold py-2 rounded-lg text-xs">☁️ 撮影 & AI OCR解析</button>
            )}
          </div>
          <div className="text-[11px] text-[#00ffcc] font-mono">{status}</div>
        </div>
      );
    };

    // --- 3. メインアプリケーション ---
    function MainApp() {
      const { apiKey, saveApiKey } = useApiKey();
      const [inputKey, setInputKey] = useState(apiKey);

      // 今日の日付 (YYMMDD)
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayFormatted = `${now.getFullYear()}/${mm}/${dd}`;
      const yymmdd = `${yy}${mm}${dd}`;

      // 基本情報
      const [baseInfo, setBaseInfo] = useState({
        docNo: '',
        modelName: '',
        entryDate: todayFormatted,
        customer: '',
        unitNo: '',
        orderQty: '',
        elecStaff: ''
      });

      // ユニットデータ
      const [fixedUnits, setFixedUnits] = useState([
        { id: 'power', title: '電源ユニット', model: 'JPMC-PSD3012N', serial: '', remarks: '' },
        { id: 'cpu', title: 'CPU', model: 'JPMC-CP3202N-E', serial: '', remarks: '' },
        { id: 'base', title: 'ベースユニット', model: 'JPMC-BUB3008N-E', serial: '', remarks: '' },
        { id: 'lio', title: 'LIO-04', model: 'JPMC-IO2303-E', serial: '', remarks: '' }
      ]);

      const [servoPacks, setServoPacks] = useState([
        { id: 'servo_1', title: 'サーボパック 1', model: 'SGD7S-1R6A00A', serial: '', remarks: '' }
      ]);

      const [step, setStep] = useState(0);

      const handleSaveKey = () => {
        if (!inputKey.trim()) return alert('APIキーを入力してください');
        saveApiKey(inputKey.trim());
        alert('APIキーを保存しました');
      };

      const handleNextFromHome = () => {
        if (!apiKey.trim()) return alert('APIキーを設定してください');
        setStep(1);
      };

      const handleAddServo = () => {
        const nextIndex = servoPacks.length + 1;
        setServoPacks([
          ...servoPacks,
          { id: `servo_${Date.now()}`, title: `サーボパック ${nextIndex}`, model: 'SGD7S-1R6A00A', serial: '', remarks: '' }
        ]);
      };

      // --- CSV保存機能 (yymmdd_機種名_製造指図書No_号機) ---
      const handleSaveCSV = () => {
        const sanitize = (str) => (str || '').replace(/[/\\?%*:|"<>]/g, '_');
        const filename = `${yymmdd}_${sanitize(baseInfo.modelName) || '機種名'}_${sanitize(baseInfo.docNo) || '指図書No'}_${sanitize(baseInfo.unitNo) || '号機'}.csv`;

        let csvContent = "\uFEFF"; // BOM付与
        csvContent += `製造指図書No,${baseInfo.docNo},客先名,${baseInfo.customer}\n`;
        csvContent += `機種名,${baseInfo.modelName},号機No,${baseInfo.unitNo}\n`;
        csvContent += `記入日,${baseInfo.entryDate},発注台数,${baseInfo.orderQty}\n`;
        csvContent += `,,,エレキ担当,${baseInfo.elecStaff}\n\n`;
        csvContent += `No,製品型式,シリアルNo,機器名称,備考\n`;

        // 結合データ
        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...servoPacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        for (let i = 1; i <= 25; i++) {
          const item = allItems[i - 1] || {};
          csvContent += `${i},"${item.model || ''}","${item.serial || ''}","${item.title || ''}","${item.remarks || ''}"\n`;
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // --- 印刷 & 外部アプリ連携 ---
      const handlePrint = () => {
        // 標準印刷実行
        window.print();

        // Sharp Desktop Mobile / 外部印刷アプリ連携呼び出し (ディープリンク試行)
        setTimeout(() => {
          if (confirm("SHARP Desktop Mobile などの外部印刷アプリを開きますか？")) {
            window.location.href = "sharpdesktopmobile://"; 
          }
        }, 500);
      };

      // --- STEP 0: 初期画面 ---
      if (step === 0) {
        return (
          <div className="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">
            <div>
              <h1 className="text-2xl font-bold text-center text-[#F5D887] mt-4 mb-1">QuickScan DB</h1>
              <p className="text-xs text-center text-[#E6DAA6]/70 mb-6">基本情報設定</p>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl mb-4">
                <label className="block text-xs font-bold text-[#F5D887] mb-1">🔑 APIキー設定 (必須)</label>
                <div className="flex gap-2">
                  <input type="password" value={inputKey} onChange={(e) => setInputKey(e.target.value)} placeholder="AIzaSy..." className="flex-1 bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                  <button onClick={handleSaveKey} className="bg-[#F5D887] text-[#042219] font-bold px-4 py-2 rounded-lg text-sm">保存</button>
                </div>
              </div>

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-xs font-bold mb-1">製造指図書No</label>
                  <input type="text" value={baseInfo.docNo} onChange={(e) => setBaseInfo({...baseInfo, docNo: e.target.value})} placeholder="例: ORD-2026-X" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">機種名</label>
                  <input type="text" value={baseInfo.modelName} onChange={(e) => setBaseInfo({...baseInfo, modelName: e.target.value})} placeholder="例: MODEL-A100" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">記入日 (自動)</label>
                    <input type="text" value={baseInfo.entryDate} readOnly className="w-full bg-[#042219]/50 border border-[#E6DAA6]/20 rounded-lg px-3 py-2 text-sm opacity-70" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">客先名</label>
                    <input type="text" value={baseInfo.customer} onChange={(e) => setBaseInfo({...baseInfo, customer: e.target.value})} placeholder="例: TANAKA CORP" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                  </div>
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">号機No</label>
                    <input type="text" value={baseInfo.unitNo} onChange={(e) => setBaseInfo({...baseInfo, unitNo: e.target.value})} placeholder="1" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-bold mb-1">発注台数</label>
                    <input type="text" value={baseInfo.orderQty} onChange={(e) => setBaseInfo({...baseInfo, orderQty: e.target.value})} placeholder="1" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">エレキ担当</label>
                  <input type="text" value={baseInfo.elecStaff} onChange={(e) => setBaseInfo({...baseInfo, elecStaff: e.target.value})} placeholder="例: YAMADA" className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>
            </div>

            <div className="my-6">
              <button onClick={handleNextFromHome} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3.5 rounded-full text-base shadow-lg">入力・スキャンを開始 (電源ユニットへ)</button>
            </div>
          </div>
        );
      }

      // --- STEP 1~4: 固定ユニット画面 ---
      if (step >= 1 && step <= 4) {
        const uIndex = step - 1;
        const current = fixedUnits[uIndex];

        return (
          <div className="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">
            <div>
              <div className="flex justify-between text-sm mb-2">
                <button onClick={() => setStep(step - 1)}>← 前へ</button>
                <span>{step} / {4 + servoPacks.length}</span>
              </div>
              <h2 className="text-xl font-bold text-center text-[#F5D887] mb-3">{current.title} 画面</h2>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...fixedUnits];
                if (res.model) updated[uIndex].model = res.model;
                if (res.sn) updated[uIndex].serial = res.sn;
                setFixedUnits(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-xs mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].model = e.target.value; setFixedUnits(u); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].serial = e.target.value; setFixedUnits(u); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">備考</label>
                  <input type="text" value={current.remarks} onChange={(e) => { const u = [...fixedUnits]; u[uIndex].remarks = e.target.value; setFixedUnits(u); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>
            </div>

            <div className="my-6">
              <button onClick={() => setStep(step + 1)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3.5 rounded-full text-base">次へ</button>
            </div>
          </div>
        );
      }

      // --- STEP 5+: サーボパック画面 ---
      if (step >= 5 && step < 999) {
        const sIndex = step - 5;
        const current = servoPacks[sIndex];

        return (
          <div className="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">
            <div>
              <div className="flex justify-between text-sm mb-2">
                <button onClick={() => setStep(step - 1)}>← 前へ</button>
                <span>{step} / {4 + servoPacks.length}</span>
              </div>
              <h2 className="text-xl font-bold text-center text-[#F5D887] mb-3">{current.title} 画面</h2>

              <OcrScannerCard onOcrSuccess={(res) => {
                const updated = [...servoPacks];
                if (res.model) updated[sIndex].model = res.model;
                if (res.sn) updated[sIndex].serial = res.sn;
                setServoPacks(updated);
              }} />

              <div className="bg-[#093325]/80 border border-[#E6DAA6]/30 p-4 rounded-2xl space-y-3">
                <div>
                  <label className="block text-xs mb-1 font-bold">製品型式</label>
                  <input type="text" value={current.model} onChange={(e) => { const s = [...servoPacks]; s[sIndex].model = e.target.value; setServoPacks(s); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">シリアルNo</label>
                  <input type="text" value={current.serial} onChange={(e) => { const s = [...servoPacks]; s[sIndex].serial = e.target.value; setServoPacks(s); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs mb-1 font-bold">機器名称 (タイトル)</label>
                  <input type="text" value={current.title} onChange={(e) => { const s = [...servoPacks]; s[sIndex].title = e.target.value; setServoPacks(s); }} className="w-full bg-[#042219] border border-[#E6DAA6]/40 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>

              <div className="mt-4 space-y-2">
                <button onClick={handleAddServo} className="w-full border border-dashed border-[#F5D887] text-[#F5D887] py-2.5 rounded-xl text-sm font-bold bg-[#F5D887]/10">＋ 機器追加 (次のサーボパックを追加)</button>
              </div>
            </div>

            <div className="my-6 space-y-2">
              {sIndex < servoPacks.length - 1 && (
                <button onClick={() => setStep(step + 1)} className="w-full bg-[#093325] border border-[#E6DAA6] text-[#E6DAA6] py-3 rounded-full text-sm font-bold">次のサーボパックへ</button>
              )}
              <button onClick={() => setStep(999)} className="w-full bg-[#F5D887] text-[#042219] font-bold py-3.5 rounded-full text-base">入力結果へ (印刷プレビュー表示)</button>
            </div>
          </div>
        );
      }

      // --- STEP 999: 入力結果 & 印刷用シリアル記入シート (1〜25行固定) ---
      if (step === 999) {
        // 固定ユニットとサーボパックのデータを統合
        const allItems = [
          ...fixedUnits.map(u => ({ model: u.model, serial: u.serial, title: u.title, remarks: u.remarks })),
          ...servoPacks.map(s => ({ model: s.model, serial: s.serial, title: s.title, remarks: s.remarks }))
        ];

        // 1~25行分の配列を生成
        const rows = Array.from({ length: 25 }, (_, index) => {
          return allItems[index] || { model: '', serial: '', title: '', remarks: '' };
        });

        return (
          <div className="min-h-screen p-4 max-w-3xl mx-auto">
            {/* 操作ボタンエリア (非印刷) */}
            <div className="no-print flex flex-wrap justify-between items-center gap-2 mb-6">
              <button onClick={() => setStep(4 + servoPacks.length)} className="text-[#E6DAA6] text-sm">← 修正に戻る</button>
              <div className="flex gap-2">
                <button onClick={handleSaveCSV} className="bg-[#093325] border border-[#00ffcc] text-[#00ffcc] font-bold px-4 py-2 rounded-full text-sm">
                  💾 CSV保存 (Download)
                </button>
                <button onClick={handlePrint} className="bg-[#F5D887] text-[#042219] font-bold px-5 py-2 rounded-full text-sm">
                  🖨️ 印刷 (Sharp Desktop)
                </button>
              </div>
            </div>

            {/* A4印刷エリア */}
            <div className="print-area bg-white text-black p-6 rounded-lg shadow-xl">
              {/* タイトル */}
              <h1 className="text-center font-bold text-xl mb-4 tracking-widest border-b-2 border-black pb-1">シリアル記入シート</h1>

              {/* 上部ヘッダー情報エリア */}
              <div className="flex w-full mb-4 gap-2 text-xs">
                {/* 左側: 縦3行 (製造指図書No, 機種名, 記入日) */}
                <div className="w-5/12 border border-black p-2 space-y-1.5 font-bold">
                  <div>製造指図書No: <span className="font-normal">{baseInfo.docNo}</span></div>
                  <div>機種名: <span className="font-normal">{baseInfo.modelName}</span></div>
                  <div>記入日: <span className="font-normal">{baseInfo.entryDate}</span></div>
                </div>

                {/* 右側: 4列を枠で囲む (客先名, 号機No, 発注台数, エレキ担当) */}
                <div className="w-7/12 border border-black p-1">
                  <table className="w-full h-full text-center border-collapse">
                    <thead>
                      <tr className="bg-gray-100 border-b border-black">
                        <th className="border-r border-black p-1 w-1/4">客先名</th>
                        <th className="border-r border-black p-1 w-1/4">号機No</th>
                        <th className="border-r border-black p-1 w-1/4">発注台数</th>
                        <th className="p-1 w-1/4">エレキ担当</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr className="h-full">
                        <td className="border-r border-black p-1">{baseInfo.customer}</td>
                        <td className="border-r border-black p-1">{baseInfo.unitNo}</td>
                        <td className="border-r border-black p-1">{baseInfo.orderQty}</td>
                        <td className="p-1">{baseInfo.elecStaff}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 明細テーブル (1〜25行固定) */}
              <table className="w-full text-xs border-collapse border border-black">
                <thead>
                  <tr className="bg-gray-200 border-b border-black">
                    <th className="border-r border-black p-1 text-center w-8">No</th>
                    <th className="border-r border-black p-1 w-1/3">製品型式</th>
                    <th className="border-r border-black p-1 w-1/3">シリアルNo</th>
                    <th className="border-r border-black p-1 w-1/4">機器名称</th>
                    <th className="p-1">備考</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row, idx) => (
                    <tr key={idx} className="border-b border-black h-6">
                      <td className="border-r border-black text-center font-mono font-bold bg-gray-50">{idx + 1}</td>
                      <td className="border-r border-black px-1 font-mono">{row.model}</td>
                      <td className="border-r border-black px-1 font-mono">{row.serial}</td>
                      <td className="border-r border-black px-1">{row.title}</td>
                      <td className="px-1">{row.remarks}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      return null;
    }

    function App() {
      return (
        <ApiKeyProvider>
          <MainApp />
        </ApiKeyProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
